name: PR Body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Test the checker
        run: python3 -m unittest discover -s .github/scripts/pr-body -p 'test_*.py'
      - name: Check the PR body against the template
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .github/scripts/pr-body/check_pr_body.py .github/pull_request_template.md "$RUNNER_TEMP/pr-body.md"
