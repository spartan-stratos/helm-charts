name: Helm Check

on: pull_request

jobs:
  helm-check:
    strategy:
      matrix:
        chart: [ spartan, datadog, lgtm-stack, spartan-alerts, lgtm-tenant-client ]

    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 3
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Helm repo add
        if: matrix.chart == 'datadog' # for datadog chart only
        run: |
          helm repo add datadog https://helm.datadoghq.com
          helm repo add prometheus https://prometheus-community.github.io/helm-charts

      - name: Helm dependency build
        if: matrix.chart == 'datadog' # for datadog chart only
        run: helm dependency build ./charts/${{ matrix.chart }}

      - name: helm-check-default
        if: matrix.chart != 'lgtm-stack' && matrix.chart != 'lgtm-tenant-client' # required values checked below
        uses: igabaydulin/helm-check-action@0.1.4
        env:
          CHART_LOCATION: ./charts/${{ matrix.chart }}
          CHART_VALUES: ./charts/${{ matrix.chart }}/values.yaml

      - name: helm-check-required-values
        if: matrix.chart == 'lgtm-stack' || matrix.chart == 'lgtm-tenant-client'
        uses: igabaydulin/helm-check-action@0.1.4
        env:
          CHART_LOCATION: ./charts/${{ matrix.chart }}
          CHART_VALUES: ./charts/${{ matrix.chart }}/ci/test-values.yaml

      - name: helm-check-enabled-all
        if: matrix.chart == 'spartan' # for spartan chart only
        uses: igabaydulin/helm-check-action@0.1.4
        env:
          CHART_LOCATION: ./charts/spartan
          CHART_VALUES: ./test/values.yaml

      # Helm and helm-unittest pinned so a runner image change cannot break CI; Helm 4 refuses unsigned git plugins by default
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.3.1

      - name: Install helm-unittest plugin
        run: |
          helm plugin install --verify=false --version v1.2.1 https://github.com/helm-unittest/helm-unittest.git

      - name: Run helm-unittest
        run: |
          echo "Running unittest for ${{ matrix.chart }}} chart"
          helm unittest "charts/${{ matrix.chart }}"

      - name: Run promtool rule tests
        if: matrix.chart == 'lgtm-stack' # yq is preinstalled on the runner
        run: |
          curl -sSL https://github.com/prometheus/prometheus/releases/download/v3.5.0/prometheus-3.5.0.linux-amd64.tar.gz \
            | sudo tar -xz --strip-components=1 -C /usr/local/bin prometheus-3.5.0.linux-amd64/promtool
          charts/${{ matrix.chart }}/files/tests/test-rules.sh

      - name: Install alert check tools
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/install-tools.sh

      - name: Check alert checker fixtures
        if: matrix.chart == 'spartan-alerts'
        run: python3 .github/scripts/spartan-alerts/check-rendered.py --self-test

      - name: Check scalar catalogue
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/check.sh --chart-dir charts/spartan-alerts --values-file charts/spartan-alerts/files/tests/catalogue-values.yaml --namespace default --service-name catalogue-test

      - name: Check reusable workflow invocation
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/check.sh --chart-dir charts/spartan-alerts --values-files charts/spartan-alerts/files/tests/catalogue-values.yaml --namespace default --release-name alerts --service-names '' --tests-file ''

      - name: Check workloads catalogue
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/check.sh --chart-dir charts/spartan-alerts --values-file charts/spartan-alerts/files/tests/catalogue-workloads-values.yaml --namespace default --service-name catalogue-test

      - name: Test scalar and workloads rules
        if: matrix.chart == 'spartan-alerts'
        run: bash charts/spartan-alerts/files/tests/test-rules.sh

      - name: Check quoted pod regex
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/check.sh --chart-dir charts/spartan-alerts --values-file charts/spartan-alerts/files/tests/catalogue-values.yaml --namespace default --service-name catalogue-test --set-string 'catalogue.podRegex=app-[a-z0-9]{9\,10}'

      - name: Check negative controls
        if: matrix.chart == 'spartan-alerts'
        run: bash .github/scripts/spartan-alerts/check.sh --chart-dir charts/spartan-alerts --namespace default --negative-controls

      - name: Fetch base for chart bump check
        if: matrix.chart == 'spartan-alerts'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git fetch origin "$BASE_SHA"

      - name: Require shipped checker chart bump
        if: matrix.chart == 'spartan-alerts'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash .github/scripts/spartan-alerts/require-chart-bump.sh "$BASE_SHA"

      - name: Check bundled dashboards
        if: matrix.chart == 'lgtm-stack' # jq is preinstalled on the runner
        run: charts/lgtm-stack/files/tests/test-dashboards.sh
