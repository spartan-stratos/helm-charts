suite: "PodDisruptionBudget template tests"

templates:
  - "templates/pdb.yaml"

tests:
  - it: "should be created when pdb is enabled and replicaCount > 1"
    set:
      replicaCount: 2
      pdb.enabled: true
      autoscaling.enabled: false
      autoscaling.minReplicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: "should be created when replicaCount is 1 and autoscaling is enabled with minReplicas > 1"
    set:
      replicaCount: 1
      pdb.enabled: true
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: "should be created when replicaCount > 1 and autoscaling is enabled with minReplicas > 1"
    set:
      replicaCount: 2
      pdb.enabled: true
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: "should not be created when pdb and autoscaling are disabled"
    set:
      replicaCount: 1
      pdb.enabled: false
      autoscaling.enabled: false
      autoscaling.minReplicas: 1
    asserts:
      - notExists:
          path: PodDisruptionBudget

  - it: "should not be created when pdb is disabled and autoscaling is enabled"
    set:
      replicaCount: 1
      pdb.enabled: false
      autoscaling.enabled: true
      autoscaling.minReplicas: 2
    asserts:
      - notExists:
          path: PodDisruptionBudget

  - it: "should not be created when pdb is enabled with minReplicas is 1"
    set:
      replicaCount: 1
      pdb.enabled: true
      autoscaling.enabled: false
      autoscaling.minReplicas: 1
    asserts:
      - notExists:
          path: PodDisruptionBudget

  - it: "should not be created when autoscaling is enabled with minReplicas is 1"
    set:
      replicaCount: 1
      pdb.enabled: true
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
    asserts:
      - notExists:
          path: PodDisruptionBudget

  - it: "should not be created when replicaCount > 1 and autoscaling is enabled with minReplicas is 1"
    set:
      replicaCount: 2
      pdb.enabled: true
      autoscaling.enabled: true
      autoscaling.minReplicas: 1
    asserts:
      - notExists:
          path: PodDisruptionBudget

  - it: "should read the floor from keda.minReplicas with both flags"
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
      autoscaling.enabled: true
      keda.enabled: true
      keda.minReplicas: 3
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: "should not be created at a KEDA floor of one with both flags, whatever autoscaling.minReplicas says"
    set:
      pdb.enabled: true
      pdb.minAvailable: 1
      autoscaling.enabled: true
      autoscaling.minReplicas: 3
      keda.enabled: true
      keda.minReplicas: 1
    asserts:
      - hasDocuments:
          count: 0

  - it: "should read the floor from keda.minReplicas on a KEDA-only release"
    set:
      replicaCount: 1
      pdb.enabled: true
      pdb.minAvailable: 1
      autoscaling.enabled: false
      keda.enabled: true
      keda.minReplicas: 3
    asserts:
      - isKind:
          of: PodDisruptionBudget

  - it: "should not be created at a KEDA floor of one on a KEDA-only release, whatever replicaCount says"
    set:
      replicaCount: 3
      pdb.enabled: true
      pdb.minAvailable: 1
      autoscaling.enabled: false
      keda.enabled: true
      keda.minReplicas: 1
    asserts:
      - hasDocuments:
          count: 0
