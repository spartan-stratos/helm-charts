suite: "File log sidecar"

templates:
  - "templates/deployment.yaml"
  - "templates/worker.yaml"
  - "templates/log-sidecar-configmap.yaml"
  - "templates/configmap.yaml"
  - "templates/secret.yaml"

set:
  observability.logs.fileSidecar:
    enabled: true
    cluster: example-cluster

tests:
  - it: "renders nothing when off"
    set:
      observability.logs.fileSidecar.enabled: false
    template: "templates/log-sidecar-configmap.yaml"
    asserts:
      - hasDocuments:
          count: 0

  - it: "fails without a cluster name"
    set:
      observability.logs.fileSidecar.cluster: ""
    template: "templates/deployment.yaml"
    asserts:
      - failedTemplate:
          errorMessage: "observability.logs.fileSidecar.cluster is required"

  - it: "adds a native sidecar and its own log volume when no sidecar shares the directory"
    template: "templates/deployment.yaml"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: log-sidecar
      - equal:
          path: spec.template.spec.initContainers[0].restartPolicy
          value: Always
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: SERVICE_NAME, valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/name']" } } }
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: log-sidecar-logs, mountPath: /var/log/application, readOnly: true }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: log-sidecar-logs, mountPath: /var/log/application }
      - contains:
          path: spec.template.spec.volumes
          content: { name: log-sidecar-logs, emptyDir: {} }
      - exists:
          path: spec.template.metadata.annotations["checksum/log-sidecar"]

  - it: "reads the directory a sidecar already shares, e.g. the datadog-agent's"
    template: "templates/deployment.yaml"
    set:
      sidecars:
        - name: datadog-agent
          image: datadog/agent
          sharedVolume: { mountPath: /var/log/application/ }
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: sidecar-volume, mountPath: /var/log/application, subPath: datadog-agent, readOnly: true }
      - notContains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: log-sidecar-logs, mountPath: /var/log/application }
      - notContains:
          path: spec.template.spec.volumes
          content: { name: log-sidecar-logs, emptyDir: {} }

  - it: "does not read a hook-only sidecar's directory on the Deployment"
    template: "templates/deployment.yaml"
    set:
      sidecars:
        - name: log-collector
          image: fluent/fluent-bit
          skipDeployment: true
          sharedVolume: { mountPath: /var/log/application/ }
    asserts:
      - contains:
          path: spec.template.spec.initContainers[0].volumeMounts
          content: { name: log-sidecar-logs, mountPath: /var/log/application, readOnly: true }

  - it: "caps its own volume when sizeLimit is set"
    template: "templates/deployment.yaml"
    set:
      observability.logs.fileSidecar.sizeLimit: 1Gi
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content: { name: log-sidecar-logs, emptyDir: { sizeLimit: 1Gi } }

  - it: "names each worker's lines from its app.kubernetes.io/name label, as the node Alloy does"
    template: "templates/worker.yaml"
    set:
      workers:
        - name: general
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].name
          value: log-sidecar
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: spartan-general
      - contains:
          path: spec.template.spec.initContainers[0].env
          content: { name: SERVICE_NAME, valueFrom: { fieldRef: { fieldPath: "metadata.labels['app.kubernetes.io/name']" } } }
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content: { name: log-sidecar-logs, mountPath: /var/log/application }

  - it: "tails path/glob and labels the lines"
    template: "templates/log-sidecar-configmap.yaml"
    set:
      observability.logs.fileSidecar.path: /app/logs/
      observability.logs.fileSidecar.glob: "*.json"
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: '"__path__" = "/app/logs/\*\.json"'
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'collector    = "file-sidecar"'

  - it: "waits drainSeconds before stopping and runs locked down"
    template: "templates/deployment.yaml"
    asserts:
      - equal:
          path: spec.template.spec.initContainers[0].lifecycle.preStop.sleep.seconds
          value: 5
      - equal:
          path: spec.template.spec.initContainers[0].securityContext
          value: { runAsNonRoot: true, runAsUser: 473, runAsGroup: 473, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }

  - it: "drops the preStop delay when drainSeconds is 0"
    template: "templates/deployment.yaml"
    set:
      observability.logs.fileSidecar.drainSeconds: 0
    asserts:
      - notExists:
          path: spec.template.spec.initContainers[0].lifecycle

  - it: "fails when the app already mounts something at path"
    template: "templates/deployment.yaml"
    set:
      volumeMounts:
        - { name: logs, mountPath: /var/log/application/ }
    asserts:
      - failedTemplate:
          errorMessage: "observability.logs.fileSidecar.path /var/log/application is already a mount of the app; share it through a sidecars[] sharedVolume or pick another path"

  - it: "keeps level as structured metadata, tails app.log, sends no tenant by default"
    template: "templates/log-sidecar-configmap.yaml"
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'values = \{ level = "", trace_id = "", span_id = "", pod = "" \}'
      - matchRegex:
          path: data["config.alloy"]
          pattern: '"__path__" = "/var/log/application/app\.log"'
      - notMatchRegex:
          path: data["config.alloy"]
          pattern: tenant_id

  - it: "sets the tenant when tenantId is set"
    template: "templates/log-sidecar-configmap.yaml"
    set:
      observability.logs.fileSidecar.tenantId: dev
    asserts:
      - matchRegex:
          path: data["config.alloy"]
          pattern: 'tenant_id = "dev"'

  - it: "fails on a cluster older than 1.30"
    template: "templates/deployment.yaml"
    capabilities:
      majorVersion: 1
      minorVersion: 29
    asserts:
      - failedTemplate:
          errorMessage: "observability.logs.fileSidecar needs Kubernetes 1.30+ (native sidecar, preStop sleep), got v1.29.0; pass --kube-version to helm template"

  - it: "fails when a ConfigMap file mount already sits at path, on workers too"
    template: "templates/worker.yaml"
    set:
      workers: [{ name: general }]
      configMap.asFile: { enabled: true, mountPath: /var/log/application, data: { a: b } }
    asserts:
      - failedTemplate:
          errorMessage: "observability.logs.fileSidecar.path /var/log/application is already a mount of the app; share it through a sidecars[] sharedVolume or pick another path"
