{{- /*
Hook-scoped twins of the permanent objects in configmap.yaml / secret.yaml. The hook Job mounts
THESE, never the permanent copies - a hook resource is transient, so a Deployment that mounted one
could not start a new pod once it was collected.
They live in their own file because deployment.yaml checksums configmap.yaml and secret.yaml whole:
a twin inside those files would churn the pod template on every hook-only change.
*/}}
{{- if and .Values.secret.asFile.enabled (include "spartan.hasHookCommands" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spartan.secretAsFileHook" . }}
  labels:
    {{- include "spartan.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{ include "spartan.combineHookTypes" . | quote }}
    "helm.sh/hook-weight": {{ include "spartan.lowestHookWeight" . | default 0 | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- toYaml .Values.secret.asFile.data | nindent 2 }}
type: Opaque
{{- end }}
---
{{- if and .Values.secret.asEnv.enabled (include "spartan.hasHookCommands" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spartan.secretAsEnvHook" . }}
  labels:
    {{- include "spartan.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": {{include "spartan.combineHookTypes" . | quote }}
    "helm.sh/hook-weight": {{include "spartan.lowestHookWeight" .  | default 0 | quote }}
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  {{- toYaml .Values.secret.asEnv.data | nindent 2 }}
type: Opaque
{{- end }}
