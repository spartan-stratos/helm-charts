{{- if .Values.observability.logs.fileSidecar.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "spartan.logSidecar.name" . }}
  labels:
    {{- include "spartan.labels" . | nindent 4 }}
data:
  config.alloy: |
    // collector="file-sidecar" tells these lines apart from the node Alloy (stdout) and the OTel agent's OTLP logs
    local.file_match "app" {
      path_targets = [{"__path__" = {{ printf "%s/%s" (trimSuffix "/" .Values.observability.logs.fileSidecar.path) .Values.observability.logs.fileSidecar.glob | quote }}}]
    }

    loki.source.file "app" {
      targets    = local.file_match.app.targets
      forward_to = [loki.process.app.receiver]
    }

    // JSON lines keep level and trace context as structured metadata (Loki 3, schema v13), so Grafana links the line to
    // its trace; other lines pass as-is
    loki.process "app" {
      stage.json {
        expressions = { level = "level", trace_id = "trace_id", span_id = "span_id" }
      }
      // The pod, so one replica's lines can be told apart without a stream per pod
      stage.template {
        source   = "pod"
        template = sys.env("POD_NAME")
      }
      stage.structured_metadata {
        values = { level = "", trace_id = "", span_id = "", pod = "" }
      }
      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = sys.env("LOKI_URL")
        {{- with .Values.observability.logs.fileSidecar.tenantId }}
        tenant_id = {{ . | quote }}
        {{- end }}
      }
      external_labels = {
        cluster      = sys.env("CLUSTER_NAME"),
        namespace    = sys.env("POD_NAMESPACE"),
        service_name = sys.env("SERVICE_NAME"),
        container    = sys.env("CONTAINER_NAME"),
        collector    = "file-sidecar",
      }
    }
{{- end }}
