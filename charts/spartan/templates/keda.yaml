{{- if .Values.keda.enabled }}
{{- $fullName := include "spartan.fullname" . -}}
{{- range .Values.keda.authentication }}
{{- if not (or .podIdentity .secretTargetRef) }}
{{- fail (printf "keda.authentication %q needs podIdentity or secretTargetRef" .name) }}
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ $fullName }}-{{ .name }}
spec:
  {{- if .podIdentity }}
  podIdentity:
    provider: {{ .podIdentity.provider }}
    identityOwner: {{ .podIdentity.identityOwner | default "workload" }}
  {{- end }}
  {{- with .secretTargetRef }}
  secretTargetRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $fullName }}
  {{- if .Values.autoscaling.enabled }}
  annotations:
    scaledobject.keda.sh/transfer-hpa-ownership: "true"
  {{- end }}
spec:
  minReplicaCount: {{ .Values.keda.minReplicas }}
  maxReplicaCount: {{ .Values.keda.maxReplicas }}
  pollingInterval: {{ .Values.keda.pollingInterval }}
  scaleTargetRef:
    name: {{ $fullName }}
  {{- $behavior := .Values.keda.behavior | default (and .Values.autoscaling.enabled .Values.autoscaling.behavior) }}
  {{- if or .Values.autoscaling.enabled $behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      {{- if .Values.autoscaling.enabled }}
      name: {{ include "spartan.fullname" . }}
      {{- end }}
      {{- with $behavior }}
      behavior:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- end }}
  triggers:
    {{- range .Values.keda.triggers }}
    - type: {{ .type }}
      {{- if .metricType }}
      metricType: {{ .metricType }}
      {{- end }}
      {{- if .useCachedMetrics }}
      useCachedMetrics: true
      {{- end }}
      {{- if .authentication }}
      authenticationRef:
        name: {{ $fullName }}-{{ .authentication.name }}
      {{- end }}
      metadata:
        {{- toYaml .metadata | nindent 8 }}
    {{- end }}
---
{{- end }}
