{{- /* Lowest pod count the workload settles at. KEDA owns the HPA when enabled, so its floor wins. */ -}}
{{- $floor := int .Values.replicaCount }}
{{- if .Values.keda.enabled }}
{{- $floor = int .Values.keda.minReplicas }}
{{- else if .Values.autoscaling.enabled }}
{{- $floor = int .Values.autoscaling.minReplicas }}
{{- end }}
{{- if and .Values.pdb.enabled (gt $floor 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "spartan.fullname" . }}
  labels:
    {{- include "spartan.labels" . | nindent 4 }}
    tier: "pdb"
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- end }}
  {{- if .Values.pdb.maxUnavailable }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end  }}
  selector:
    matchLabels:
      {{- include "spartan.selectorLabels" . | nindent 6 }}
{{- end }}
