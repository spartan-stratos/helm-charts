suite: catalogue rules
templates:
- templates/catalogue-rules.yaml
release:
  namespace: alerts-test
set:
  service.name: svc
  catalogue.enabled: true
  catalogue.container: app
  catalogue.podRegex: app-.+
tests:
- it: pins default HTTP selectors to the release namespace and service
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[8].expr
      pattern: 'namespace="alerts-test",service_name="svc"'
  - matchRegex:
      path: spec.groups[0].rules[9].expr
      pattern: 'namespace="alerts-test",service_name="svc"'
- it: rejects workload overrides for shared alerts even when their source is disabled
  set:
    catalogue.container: ''
    catalogue.podRegex: ''
    catalogue.workloads: [{name: alpha, container: app, podRegex: 'app-.*', overrides: {RdsCpuHigh: {threshold: 90}}}]
  asserts:
  - failedTemplate:
      errorMessage: 'workload override requires perWorkload alert: RdsCpuHigh'
- it: enables all five shared source rules once for multiple workloads
  values:
  - ../files/tests/catalogue-workloads-values.yaml
  set:
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 33
  - equal:
      path: spec.groups[0].rules[0].alert
      value: DurableQueueNotDraining
  - notExists:
      path: spec.groups[0].rules[0].labels.workload
  - matchRegex:
      path: spec.groups[0].rules[0].expr
      pattern: 'service_name="svc"'
- it: service name and migration regex tokens can be overridden
  set:
    catalogue.sources.durable: true
    catalogue.sources.migration: true
    catalogue.serviceName: telemetry-service
    catalogue.migration.jobRegex: hook-.+
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[0].expr
      pattern: 'service_name="telemetry-service"'
  - matchRegex:
      path: spec.groups[0].rules[2].expr
      pattern: 'job_name=~"hook-.\+"'
- it: rejects an empty severity override
  set:
    catalogue.overrides.Http5xx.severity: ""
  asserts:
  - failedTemplate:
      errorMessage: bad severity for Http5xx
- it: disabled produces no document
  set:
    catalogue.enabled: false
  asserts:
  - hasDocuments:
      count: 0
- it: default enabled sources produce eleven entries
  set: {}
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 11
  - equal:
      path: metadata.name
      value: svc-catalogue
  - equal:
      path: metadata.namespace
      value: alerts-test
  - equal:
      path: spec.groups[0].name
      value: spartan-alerts-catalogue
- it: disabling kubeState gates all dependent entries
  set:
    catalogue.sources.kubeState: false
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 6
- it: disabling cadvisor gates all dependent entries
  set:
    catalogue.sources.cadvisor: false
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 7
- it: disabling http gates all dependent entries
  set:
    catalogue.sources.http: false
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 9
- it: disabling probe gates all dependent entries
  set:
    catalogue.sources.probe: false
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 10
- it: enabling rds adds its entries
  set:
    catalogue.sources.rds: true
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 13
- it: enabling elasticache adds its entries
  set:
    catalogue.sources.elasticache: true
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 16
- it: zero storage thresholds omit storage entries
  set:
    catalogue.sources.rds: true
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 13
- it: pins the existing consumer alert names and only prefixes application entries
  set:
    catalogue.alertPrefix: Backend
    catalogue.sources.rds: true
    catalogue.sources.elasticache: true
    catalogue.rds.storageWarningBytes: 6442450944
    catalogue.rds.storageCriticalBytes: 4294967296
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 20
  - equal:
      path: spec.groups[0].rules[0].alert
      value: BackendContainerRestarting
  - equal:
      path: spec.groups[0].rules[1].alert
      value: BackendPodStuckWaiting
  - equal:
      path: spec.groups[0].rules[2].alert
      value: BackendPodFailed
  - equal:
      path: spec.groups[0].rules[3].alert
      value: BackendNoReadyPods
  - equal:
      path: spec.groups[0].rules[4].alert
      value: BackendMemoryNearLimit
  - equal:
      path: spec.groups[0].rules[5].alert
      value: BackendCpuHigh
  - equal:
      path: spec.groups[0].rules[6].alert
      value: BackendCpuThrottled
  - equal:
      path: spec.groups[0].rules[7].alert
      value: BackendOomKilled
  - equal:
      path: spec.groups[0].rules[8].alert
      value: BackendHttpP95Slow
  - equal:
      path: spec.groups[0].rules[9].alert
      value: BackendHttp5xx
  - equal:
      path: spec.groups[0].rules[10].alert
      value: BackendUptimeProbeFailed
  - equal:
      path: spec.groups[0].rules[11].alert
      value: RdsCpuHigh
  - equal:
      path: spec.groups[0].rules[12].alert
      value: RdsCpuCritical
  - equal:
      path: spec.groups[0].rules[13].alert
      value: RdsStorageLow
  - equal:
      path: spec.groups[0].rules[14].alert
      value: RdsStorageCritical
  - equal:
      path: spec.groups[0].rules[15].alert
      value: ElasticacheCpuHigh
  - equal:
      path: spec.groups[0].rules[16].alert
      value: ElasticacheCpuCritical
  - equal:
      path: spec.groups[0].rules[17].alert
      value: ElasticacheMemoryHigh
  - equal:
      path: spec.groups[0].rules[18].alert
      value: ElasticacheMemoryCritical
  - equal:
      path: spec.groups[0].rules[19].alert
      value: ElasticacheEvictions
- it: threshold override replaces expression and annotations
  set:
    catalogue.overrides.MemoryNearLimit.threshold: 0.9
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[4].expr
      pattern: '> 0\.9$'
  - matchRegex:
      path: spec.groups[0].rules[4].annotations.summary
      pattern: above 0\.9
- it: for override wins
  set:
    catalogue.overrides.ContainerRestarting.for: 12m
  asserts:
  - equal:
      path: spec.groups[0].rules[0].for
      value: 12m
- it: severity override derives tier
  set:
    catalogue.overrides.ContainerRestarting.severity: warning
  asserts:
  - equal:
      path: spec.groups[0].rules[0].labels.severity
      value: warning
  - equal:
      path: spec.groups[0].rules[0].labels.tier
      value: P3
  - equal:
      path: spec.groups[0].rules[4].labels.tier
      value: P3
- it: critical severity derives P2
  set:
    catalogue.overrides.MemoryNearLimit.severity: critical
  asserts:
  - equal:
      path: spec.groups[0].rules[4].labels.tier
      value: P2
  - equal:
      path: spec.groups[0].rules[0].labels.tier
      value: P2
- it: enabled override removes entry
  set:
    catalogue.overrides.ContainerRestarting.enabled: false
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 10
  - equal:
      path: spec.groups[0].rules[0].alert
      value: PodStuckWaiting
- it: valid override for disabled source is accepted
  set:
    catalogue.overrides.RdsStorageLow.threshold: 6442450944
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 11
- it: explicit storage override wins and formats bytes
  set:
    catalogue.sources.rds: true
    catalogue.rds.storageWarningBytes: 123
    catalogue.overrides.RdsStorageLow.threshold: 6442450944
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 14
  - matchRegex:
      path: spec.groups[0].rules[13].expr
      pattern: < 6442450944$
  - matchRegex:
      path: spec.groups[0].rules[13].annotations.summary
      pattern: '6442450944'
- it: rds storage inputs render without exponent
  set:
    catalogue.sources.rds: true
    catalogue.rds.storageWarningBytes: 6442450944
    catalogue.rds.storageCriticalBytes: 4294967296
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[13].expr
      pattern: < 6442450944$
  - matchRegex:
      path: spec.groups[0].rules[14].expr
      pattern: < 4294967296$
- it: runbook URL attaches to rules
  set:
    catalogue.runbookUrl: https://example.com/runbook
  asserts:
  - equal:
      path: spec.groups[0].rules[0].annotations.runbook_url
      value: https://example.com/runbook
  - equal:
      path: spec.groups[0].rules[10].annotations.runbook_url
      value: https://example.com/runbook
- it: empty runbook omits annotation
  set: {}
  asserts:
  - notExists:
      path: spec.groups[0].rules[0].annotations.runbook_url
- it: name suffix names separate rule resource
  set:
    nameSuffix: prod
  asserts:
  - equal:
      path: metadata.name
      value: svc-prod-catalogue
- it: rejects unknown override key
  set:
    catalogue.overrides.NoSuchRule.threshold: 1
  asserts:
  - failedTemplate:
      errorMessage: 'unknown override key: NoSuchRule'
- it: rejects unknown override field
  set:
    catalogue.overrides.Http5xx.noSuchField: 1
  asserts:
  - failedTemplate:
      errorMessage: 'unknown override field: noSuchField'
- it: rejects bad severity
  set:
    catalogue.overrides.Http5xx.severity: info
  asserts:
  - failedTemplate:
      errorMessage: bad severity for Http5xx
- it: rejects ratio too high
  set:
    catalogue.overrides.Http5xx.threshold: 1.5
  asserts:
  - failedTemplate:
      errorMessage: ratio threshold outside (0,1] for Http5xx
- it: rejects ratio zero
  set:
    catalogue.overrides.Http5xx.threshold: 0
  asserts:
  - failedTemplate:
      errorMessage: ratio threshold outside (0,1] for Http5xx
- it: rejects percent too high
  set:
    catalogue.overrides.RdsCpuHigh.threshold: 150
  asserts:
  - failedTemplate:
      errorMessage: percent threshold outside (0,100] for RdsCpuHigh
- it: rejects percent zero
  set:
    catalogue.overrides.RdsCpuHigh.threshold: 0
  asserts:
  - failedTemplate:
      errorMessage: percent threshold outside (0,100] for RdsCpuHigh
- it: rejects missing container
  set:
    catalogue.container: ''
  asserts:
  - failedTemplate:
      errorMessage: catalogue.container is required
- it: rejects missing pod regex
  set:
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: catalogue.podRegex is required
- it: rejects same severity pair
  set:
    catalogue.sources.rds: true
    catalogue.overrides.RdsCpuHigh.severity: critical
  asserts:
  - failedTemplate:
      errorMessage: same-severity pair for rds-cpu
- it: rejects reserved suffix
  set:
    nameSuffix: catalogue
  asserts:
  - failedTemplate:
      errorMessage: nameSuffix must not be catalogue
- it: container and pod regex are unnecessary without their sources
  set:
    catalogue.sources.kubeState: false
    catalogue.sources.cadvisor: false
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 3
- it: tokens render and Prometheus templates stay literal
  set: {}
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[0].expr
      pattern: container="app",pod=~"app-.+"
  - equal:
      path: spec.groups[0].rules[0].annotations.summary
      value: service pod {{ $labels.pod }} restarted
  - equal:
      path: spec.groups[0].rules[0].labels.catalogue_id
      value: container-restarting
  - equal:
      path: spec.groups[0].rules[0].labels.namespace
      value: alerts-test
  - matchRegex:
      path: spec.groups[0].rules[8].expr
      pattern: namespace="alerts-test",service_name="svc"
  - matchRegex:
      path: spec.groups[0].rules[2].expr
      pattern: unless on\(pod\) kube_pod_status_reason
  - notMatchRegex:
      path: spec.groups[0].rules[3].expr
      pattern: vector
  - matchRegex:
      path: spec.groups[0].rules[9].expr
      pattern: '>= 2'
- it: HTTP selector and project tag can be overridden
  set:
    catalogue.httpSelector: namespace="custom"
    catalogue.tagProject: project
    catalogue.sources.rds: true
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[8].expr
      pattern: namespace="custom"
  - notMatchRegex:
      path: spec.groups[0].rules[8].expr
      pattern: 'namespace="alerts-test"|service_name="svc"'
  - matchRegex:
      path: spec.groups[0].rules[11].expr
      pattern: tag_Project="project"
- it: project tag defaults to service name
  set:
    catalogue.sources.rds: true
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[11].expr
      pattern: name!="global",tag_Project="svc"
- it: two workloads render per-workload rules with distinct labels and names
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 19
  - equal:
      path: spec.groups[0].rules[0].alert
      value: AlphaContainerRestarting
  - equal:
      path: spec.groups[0].rules[1].alert
      value: BetaContainerRestarting
  - equal:
      path: spec.groups[0].rules[0].labels.workload
      value: alpha
  - equal:
      path: spec.groups[0].rules[1].labels.workload
      value: beta
  - matchRegex:
      path: spec.groups[0].rules[0].expr
      pattern: container="api",pod=~"api-\.\+"
  - matchRegex:
      path: spec.groups[0].rules[1].expr
      pattern: container="worker",pod=~"worker-\.\+"
- it: entries without perWorkload render once and carry no workload label
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - equal:
      path: spec.groups[0].rules[16].alert
      value: HttpP95Slow
  - notExists:
      path: spec.groups[0].rules[16].labels.workload
  - equal:
      path: spec.groups[0].rules[18].alert
      value: UptimeProbeFailed
- it: pair guard does not fire across workloads with the same severity
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
    catalogue.overrides.CpuHigh.severity: critical
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 19
- it: workload override beats global override beats default
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "overrides": {"MemoryNearLimit": {"threshold": 0.5}}}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
    catalogue.overrides.MemoryNearLimit.threshold: 0.9
    catalogue.overrides.CpuHigh.threshold: 0.7
  asserts:
  - matchRegex:
      path: spec.groups[0].rules[8].expr
      pattern: '> 0\.5$'
  - matchRegex:
      path: spec.groups[0].rules[9].expr
      pattern: '> 0\.9$'
  - matchRegex:
      path: spec.groups[0].rules[10].expr
      pattern: '> 0\.7$'
  - matchRegex:
      path: spec.groups[0].rules[14].expr
      pattern: '> 0$'
- it: workload override can disable one entry for one workload
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "overrides": {"OomKilled": {"enabled": false}}}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 18
- it: workload alertPrefix falls back to the global prefix
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": ""}]
    catalogue.container: ''
    catalogue.podRegex: ''
    catalogue.alertPrefix: Backend
  asserts:
  - equal:
      path: spec.groups[0].rules[1].alert
      value: BackendContainerRestarting
  - equal:
      path: spec.groups[0].rules[16].alert
      value: BackendHttpP95Slow
- it: empty workloads keep the unnamed 0.3.0 shape
  set:
    catalogue.workloads: []
  asserts:
  - lengthEqual:
      path: spec.groups[0].rules
      count: 11
  - notExists:
      path: spec.groups[0].rules[0].labels.workload
- it: rejects duplicate workload name
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "alpha", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'duplicate workload name: alpha'
- it: rejects duplicate workload alertPrefix
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Alpha"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'duplicate workload alertPrefix: Alpha'
- it: rejects workload without name
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'catalogue.workloads[1].name is required'
- it: rejects workload without container
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'catalogue.workloads[1].container is required'
- it: rejects workload without podRegex
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'catalogue.workloads[1].podRegex is required'
- it: rejects scalar container beside workloads
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.podRegex: ''
    catalogue.container: app
  asserts:
  - failedTemplate:
      errorMessage: 'catalogue.container and catalogue.podRegex must be empty when catalogue.workloads is set'
- it: rejects scalar podRegex beside workloads
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: app-.+
  asserts:
  - failedTemplate:
      errorMessage: 'catalogue.container and catalogue.podRegex must be empty when catalogue.workloads is set'
- it: rejects unknown workload override key
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "overrides": {"NoSuchRule": {"threshold": 1}}}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'unknown override key: NoSuchRule'
- it: rejects unknown workload override field
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "overrides": {"Http5xx": {"noSuchField": 1}}}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'unknown override field: noSuchField'
- it: rejects unknown workload field
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "noSuchField": "1"}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'unknown workload field: noSuchField'
- it: rejects bad severity in a workload override
  set:
    catalogue.workloads: [{"name": "alpha", "container": "api", "podRegex": "api-.+", "alertPrefix": "Alpha", "overrides": {"CpuHigh": {"severity": "info"}}}, {"name": "beta", "container": "worker", "podRegex": "worker-.+", "alertPrefix": "Beta"}]
    catalogue.container: ''
    catalogue.podRegex: ''
  asserts:
  - failedTemplate:
      errorMessage: 'bad severity for CpuHigh'
