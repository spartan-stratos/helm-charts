suite: "alert routing tests"
templates:
  - "templates/alertmanager.yaml"
release:
  namespace: alerts-test
tests:
  - it: "should omit inhibition when catalogue is disabled"
    set:
      catalogue.enabled: false
    asserts:
      - notExists:
          path: spec.inhibitRules
  - it: "should inhibit matching catalogue warnings only in the namespace document"
    set:
      catalogue.enabled: true
      catalogue.container: app
      catalogue.podRegex: app-.*
    asserts:
      - equal:
          path: spec.inhibitRules
          value:
            - sourceMatch:
                - name: severity
                  value: critical
                - name: catalogue_id
                  matchType: "=~"
                  value: ".+"
              targetMatch:
                - name: severity
                  value: warning
              equal: [namespace, catalogue_id, pod, dimension_DBInstanceIdentifier, dimension_CacheClusterId]
        documentIndex: 0
      - notExists:
          path: spec.inhibitRules
        documentIndex: 1
  - it: "should omit inhibition when explicitly disabled"
    set:
      catalogue.enabled: true
      catalogue.inhibit: false
      catalogue.container: app
      catalogue.podRegex: app-.*
    asserts:
      - notExists:
          path: spec.inhibitRules
  - it: "should keep default routing names and matchers unchanged"
    asserts:
      - equal:
          path: metadata.name
          value: service-namespace
        documentIndex: 0
      - equal:
          path: metadata.name
          value: service-service
        documentIndex: 1
      - equal:
          path: spec.route.matchers
          value:
            - name: namespace
              value: alerts-test
            - name: severity
              matchType: "=~"
              value: warning|critical
        documentIndex: 0
      - equal:
          path: spec.route.matchers
          value:
            - name: service
              value: service
            - name: namespace
              matchType: "!="
              value: alerts-test
            - name: severity
              matchType: "=~"
              value: warning|critical
        documentIndex: 1
  - it: "should append matchers with optional matchType to both routes"
    set:
      routeMatchers:
        - name: env
          value: dev
        - name: team
          value: api|web
          matchType: "=~"
        - name: region
          value: west
          matchType: ""
    asserts:
      - contains:
          path: spec.route.matchers
          content:
            name: env
            value: dev
      - contains:
          path: spec.route.matchers
          content:
            name: team
            value: api|web
            matchType: "=~"
      - contains:
          path: spec.route.matchers
          content:
            name: region
            value: west
      - notExists:
          path: spec.route.matchers[2].matchType
        documentIndex: 0
      - notExists:
          path: spec.route.matchers[4].matchType
        documentIndex: 0
      - notExists:
          path: spec.route.matchers[3].matchType
        documentIndex: 1
      - notExists:
          path: spec.route.matchers[5].matchType
        documentIndex: 1
  - it: "should suffix both routing names"
    set:
      nameSuffix: dev
    asserts:
      - equal:
          path: metadata.name
          value: service-namespace-dev
        documentIndex: 0
      - equal:
          path: metadata.name
          value: service-service-dev
        documentIndex: 1
  - it: "should namespace both routing objects and omit an empty channel"
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: AlertmanagerConfig
      - equal:
          path: metadata.namespace
          value: alerts-test
      - notExists:
          path: spec.receivers[0].slackConfigs[0].channel
  - it: "should render a configured channel on both routing objects"
    set:
      slack.channel: alerts
    asserts:
      - equal:
          path: spec.receivers[0].slackConfigs[0].channel
          value: '#alerts'
  - it: "should preserve literal Alertmanager templates in both routing objects"
    set:
      grafanaUrl: https://grafana.example
    asserts:
      - equal:
          path: spec.receivers[0].slackConfigs[0].title
          value: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ if .CommonLabels.tier }}[{{ .CommonLabels.tier }}] {{ end }}{{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
      - equal:
          path: spec.receivers[0].slackConfigs[0].titleLink
          value: 'https://grafana.example/alerting/list?search={{ .CommonLabels.alertname | urlquery }}'
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: '\{\{ range .Alerts \}\}'
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: '\{\{ .Annotations.description \}\}'
  - it: "should keep the service route off alerts the namespace route already sends"
    set:
      service.name: svc
    documentIndex: 1
    asserts:
      - contains:
          path: spec.route.matchers
          content:
            name: service
            value: svc
      - contains:
          path: spec.route.matchers
          content:
            name: namespace
            matchType: "!="
            value: alerts-test
  - it: "should add workload to inhibition, grouping and Slack text when workloads are set"
    set:
      catalogue.enabled: true
      catalogue.workloads[0].name: alpha
      catalogue.workloads[0].container: api
      catalogue.workloads[0].podRegex: api-.+
    asserts:
      - equal:
          path: spec.inhibitRules[0].equal
          value: [namespace, catalogue_id, workload, pod, dimension_DBInstanceIdentifier, dimension_CacheClusterId]
        documentIndex: 0
      - equal:
          path: spec.route.groupBy
          value: [alertname, namespace, service, workload]
        documentIndex: 0
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: 'workload=\{\{ \.Labels\.workload \}\}'
        documentIndex: 0
  - it: "should show the tier in both titles only through a guard on the label"
    asserts:
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].title
          pattern: '\] \{\{ if \.CommonLabels\.tier \}\}\[\{\{ \.CommonLabels\.tier \}\}\] \{\{ end \}\}\{\{ \.CommonLabels\.alertname \}\}'
        documentIndex: 1
  - it: "should render no nested routes without tierRoutes"
    asserts:
      - notExists:
          path: spec.route.routes
        documentIndex: 0
      - notExists:
          path: spec.route.routes
        documentIndex: 1
  - it: "should render one nested route per tier with the same receiver in both documents"
    set:
      env: dev
      alerting.tierRoutes.P1.repeatInterval: 1h
      alerting.tierRoutes.P2.repeatInterval: 2h
    asserts:
      - equal:
          path: spec.route.routes
          value:
            - receiver: slack-service-dev
              matchers:
                - name: tier
                  value: P1
              repeatInterval: 1h
              continue: false
            - receiver: slack-service-dev
              matchers:
                - name: tier
                  value: P2
              repeatInterval: 2h
              continue: false
        documentIndex: 0
      - equal:
          path: spec.route.routes[1].repeatInterval
          value: 2h
        documentIndex: 1
      - equal:
          path: spec.receivers[0].name
          value: slack-service-dev
        documentIndex: 1
  - it: "should reject an unknown tier"
    set:
      alerting.tierRoutes.P4.repeatInterval: 1h
    asserts:
      - failedTemplate:
          errorPattern: 'unknown tier "P4"'
  - it: "should reject a malformed repeatInterval"
    set:
      alerting.tierRoutes.P1.repeatInterval: soon
    asserts:
      - failedTemplate:
          errorPattern: 'repeatInterval must look like'
  - it: "should keep grouping and Slack text unchanged without workloads"
    set:
      catalogue.enabled: true
      catalogue.container: app
      catalogue.podRegex: app-.*
    asserts:
      - equal:
          path: spec.route.groupBy
          value: [alertname, namespace, service]
        documentIndex: 0
      - notMatchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: workload
        documentIndex: 0
