suite: "external secret tests"
templates:
  - "templates/externalsecret.yaml"
  - "templates/secretstore.yaml"
  - "templates/serviceaccount.yaml"
release:
  namespace: alerts-test
set:
  externalSecrets.enabled: true
  externalSecrets.region: us-west-2
  externalSecrets.secretArn: arn:aws:secretsmanager:us-west-2:1:secret:webhook
  externalSecrets.roleArn: arn:aws:iam::1:role/alert-reader
  externalSecrets.serviceAccount: webhook-reader
  slack.secretName: webhook-secret
tests:
  - it: "should require a region"
    template: "templates/secretstore.yaml"
    set:
      externalSecrets.region: ""
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.region is required when externalSecrets.enabled
  - it: "should require a secret ARN"
    template: "templates/secretstore.yaml"
    set:
      externalSecrets.secretArn: ""
    asserts:
      - failedTemplate:
          errorMessage: externalSecrets.secretArn is required when externalSecrets.enabled
  - it: "should render an ExternalSecret targeting the configured secret"
    template: "templates/externalsecret.yaml"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata.namespace
          value: alerts-test
      - equal:
          path: spec.target.name
          value: webhook-secret
      - equal:
          path: spec.secretStoreRef.name
          value: webhook-secret
      - equal:
          path: spec.data[0].remoteRef.key
          value: arn:aws:secretsmanager:us-west-2:1:secret:webhook
  - it: "should render a SecretStore using the configured region and account"
    template: "templates/secretstore.yaml"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretStore
      - equal:
          path: metadata.name
          value: webhook-secret
      - equal:
          path: metadata.namespace
          value: alerts-test
      - equal:
          path: spec.provider.aws.region
          value: us-west-2
      - equal:
          path: spec.provider.aws.auth.jwt.serviceAccountRef.name
          value: webhook-reader
  - it: "should render a ServiceAccount with the configured role annotation"
    template: "templates/serviceaccount.yaml"
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: webhook-reader
      - equal:
          path: metadata.namespace
          value: alerts-test
      - equal:
          path: metadata.annotations["eks.amazonaws.com/role-arn"]
          value: arn:aws:iam::1:role/alert-reader
