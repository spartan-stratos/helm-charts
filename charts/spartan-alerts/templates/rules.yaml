{{- if .Values.groups }}
{{- $ns := .Release.Namespace -}}
{{- $groups := list -}}
{{- $tokens := include "spartan-alerts.tokens" . | fromJson -}}
{{- range .Values.groups -}}
{{- $group := deepCopy . -}}
{{- $_ := set $group "name" (include "spartan-alerts.expand" (dict "text" $group.name "tokens" $tokens)) -}}
{{- $rules := list -}}
{{- range (default (list) $group.rules) -}}
{{- $rule := . -}}
{{- if hasKey $rule "expr" -}}
{{- $_ := set $rule "expr" (include "spartan-alerts.expand" (dict "text" $rule.expr "tokens" $tokens)) -}}
{{- end -}}
{{- range $field := list "labels" "annotations" -}}
{{- range $key, $value := (default (dict) (index $rule $field)) -}}
{{- $_ := set (index $rule $field) $key (include "spartan-alerts.expand" (dict "text" $value "tokens" $tokens)) -}}
{{- end -}}
{{- end -}}
{{- if hasKey $rule "alert" -}}
{{- $labels := default (dict) $rule.labels -}}
{{- if not (hasKey $labels "namespace") -}}
{{- $_ := set $labels "namespace" $ns -}}
{{- end -}}
{{- if and (hasKey $labels "severity") (not (hasKey $labels "tier")) -}}
{{- $_ := set $labels "tier" (ternary "P2" "P3" (eq (toString (index $labels "severity")) "critical")) -}}
{{- end -}}
{{- $_ := set $rule "labels" $labels -}}
{{- end -}}
{{- $rules = append $rules $rule -}}
{{- end -}}
{{- $_ := set $group "rules" $rules -}}
{{- $groups = append $groups $group -}}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ if .Values.nameSuffix }}{{ printf "%s-%s" .Values.service.name .Values.nameSuffix | quote }}{{ else }}{{ .Values.service.name | quote }}{{ end }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  groups:
{{ toYaml $groups | indent 4 }}
{{- end }}
