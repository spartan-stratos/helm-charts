{{- if .Values.externalSecrets.enabled }}
{{- $_ := required "externalSecrets.secretArn is required when externalSecrets.enabled" .Values.externalSecrets.secretArn }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Values.slack.secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required when externalSecrets.enabled" .Values.externalSecrets.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount | quote }}
{{- end }}
