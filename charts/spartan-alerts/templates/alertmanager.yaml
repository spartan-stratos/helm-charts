{{- $manifest := .Files.Get "files/alertmanager.yaml" -}}
{{- $suffix := "" -}}
{{- if .Values.nameSuffix -}}
{{- $suffix = printf "-%s" .Values.nameSuffix -}}
{{- end -}}
{{- $matchers := "" -}}
{{- range .Values.routeMatchers -}}
{{- $matchers = printf "%s      - name: %s\n        value: %s\n" $matchers (.name | quote) (.value | quote) -}}
{{- if .matchType -}}
{{- $matchers = printf "%s        matchType: %s\n" $matchers (.matchType | quote) -}}
{{- end -}}
{{- end -}}
{{- $short := include "spartan-alerts.short" . -}}
{{- $tierRoutes := "" -}}
{{- range $tier, $cfg := .Values.alerting.tierRoutes -}}
{{- if not (has $tier (list "P1" "P2" "P3")) -}}{{- fail (printf "alerting.tierRoutes: unknown tier %q, use P1, P2 or P3" $tier) -}}{{- end -}}
{{- $interval := default "" $cfg.repeatInterval -}}
{{- if not (regexMatch "^[0-9]+(s|m|h|d|w)$" (toString $interval)) -}}{{- fail (printf "alerting.tierRoutes.%s.repeatInterval must look like 1h or 30m" $tier) -}}{{- end -}}
{{- if eq $tierRoutes "" -}}{{- $tierRoutes = "    routes:\n" -}}{{- end -}}
{{- $tierRoutes = printf "%s      - receiver: slack-%s-%s\n        matchers:\n          - name: tier\n            value: %s\n        repeatInterval: %s\n        continue: false\n" $tierRoutes $short $.Values.env $tier $interval -}}
{{- end -}}
{{- $perWorkload := and .Values.catalogue.enabled (not (empty .Values.catalogue.workloads)) -}}
{{- $groupByWorkload := "" -}}
{{- $workloadText := "" -}}
{{- $inhibitEqual := "namespace, catalogue_id, pod, dimension_DBInstanceIdentifier, dimension_CacheClusterId" -}}
{{- if $perWorkload -}}
{{- $groupByWorkload = ", workload" -}}
{{- $workloadText = "{{ if .Labels.workload }} workload={{ .Labels.workload }}{{ end }}" -}}
{{- $inhibitEqual = "namespace, catalogue_id, workload, pod, dimension_DBInstanceIdentifier, dimension_CacheClusterId" -}}
{{- end -}}
{{- $inhibitRules := "" -}}
{{- if and .Values.catalogue.enabled .Values.catalogue.inhibit -}}
{{/* WHY: Absent labels compare equal; per-resource labels keep one database from muting another. */}}
{{- $inhibitRules = printf "  inhibitRules:\n    - sourceMatch:\n        - name: severity\n          value: critical\n        - name: catalogue_id\n          matchType: \"=~\"\n          value: \".+\"\n      targetMatch:\n        - name: severity\n          value: warning\n      equal: [%s]\n" $inhibitEqual -}}
{{- end -}}
{{- if empty .Values.slack.channel -}}
{{- $manifest = replace "          channel: '#${ALERT_SLACK_CHANNEL}'\n" "" $manifest -}}
{{- end -}}
{{- range $token, $value := (include "spartan-alerts.tokens" . | fromJson) -}}
{{- $manifest = replace $token $value $manifest -}}
{{- end -}}
{{- $manifest
  | replace "${GROUP_BY_WORKLOAD}" $groupByWorkload
  | replace "${WORKLOAD_TEXT}" $workloadText
  | replace "${NAME_SUFFIX}" $suffix
  | replace "${ROUTE_MATCHERS}\n" $matchers
  | replace "${TIER_ROUTES}\n" $tierRoutes
  | replace "${INHIBIT_RULES}\n" $inhibitRules
}}
