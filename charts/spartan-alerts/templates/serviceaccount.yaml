{{- if .Values.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccount | quote }}
  namespace: {{ .Release.Namespace | quote }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "externalSecrets.roleArn is required when externalSecrets.enabled" .Values.externalSecrets.roleArn | quote }}
{{- end }}
