{{- if .Values.externalSecrets.enabled }}
{{- $_ := required "externalSecrets.region is required when externalSecrets.enabled" .Values.externalSecrets.region }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.slack.secretName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.slack.secretName | quote }}
    kind: SecretStore
  target:
    name: {{ .Values.slack.secretName | quote }}
    creationPolicy: Owner
  data:
    - secretKey: webhook-url
      remoteRef:
        key: {{ required "externalSecrets.secretArn is required when externalSecrets.enabled" .Values.externalSecrets.secretArn | quote }}
{{- end }}
