- name: Absent telemetry does not page
  interval: 1m
  input_series: []
  alert_rule_test:
  - eval_time: 20m
    alertname: TestNoReadyPods
    exp_alerts: []
  - eval_time: 20m
    alertname: TestPodStuckWaiting
    exp_alerts: []
- name: Only another application is Running
  interval: 1m
  input_series:
  - series: kube_pod_status_phase{namespace="default",pod="other-1",phase="Running"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: TestNoReadyPods
    exp_alerts: []
- name: Evicted app and failed hook are excluded
  interval: 1m
  input_series:
  - series: kube_pod_status_phase{namespace="default",pod="app-1",phase="Failed"}
    values: 1x30
  - series: kube_pod_status_phase{namespace="default",pod="hook-1",phase="Failed"}
    values: 1x30
  - series: kube_pod_status_reason{namespace="default",pod="app-1",reason="Evicted"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: TestPodFailed
    exp_alerts: []
- name: HTTP zero traffic
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{service_name="catalogue-test",http_response_status_code="500"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: TestHttp5xx
