- name: HTTP single error
  interval: 1m
  input_series:
  - series: http_server_request_duration_seconds_count{service_name="catalogue-test",http_response_status_code="500"}
    values: 0x18 1x12
  alert_rule_test:
  - eval_time: 20m
    alertname: TestHttp5xx
    exp_alerts: []
- name: RDS excludes global
  interval: 1m
  input_series:
  - series: aws_rds_cpuutilization_average{namespace="default",name="global",tag_Project="catalogue-test",dimension_DBInstanceIdentifier="db-1"}
    values: 100x30
  - series: aws_rds_free_storage_space_minimum{namespace="default",name="global",tag_Project="catalogue-test",dimension_DBInstanceIdentifier="db-1"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: RdsCpuHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsCpuCritical
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsStorageLow
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsStorageCritical
    exp_alerts: []
- name: RDS excludes other project
  interval: 1m
  input_series:
  - series: aws_rds_cpuutilization_average{namespace="default",name="db",tag_Project="other",dimension_DBInstanceIdentifier="db-1"}
    values: 100x30
  - series: aws_rds_free_storage_space_minimum{namespace="default",name="db",tag_Project="other",dimension_DBInstanceIdentifier="db-1"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: RdsCpuHigh
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsCpuCritical
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsStorageLow
    exp_alerts: []
  - eval_time: 20m
    alertname: RdsStorageCritical
    exp_alerts: []
- name: Memory default boundary remains above the override, tested separately at 61 percent
  interval: 1m
  input_series:
  - series: container_memory_working_set_bytes{namespace="default",pod="app-1",container="app"}
    values: 60x30
  - series: container_spec_memory_limit_bytes{namespace="default",pod="app-1",container="app"}
    values: 100x30
  alert_rule_test:
  - eval_time: 20m
    alertname: TestMemoryNearLimit
    exp_alerts: []
