# Static expectations pin labels, annotations and threshold boundaries.
# Deliberate style difference: isolated scenarios avoid unrelated firing alerts.
# Memory override fires at 61 percent (below default 80), and is silent at 60.
rule_files:
- catalogue-rules.yaml
evaluation_interval: 1m
tests:
- {"name":"Workloads queue fires","interval":"1m","input_series":[{"series":"durable_queue_depth{namespace=\"default\",service_name=\"catalogue-test\",queue_name=\"jobs\"}","values":"1x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DurableQueueNotDraining","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"durable-queue-not-draining","severity":"warning","tier":"P3","service_name":"catalogue-test","queue_name":"jobs"},"exp_annotations":{"summary":"Test durable queue jobs has not drained in 30 minutes","description":"The queue never reached empty across the window, so jobs are accumulating rather than flowing. Check activity errors in the application logs."}}]}]}
- {"name":"Workloads queue silent empty","interval":"1m","input_series":[{"series":"durable_queue_depth{namespace=\"default\",service_name=\"catalogue-test\",queue_name=\"jobs\"}","values":"0x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DurableQueueNotDraining","exp_alerts":[]}]}
- {"name":"Workloads queue touching zero resets timer","interval":"1m","input_series":[{"series":"durable_queue_depth{namespace=\"default\",service_name=\"catalogue-test\",queue_name=\"jobs\"}","values":"1x20 0 1x24"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DurableQueueNotDraining","exp_alerts":[]}]}
- {"name":"Workloads activities fires","interval":"1m","input_series":[{"series":"durable_runtime_registered_activities{namespace=\"default\",service_name=\"catalogue-test\"}","values":"0x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DurableActivitiesNotRegistered","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"durable-activities-not-registered","severity":"critical","tier":"P2","service_name":"catalogue-test"},"exp_annotations":{"summary":"Test registered zero durable activities","description":"The durable runtime is up but registered no activities, so every durable job will fail to dispatch. Check startup logs for registration errors."}}]}]}
- {"name":"Workloads activities silent","interval":"1m","input_series":[{"series":"durable_runtime_registered_activities{namespace=\"default\",service_name=\"catalogue-test\"}","values":"1x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DurableActivitiesNotRegistered","exp_alerts":[]}]}
- {"name":"Workloads heap fires","interval":"1m","input_series":[{"series":"jvm_memory_used_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"91x45"},{"series":"jvm_memory_limit_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"100x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"JvmHeapHigh","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"jvm-heap-high","severity":"warning","tier":"P3","k8s_pod_name":"app-1"},"exp_annotations":{"summary":"Test pod app-1 heap above 0.9 of its limit","description":"Heap stayed near its limit for 15 minutes, so the pod is close to an out-of-memory restart. Check for a leak or a change in load before raising the memory limit."}}]}]}
- {"name":"Workloads heap silent at threshold","interval":"1m","input_series":[{"series":"jvm_memory_used_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"90x45"},{"series":"jvm_memory_limit_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"100x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"JvmHeapHigh","exp_alerts":[]}]}
- {"name":"Workloads heap ignores unknown limit","interval":"1m","input_series":[{"series":"jvm_memory_used_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"91x45"},{"series":"jvm_memory_limit_bytes{namespace=\"default\",k8s_pod_name=\"app-1\",jvm_memory_type=\"heap\"}","values":"-1x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"JvmHeapHigh","exp_alerts":[]}]}
- {"name":"Workloads pool fires worst pool","interval":"1m","input_series":[{"series":"db_client_connections_usage{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"primary\",state=\"used\"}","values":"91x45"},{"series":"db_client_connections_max{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"primary\"}","values":"100x45"},{"series":"db_client_connections_usage{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"replica\",state=\"used\"}","values":"1x45"},{"series":"db_client_connections_max{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"replica\"}","values":"100x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DbPoolHigh","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"db-pool-high","severity":"warning","tier":"P3","k8s_pod_name":"app-1"},"exp_annotations":{"summary":"Test pod app-1 database pool above 0.9 in use","description":"The connection pool stayed near capacity for 10 minutes. Requests will start to queue; look for slow queries or a leaked connection."}}]}]}
- {"name":"Workloads pool silent idle excluded","interval":"1m","input_series":[{"series":"db_client_connections_usage{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"primary\",state=\"used\"}","values":"90x45"},{"series":"db_client_connections_max{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"primary\"}","values":"100x45"},{"series":"db_client_connections_usage{namespace=\"default\",k8s_pod_name=\"app-1\",pool_name=\"primary\",state=\"idle\"}","values":"100x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"DbPoolHigh","exp_alerts":[]}]}
- {"name":"Workloads migration fires","interval":"1m","input_series":[{"series":"kube_job_status_failed{namespace=\"default\",job_name=\"hook-migrate\"}","values":"1x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"MigrationJobFailed","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"migration-job-failed","severity":"critical","tier":"P2","job_name":"hook-migrate"},"exp_annotations":{"summary":"Test migration job hook-migrate failed","description":"The migration hook failed, so the release is blocked and the running image may not match the schema. Check hook pod logs and migration history before redeploying."}}]}]}
- {"name":"Workloads migration silent no failure","interval":"1m","input_series":[{"series":"kube_job_status_failed{namespace=\"default\",job_name=\"hook-migrate\"}","values":"0x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"MigrationJobFailed","exp_alerts":[]}]}
- {"name":"Workloads migration later retry succeeded","interval":"1m","input_series":[{"series":"kube_job_status_failed{namespace=\"default\",job_name=\"hook-migrate\"}","values":"1x45"},{"series":"kube_job_status_succeeded{namespace=\"default\",job_name=\"hook-migrate\"}","values":"0x10 1x34"}],"alert_rule_test":[{"eval_time":"40m","alertname":"MigrationJobFailed","exp_alerts":[]}]}
- {"name":"Workloads migration nonmatching job","interval":"1m","input_series":[{"series":"kube_job_status_failed{namespace=\"default\",job_name=\"backup\"}","values":"1x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"MigrationJobFailed","exp_alerts":[]}]}
- {"name":"Workloads migration in-flight retry still fires without success","interval":"1m","input_series":[{"series":"kube_job_status_failed{namespace=\"default\",job_name=\"hook-migrate\"}","values":"1x45"},{"series":"kube_job_status_succeeded{namespace=\"default\",job_name=\"hook-migrate\"}","values":"0x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"MigrationJobFailed","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"migration-job-failed","severity":"critical","tier":"P2","job_name":"hook-migrate"},"exp_annotations":{"summary":"Test migration job hook-migrate failed","description":"The migration hook failed, so the release is blocked and the running image may not match the schema. Check hook pod logs and migration history before redeploying."}}]}]}
- {"name":"Workloads alpha fires beta silent","interval":"1m","input_series":[{"series":"container_oom_events_total{namespace=\"default\",pod=\"app-1\",container=\"app\"}","values":"0+1x45"},{"series":"container_oom_events_total{namespace=\"default\",pod=\"worker-1\",container=\"worker\"}","values":"0x45"}],"alert_rule_test":[{"eval_time":"40m","alertname":"AlphaOomKilled","exp_alerts":[{"exp_labels":{"namespace":"default","catalogue_id":"oom-killed","severity":"warning","tier":"P3","pod":"app-1","container":"app","workload":"alpha"},"exp_annotations":{"summary":"Test pod app-1 was out-of-memory killed","description":"The kernel killed a process in the app container for exceeding its memory limit in the last 10 minutes. Check heap and off-heap growth, then the memory limit."}}]},{"eval_time":"40m","alertname":"BetaOomKilled","exp_alerts":[]}]}
- name: ContainerRestarting fires just beyond threshold
  interval: 1m
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="default",pod="app-1",container="app"}
    values: 0+1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: TestContainerRestarting
    exp_alerts:
    - exp_labels:
        namespace: default
        severity: critical
        tier: P2
        catalogue_id: container-restarting
        pod: app-1
      exp_annotations:
        summary: Test pod app-1 restarted
        description: The app container restarted in the last 10 minutes (crash or out-of-memory kill). Read the previous container's
          logs with kubectl -n default logs app-1 --previous.
- name: ContainerRestarting silent at threshold
  interval: 1m
  input_series:
  - series: kube_pod_container_status_restarts_total{namespace="default",pod="app-1",container="app"}
    values: '0x30'
  alert_rule_test:
  - eval_time: 20m
    alertname: TestContainerRestarting
    exp_alerts: []
- name: PodStuckWaiting fires just beyond threshold
  interval: 1m
  input_series:
  - series: kube_pod_container_status_waiting_reason{namespace="default",pod="app-1",container="app",reason="CrashLoopBackOff"}
    values: 1x30
  alert_rule_test:
  - eval_time: 20m
    alertname: TestPodStuckWaiting
    exp_alerts:
    - exp_labels:
        namespace: default
        severity: critical
        tier: P2
        catalogue_id: pod-stuck-waiting
        pod: app-1
      exp_annotations:
        summary: Test pod app-1 is crash-looping or cannot pull its image
        description: A container has been in CrashLoopBackOff or an image pull error for 5 minutes, so the pod will not become
          ready. Run kubectl -n default describe pod app-1 for the event and image or crash cause.
- name: PodStuckWaiting silent at threshold
  interval: 1m
