- name: ElasticacheCpuHigh fires just beyond threshold
  interval: 1m
  input_series:
  - series: aws_elasticache_engine_cpuutilization_average{namespace="default",name="cache",tag_Project="catalogue-test",dimension_CacheClusterId="cache-1"}
    values: 71x30
  alert_rule_test:
