        # Flyway runs as a pre-upgrade hook, so a failure blocks the release; the failed Job persists until the next deploy.
        # kube_job_failed exists only once a Job has failed, so never test the healthy state with ==0 or absent().
        # Not kube_job_status_failed: it counts failed pods, and a retry that succeeds would page on a good release.
        - alert: MigrationJobFailed
          expr: max by (job_name) (kube_job_failed{namespace="${NAMESPACE}",condition="true"}) > 0
          for: 5m
          labels:
            namespace: ${NAMESPACE}
            severity: critical
          annotations:
            summary: "${SERVICE_SHORT} migration job {{ $labels.job_name }} failed"
            description: >-
              The Flyway pre-upgrade hook failed, so the release is blocked and the running image may not match the
              schema. Read the hook pod's logs with kubectl -n ${NAMESPACE} logs job/{{ $labels.job_name }},
              then check flyway_schema_history for a partially applied version before redeploying.
