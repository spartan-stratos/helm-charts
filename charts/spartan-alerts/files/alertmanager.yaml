# ArgoCD renders this chart into ${NAMESPACE} and reverts cluster edits.
# Two configs because RED alerts carry `service` and no `namespace`, and workload alerts the reverse; one route cannot
# match either. Both live in the tenant namespace and match only this tenant, so the operator scopes them to it.
# The service config excludes this namespace, so an alert carrying both labels posts once, via the namespace config.
# No continue override: the operator forces continue on every config's top route, so the shared slack route still receives these.
# The webhook Secret ${ALERT_SLACK_SECRET} (key webhook-url) is created by hand unless externalSecrets.enabled, when ESO creates it.
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ${SERVICE_SHORT}-namespace
  namespace: ${NAMESPACE}
spec:
  route:
    receiver: slack-${SERVICE_SHORT}-${ENV}
    groupBy: [alertname, namespace, service]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: namespace
        value: ${NAMESPACE}
      - name: severity
        matchType: "=~"
        value: warning|critical
  receivers:
    - name: slack-${SERVICE_SHORT}-${ENV}
      slackConfigs:
        - apiURL:
            name: ${ALERT_SLACK_SECRET}
            key: webhook-url
          channel: '#${ALERT_SLACK_CHANNEL}'
          sendResolved: true
          title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
          titleLink: '${GRAFANA_URL}/alerting/list?search={{ .CommonLabels.alertname | urlquery }}'
          text: |-
            {{ range .Alerts }}*{{ .Annotations.summary }}*{{ if .Annotations.message }}*{{ .Annotations.message }}*{{ end }}
            {{ .Annotations.description }}
            `cluster=${CLUSTER_NAME}{{ if .Labels.namespace }} namespace={{ .Labels.namespace }}{{ else if .Labels.service }} service={{ .Labels.service }}{{ end }}{{ if .Labels.pod }} pod={{ .Labels.pod }}{{ end }}{{ if .Labels.job_name }} job={{ .Labels.job_name }}{{ end }}`
            {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|Runbook>{{ end }}
            {{- if .Annotations.dashboard_url }} · <${GRAFANA_URL}{{ .Annotations.dashboard_url }}|Dashboard>{{ end }}
            {{ end }}
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: ${SERVICE_SHORT}-service
  namespace: ${NAMESPACE}
spec:
  route:
    receiver: slack-${SERVICE_SHORT}-${ENV}
    groupBy: [alertname, namespace, service]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      - name: service
        value: ${SERVICE_NAME}
      - name: namespace
        matchType: "!="
        value: ${NAMESPACE}
      - name: severity
        matchType: "=~"
        value: warning|critical
  receivers:
    - name: slack-${SERVICE_SHORT}-${ENV}
      slackConfigs:
        - apiURL:
            name: ${ALERT_SLACK_SECRET}
            key: webhook-url
          channel: '#${ALERT_SLACK_CHANNEL}'
          sendResolved: true
          title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.severity }})'
          titleLink: '${GRAFANA_URL}/alerting/list?search={{ .CommonLabels.alertname | urlquery }}'
          text: |-
            {{ range .Alerts }}*{{ .Annotations.summary }}*{{ if .Annotations.message }}*{{ .Annotations.message }}*{{ end }}
            {{ .Annotations.description }}
            `cluster=${CLUSTER_NAME}{{ if .Labels.namespace }} namespace={{ .Labels.namespace }}{{ else if .Labels.service }} service={{ .Labels.service }}{{ end }}{{ if .Labels.pod }} pod={{ .Labels.pod }}{{ end }}{{ if .Labels.job_name }} job={{ .Labels.job_name }}{{ end }}`
            {{ if .Annotations.runbook_url }}<{{ .Annotations.runbook_url }}|Runbook>{{ end }}
            {{- if .Annotations.dashboard_url }} · <${GRAFANA_URL}{{ .Annotations.dashboard_url }}|Dashboard>{{ end }}
            {{ end }}
