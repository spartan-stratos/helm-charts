rules:
# Seed deviations: namespace pins on durable metrics; configurable service and job selectors;
# positive JVM limit guard; catalogue thresholds, tiers and optional runbooks replace tenant metadata.
# Migration failures remain pending during an in-flight retry until a success is observed.
- alert: DurableQueueNotDraining
  prefixable: false
  catalogueId: durable-queue-not-draining
  sources: [durable]
  severity: warning
  unit: count
  threshold: 0
  for: 30m
  expr: durable_queue_depth{namespace="${NAMESPACE}",service_name="${SERVICE_NAME}"} > ${THRESHOLD}
  summary: '${SERVICE_SHORT} durable queue {{ $labels.queue_name }} has not drained in 30 minutes'
  description: The queue never reached empty across the window, so jobs are accumulating rather than flowing. Check activity errors in the application logs.
- alert: DurableActivitiesNotRegistered
  prefixable: false
  catalogueId: durable-activities-not-registered
  sources: [durable]
  severity: critical
  unit: count
  threshold: 0
  for: 10m
  expr: durable_runtime_registered_activities{namespace="${NAMESPACE}",service_name="${SERVICE_NAME}"} == ${THRESHOLD}
  summary: '${SERVICE_SHORT} registered zero durable activities'
  description: The durable runtime is up but registered no activities, so every durable job will fail to dispatch. Check startup logs for registration errors.
- alert: JvmHeapHigh
  prefixable: false
  catalogueId: jvm-heap-high
  sources: [otelJvm]
  severity: warning
  unit: ratio
  threshold: 0.9
  for: 15m
  expr: |-
    sum by (k8s_pod_name) (jvm_memory_used_bytes{namespace="${NAMESPACE}",jvm_memory_type="heap"})
    / on(k8s_pod_name) sum by (k8s_pod_name) (jvm_memory_limit_bytes{namespace="${NAMESPACE}",jvm_memory_type="heap"}) > ${THRESHOLD}
    and on(k8s_pod_name) sum by (k8s_pod_name) (jvm_memory_limit_bytes{namespace="${NAMESPACE}",jvm_memory_type="heap"}) > 0
  summary: '${SERVICE_SHORT} pod {{ $labels.k8s_pod_name }} heap above ${THRESHOLD} of its limit'
  description: Heap stayed near its limit for 15 minutes, so the pod is close to an out-of-memory restart. Check for a leak or a change in load before raising the memory limit.
- alert: DbPoolHigh
  prefixable: false
  catalogueId: db-pool-high
  sources: [otelDbPool]
  severity: warning
  unit: ratio
  threshold: 0.9
  for: 10m
  expr: |-
    max by (k8s_pod_name) (
      sum by (k8s_pod_name, pool_name) (db_client_connections_usage{namespace="${NAMESPACE}",state!="idle"})
      / on(k8s_pod_name, pool_name) max by (k8s_pod_name, pool_name) (db_client_connections_max{namespace="${NAMESPACE}"})
    ) > ${THRESHOLD}
  summary: '${SERVICE_SHORT} pod {{ $labels.k8s_pod_name }} database pool above ${THRESHOLD} in use'
  description: The connection pool stayed near capacity for 10 minutes. Requests will start to queue; look for slow queries or a leaked connection.
- alert: MigrationJobFailed
  prefixable: false
  catalogueId: migration-job-failed
  sources: [kubeState, migration]
  severity: critical
  unit: count
  threshold: 0
  for: 5m
  expr: |-
    max by (job_name) (kube_job_status_failed{namespace="${NAMESPACE}",job_name=~"${JOB_REGEX}"}) > ${THRESHOLD}
    unless on(job_name) max by (job_name) (kube_job_status_succeeded{namespace="${NAMESPACE}",job_name=~"${JOB_REGEX}"}) > 0
  summary: '${SERVICE_SHORT} migration job {{ $labels.job_name }} failed'
  description: The migration hook failed, so the release is blocked and the running image may not match the schema. Check hook pod logs and migration history before redeploying.
- alert: ContainerRestarting
  prefixable: true
  perWorkload: true
  catalogueId: container-restarting
  sources:
  - kubeState
  severity: critical
  unit: count
  threshold: 0
  for: 1m
  expr: |-
    max by (pod) (increase(kube_pod_container_status_restarts_total{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}}[10m])) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} restarted"
  description: "The app container restarted in the last 10 minutes (crash or out-of-memory kill). Read the previous container's logs with kubectl -n ${NAMESPACE} logs {{ $labels.pod }} --previous."
- alert: PodStuckWaiting
  prefixable: true
  perWorkload: true
  catalogueId: pod-stuck-waiting
  sources:
  - kubeState
  severity: critical
  unit: count
  threshold: 1
  for: 5m
  expr: |-
    max by (pod) (max_over_time(kube_pod_container_status_waiting_reason{namespace="${NAMESPACE}",${POD_SELECTOR},container="${CONTAINER}",reason=~"CrashLoopBackOff|ImagePullBackOff|ErrImagePull"}[3m])) == ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} is crash-looping or cannot pull its image"
  description: "A container has been in CrashLoopBackOff or an image pull error for 5 minutes, so the pod will not become ready. Run kubectl -n ${NAMESPACE} describe pod {{ $labels.pod }} for the event and image or crash cause."
- alert: PodFailed
  prefixable: true
  perWorkload: true
  catalogueId: pod-failed
  sources:
  - kubeState
  severity: critical
  unit: count
  threshold: 0
  for: 5m
  expr: |-
    max by (pod) (kube_pod_status_phase{namespace="${NAMESPACE}",${POD_SELECTOR},phase="Failed"}) > ${THRESHOLD}
    unless on(pod) kube_pod_status_reason{namespace="${NAMESPACE}",${POD_SELECTOR},reason="Evicted"} == 1
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} failed"
  description: "The pod has been Failed for 5 minutes. Describe the pod and check its container logs."
- alert: NoReadyPods
  prefixable: true
  perWorkload: true
  catalogueId: no-ready-pods
  sources:
  - kubeState
  severity: critical
  unit: count
  threshold: 0
  for: 5m
  expr: |-
    (sum(kube_pod_status_phase{namespace="${NAMESPACE}",${POD_SELECTOR},phase="Running"}) or vector(0)) == ${THRESHOLD}
  summary: "${SERVICE_SHORT} has no running pods"
  description: "No pod has been Running for 5 minutes. Check kubectl -n ${NAMESPACE} get pods and describe the newest pod for the scheduling or image error."
- alert: MemoryNearLimit
  prefixable: true
  perWorkload: true
  catalogueId: memory-near-limit
  sources:
  - cadvisor
  severity: warning
  unit: ratio
  threshold: 0.8
  for: 5m
  expr: |-
    max by (pod, container) (container_memory_working_set_bytes{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}})
    / on(pod, container) max by (pod, container) (container_spec_memory_limit_bytes{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}} > 0) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} memory above ${THRESHOLD} of its limit"
  description: "Working-set memory stayed above ${THRESHOLD} of the container limit for 5 minutes (configured threshold), so an out-of-memory kill is near. Check for growth in heap or off-heap use before raising the limit."
- alert: CpuHigh
  prefixable: true
  perWorkload: true
  catalogueId: cpu-high
  sources:
  - cadvisor
  - kubeState
  severity: warning
  unit: ratio
  threshold: 0.8
  for: 5m
  expr: |-
    sum by (pod, container) (rate(container_cpu_usage_seconds_total{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}}[5m]))
    / on(pod, container) max by (pod, container) (kube_pod_container_resource_limits{namespace="${NAMESPACE}",resource="cpu",container="${CONTAINER}",${POD_SELECTOR}} > 0) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} CPU above ${THRESHOLD} of its limit"
  description: "CPU use stayed above ${THRESHOLD} of the container limit for 5 minutes (configured threshold). Check for a load spike or a busy loop before raising the limit."
- alert: CpuThrottled
  prefixable: true
  perWorkload: true
  catalogueId: cpu-throttled
  sources:
  - cadvisor
  severity: warning
  unit: ratio
  threshold: 0.25
  for: 15m
  expr: |-
    sum by (pod, container) (increase(container_cpu_cfs_throttled_periods_total{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}}[15m]))
    / sum by (pod, container) (increase(container_cpu_cfs_periods_total{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}}[15m])) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} CPU throttled above ${THRESHOLD} of periods"
  description: "The kernel throttled the container above ${THRESHOLD} of scheduling periods for 15 minutes, so requests slow down even when CPU use looks low. Raise the CPU limit or reduce load."
- alert: OomKilled
  prefixable: true
  perWorkload: true
  catalogueId: oom-killed
  sources:
  - cadvisor
  severity: warning
  unit: count
  threshold: 0
  for: 0m
  expr: |-
    max by (pod, container) (increase(container_oom_events_total{namespace="${NAMESPACE}",container="${CONTAINER}",${POD_SELECTOR}}[10m])) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} pod {{ $labels.pod }} was out-of-memory killed"
  description: "The kernel killed a process in the app container for exceeding its memory limit in the last 10 minutes. Check heap and off-heap growth, then the memory limit."
- alert: HttpP95Slow
  prefixable: true
  catalogueId: http-p95-slow
  sources:
  - http
  severity: warning
  unit: seconds
  threshold: 1
  for: 5m
  expr: |-
    histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{${HTTP_SELECTOR}}[5m]))) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} HTTP p95 above ${THRESHOLD} seconds"
  description: "Service-wide HTTP p95 stayed above ${THRESHOLD} seconds for 5 minutes. Check slow requests and downstream dependency latency."
- alert: Http5xx
  prefixable: true
  catalogueId: http5xx
  sources:
  - http
  severity: warning
  unit: ratio
  threshold: 0.05
  for: 5m
  expr: |-
    sum(increase(http_server_request_duration_seconds_count{${HTTP_SELECTOR},http_response_status_code=~"5.."}[5m])) >= 2
    and sum(increase(http_server_request_duration_seconds_count{${HTTP_SELECTOR},http_response_status_code=~"5.."}[5m])) / sum(increase(http_server_request_duration_seconds_count{${HTTP_SELECTOR}}[5m])) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} HTTP 5xx above ${THRESHOLD} with more than 1 error"
  description: "HTTP 5xx exceeded 1 error per 5 minutes and a ${THRESHOLD} ratio of requests for 5 minutes. The ratio guard suppresses quiet-cluster noise. Check server errors and dependencies."
- alert: UptimeProbeFailed
  prefixable: true
  catalogueId: uptime-probe-failed
  sources:
  - probe
  severity: critical
  unit: count
  threshold: 0
  for: 2m
  expr: |-
    min by (instance) (probe_success{namespace="${NAMESPACE}"}) == ${THRESHOLD}
  summary: "${SERVICE_SHORT} health probe failing for {{ $labels.instance }}"
  description: "The public health URL returned a non-2xx or no answer for 2 minutes. This proves the app and load balancer path only, not the database, cache or other dependencies. Check the pods and the ALB target health."
- alert: RdsCpuHigh
  prefixable: false
  catalogueId: rds-cpu
  sources:
  - rds
  severity: warning
  unit: percent
  threshold: 70
  for: 5m
  expr: |-
    max by (dimension_DBInstanceIdentifier) (aws_rds_cpuutilization_average{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} database {{ $labels.dimension_DBInstanceIdentifier }} CPU above ${THRESHOLD}"
  description: "Database CPU stayed above ${THRESHOLD} for 5 minutes (configured threshold). Look for a slow query or a load spike before resizing the instance."
- alert: RdsCpuCritical
  prefixable: false
  catalogueId: rds-cpu
  sources:
  - rds
  severity: critical
  unit: percent
  threshold: 80
  for: 5m
  expr: |-
    max by (dimension_DBInstanceIdentifier) (aws_rds_cpuutilization_average{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} database {{ $labels.dimension_DBInstanceIdentifier }} CPU above ${THRESHOLD}"
  description: "Database CPU stayed above ${THRESHOLD} for 5 minutes (configured threshold). Look for a slow query or a load spike before resizing the instance."
- alert: RdsStorageLow
  prefixable: false
  catalogueId: rds-storage
  sources:
  - rds
  severity: warning
  unit: bytes
  threshold: 0
  for: 15m
  expr: |-
    min by (dimension_DBInstanceIdentifier) (aws_rds_free_storage_space_minimum{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) < ${THRESHOLD}
  summary: "${SERVICE_SHORT} database {{ $labels.dimension_DBInstanceIdentifier }} free storage below ${THRESHOLD}"
  description: "Database free storage stayed below ${THRESHOLD} for 15 minutes. Check storage growth and autoscaling."
- alert: RdsStorageCritical
  prefixable: false
  catalogueId: rds-storage
  sources:
  - rds
  severity: critical
  unit: bytes
  threshold: 0
  for: 15m
  expr: |-
    min by (dimension_DBInstanceIdentifier) (aws_rds_free_storage_space_minimum{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) < ${THRESHOLD}
  summary: "${SERVICE_SHORT} database {{ $labels.dimension_DBInstanceIdentifier }} free storage below ${THRESHOLD}"
  description: "Database free storage stayed below ${THRESHOLD} for 15 minutes. Check storage growth and autoscaling."
- alert: ElasticacheCpuHigh
  prefixable: false
  catalogueId: elasticache-cpu
  sources:
  - elasticache
  severity: warning
  unit: percent
  threshold: 70
  for: 5m
  expr: |-
    max by (dimension_CacheClusterId) (aws_elasticache_engine_cpuutilization_average{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} cache {{ $labels.dimension_CacheClusterId }} engine CPU above ${THRESHOLD}"
  description: "The cache engine thread stayed above ${THRESHOLD} CPU for 5 minutes (configured threshold). Check for hot keys or a burst of commands before resizing the node."
- alert: ElasticacheCpuCritical
  prefixable: false
  catalogueId: elasticache-cpu
  sources:
  - elasticache
  severity: critical
  unit: percent
  threshold: 80
  for: 5m
  expr: |-
    max by (dimension_CacheClusterId) (aws_elasticache_engine_cpuutilization_average{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} cache {{ $labels.dimension_CacheClusterId }} engine CPU above ${THRESHOLD}"
  description: "The cache engine thread stayed above ${THRESHOLD} CPU for 5 minutes (configured threshold). Check for hot keys or a burst of commands before resizing the node."
- alert: ElasticacheMemoryHigh
  prefixable: false
  catalogueId: elasticache-memory
  sources:
  - elasticache
  severity: warning
  unit: percent
  threshold: 70
  for: 5m
  expr: |-
    max by (dimension_CacheClusterId) (aws_elasticache_database_memory_usage_percentage_maximum{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} cache {{ $labels.dimension_CacheClusterId }} memory above ${THRESHOLD}"
  description: "Cache memory stayed above ${THRESHOLD} for 5 minutes (configured threshold). Keys will start to be evicted near 100%; check key growth and TTLs."
- alert: ElasticacheMemoryCritical
  prefixable: false
  catalogueId: elasticache-memory
  sources:
  - elasticache
  severity: critical
  unit: percent
  threshold: 80
  for: 5m
  expr: |-
    max by (dimension_CacheClusterId) (aws_elasticache_database_memory_usage_percentage_maximum{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} cache {{ $labels.dimension_CacheClusterId }} memory above ${THRESHOLD}"
  description: "Cache memory stayed above ${THRESHOLD} for 5 minutes (configured threshold). Keys will start to be evicted near 100%; check key growth and TTLs."
- alert: ElasticacheEvictions
  prefixable: false
  catalogueId: elasticache-evictions
  sources:
  - elasticache
  severity: warning
  unit: count
  threshold: 0
  for: 0m
  expr: |-
    max by (dimension_CacheClusterId) (max_over_time(aws_elasticache_evictions_sum{namespace="${NAMESPACE}",name!="global",tag_Project="${TAG_PROJECT}"}[15m])) > ${THRESHOLD}
  summary: "${SERVICE_SHORT} cache {{ $labels.dimension_CacheClusterId }} is evicting keys"
  description: "The cache evicted keys in the last 15 minutes, so it is out of memory and dropping data. Check memory use and key TTLs."
