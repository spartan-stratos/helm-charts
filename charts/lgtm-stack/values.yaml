# lgtm-stack renders one ArgoCD Application per LGTM Lite component (app of apps). Install it as an Application in the
# ArgoCD namespace; the Applications it creates deploy the stack into `namespace` on the target cluster.

# ArgoCD side
argocd:
  # Namespace the Application CRs are created in (where ArgoCD runs)
  namespace: argocd
  # AppProject the Applications belong to. Required
  project: ""
  # Target cluster: set name (a registered cluster) or server
  destination:
    name: ""
    server: ""
  # Prefix for the Application names, e.g. lgtm-grafana
  namePrefix: lgtm-
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

# Where the addon Applications (plain manifests: rules, datasources, Instrumentation) pull this chart from.
# Defaults to this chart's own version in the Spartan Helm repository; set path (and a git repoURL) to test a branch.
self:
  repoURL: https://spartan-stratos.github.io/helm-charts
  chart: lgtm-stack
  # Defaults to the version of this chart
  targetRevision: ""
  path: ""

# Fixed: the presets wire components together through monitoring.svc.cluster.local URLs
namespace: monitoring

networkPolicy:
  # Only effective where the CNI enforces NetworkPolicy, which prod does not yet.
  enabled: false
  allowFromNamespaces: []

platformTenant: platform
# Keep log alert evaluation opt-in because it requires tenant authentication.
logRules:
  enabled: false
  sidecar:
    image: docker.io/kiwigrid/k8s-sidecar:2.11.2
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  limits:
    maxRuleGroupsPerTenant: 10
    maxRulesPerRuleGroup: 10
# See README.md Tenant gateway receivers for Kubernetes/ECS identity and credential isolation.
# Configure tenant Grafana groups before orgId; a missing-org provider makes Grafana exit 1.
tenants: []
# Keep tenant logs and traces disabled until their backends enforce tenant authentication.
tenantIsolation:
  enabled: false
gateway:
  ingress:
    enabled: false
    className: alb
    host: ""

cluster:
  # Cluster label on every metric and log line (Prometheus externalLabels, Alloy, Slack messages). Required
  name: ""

# Pins every pod of the stack to a dedicated node (the stateless ones follow edgePlacement when set), e.g.
#   nodeSelector: { workload: lgtm }, tolerations: [{ key: workload, operator: Equal, value: lgtm, effect: NoSchedule }]
# Set nodeSelector as well as the toleration, or a Pending pod can make a node autoscaler launch a node for it.
# With a nodeSelector, Alloy's Service routes OTLP across nodes (internalTrafficPolicy: Cluster).
placement:
  nodeSelector: {}
  tolerations: []

# Replaces placement (whole, not per field) for the stateless pods: alloy-gateway, the operators, kube-state-metrics,
# prom-label-proxy and Thanos rulers. Set, it also adds its tolerations to the node-exporter and Alloy DaemonSets and
# gives alloy-gateway a PodDisruptionBudget and a zone spread. Empty: everything follows placement.
edgePlacement:
  nodeSelector: {}
  tolerations: []

grafana:
  tenantDashboards:
    # Main sidecar namespaces when any tenant has orgId; tenant namespaces here fail rendering.
    platformNamespaces: [monitoring]
  # Mapping and confined parent folders are enabled by tenant viewers or editors groups.
  # Both tenant group tiers map to Viewer, with Edit permission inside their parent folder.
  orgMapping:
    # Orgs created after Grafana starts are invisible to org_mapping for 1-2 minutes.
    # The job waits this long; no restart needed.
    settleSeconds: 120
  # Sets grafana.ini server.root_url and the Ingress host
  domain: ""
  ingress:
    enabled: false
    className: alb
    annotations: {}
  # none | keycloak | github. Adds presets/grafana-sso-<provider>.yaml; the client secret is Secret grafana-oauth,
  # key client-secret. Settings as in the preset, e.g. keycloak: { url, realm, clientId, admin: [], member: [] }
  sso:
    provider: none
    keycloak: {}
    github: {}

alerting:
  # AlertmanagerConfig sending warning and critical alerts to Slack. The webhook URL lives in a Secret created outside
  # git; reconciliation requires both that Secret and the slack AlertmanagerConfig.
  slack:
    enabled: false
    secretName: alert-slack
    secretKey: webhook-url
    unrouted:
      # Surface unclaimed alerts so missing namespace routes cannot silently drop them.
      enabled: true
    # Namespaces whose own AlertmanagerConfig routes their alerts to a project channel. The shared channel then receives
    # only their critical alerts, not warnings. Missing routes fall back to UNROUTED unless unrouted.enabled is false.
    ownedNamespaces: []
    # When non-empty, only these namespaces and cluster-level alerts reach the shared channel; ownedNamespaces is ignored.
    # Any namespace not listed and without its own route falls back to UNROUTED unless unrouted.enabled is false.
    sharedNamespaces: []
  # Shared PrometheusRule bundles. A project's own rules go in its project folder (see `project`)
  rules:
    # RED per service from Tempo span metrics (server spans). Thresholds per severity; drop one to skip that severity
    services:
      enabled: true
      # Requests per second below which a service is not alerted on, so a quiet service does not page on one error
      minRequestRate: 0.1
      errorRate: { warning: 0.02, critical: 0.05, for: 10m }
      # Seconds
      latencyP95: { warning: 1, critical: 3, for: 10m }
      # Per service, merged over the above, e.g. payments: { errorRate: { critical: 0.01 } } or batch: { enabled: false }
      overrides: {}
      # Per service, namespace label on its own alert set; unmapped services keep no namespace label, e.g. checkout: shop-prod
      namespaces: {}
    # Image pull failures, OOM kills, memory near the limit, pods annotated for injection but without an agent
    workloads:
      enabled: true
      memoryLimitRatio: 0.9

# One entry per component. enabled turns its Application off; values is merged over the preset (and over the
# settings above), so anything the upstream chart accepts can be set here. ignoreDifferences is appended to the
# built-in list. annotations is added to the component Application's metadata.
components:
  promLabelProxy:
    annotations: {}
    enabled: true
    chart: { repoURL: https://prometheus-community.github.io/helm-charts, name: prom-label-proxy, version: 0.25.2 }
    values: {}
    ignoreDifferences: []
  prometheusOperatorCrds:
    annotations: {}
    enabled: true
    # Bump together with kube-prometheus-stack: 32.0.1 ships the CRDs for operator v0.94.1
    chart: { repoURL: https://prometheus-community.github.io/helm-charts, name: prometheus-operator-crds, version: 32.0.1 }
    values: {}
    ignoreDifferences: []
  kubePrometheusStack:
    annotations: {}
    enabled: true
    chart: { repoURL: https://prometheus-community.github.io/helm-charts, name: kube-prometheus-stack, version: 91.9.0 }
    values: {}
    ignoreDifferences: []
  grafana:
    annotations: {}
    enabled: true
    chart: { repoURL: https://grafana-community.github.io/helm-charts, name: grafana, version: 13.2.6 }
    values: {}
    ignoreDifferences: []
  loki:
    annotations: {}
    enabled: true
    chart: { repoURL: https://grafana-community.github.io/helm-charts, name: loki, version: 18.13.7 }
    values: {}
    ignoreDifferences: []
  alloy:
    annotations: {}
    enabled: true
    chart: { repoURL: https://grafana.github.io/helm-charts, name: alloy, version: 1.13.0 }
    values: {}
    ignoreDifferences: []
  tempo:
    annotations: {}
    enabled: true
    chart: { repoURL: https://grafana-community.github.io/helm-charts, name: tempo, version: 3.0.0 }
    values: {}
    ignoreDifferences: []
  alloyGateway:
    annotations: {}
    enabled: true
    chart: { repoURL: https://grafana.github.io/helm-charts, name: alloy, version: 1.13.0 }
    values: {}
    ignoreDifferences: []
  opentelemetryOperator:
    annotations: {}
    enabled: true
    chart: { repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts, name: opentelemetry-operator, version: 0.123.1 }
    values: {}
    ignoreDifferences: []

# Plain manifests from files/manifests, each in its own Application
addons:
  clusterInfo:
    enabled: true
  # Shared dashboards from files/dashboards: Services/Service overview (RED), LGTM/LGTM Lite self-monitoring
  dashboards:
    enabled: true
  pvcFillRules:
    enabled: true
  # Alerts when Loki, Tempo or Alloy drop data
  stackRules:
    enabled: true
  grafanaDatasources:
    enabled: true
  # Turn on in the release that enables Loki auth and Tempo multitenancy.
  # Remove after retention has passed: the configured retention (chart defaults: Loki 14 days, Tempo 7 days).
  grafanaDatasourcesLegacy:
    enabled: false
  instrumentation:
    enabled: true
    # Java agent image for the default Instrumentation. Operators without a built-in default inject an empty image and
    # every annotated pod is rejected. Empty omits it.
    javaImage: ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-java:2.22.0

# The project's own dashboards and alert rules: an Application syncing a folder of the project's GitOps repo into
# `namespace`. ArgoCD detects the folder type (Helm chart, kustomize or plain YAML). Dashboards are ConfigMaps labelled
# grafana_dashboard: "1" (folder in annotation grafana_folder); rules are PrometheusRules. See the README.
# Other projects on the cluster deploy the same folder from their own repo, into their own namespace.
project:
  enabled: false
  repoURL: ""
  targetRevision: HEAD
  path: ""

# Internal: set on the addon Applications, which render one addon's manifests instead of Applications
mode: applications
addon: ""
