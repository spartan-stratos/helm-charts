# Values test-rules.sh renders the rule bundles with: one override that tightens, one that turns a service off
cluster:
  name: test
retention:
  loki: 2592000
  tempo: 1296000
alerting:
  rules:
    services:
      namespaces:
        checkout: shop-prod
        catalog: shop-data
      overrides:
        catalog: { errorRate: { critical: 0.01 }, latencyP95: { critical: 0.5 } }
        payments: { errorRate: { critical: 0.01 } }
        batch.jobs: { enabled: false }
