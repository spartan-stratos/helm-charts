{{- if and (eq .Values.mode "addon") (eq .Values.addon "gateway") .Values.tenants .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alloy-gateway
  namespace: {{ .Values.namespace }}
  annotations:
    alb.ingress.kubernetes.io/group.name: external
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    alb.ingress.kubernetes.io/success-codes: 200-499
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  rules:
    - host: {{ required "gateway.ingress.host is required" .Values.gateway.ingress.host | quote }}
      http:
        paths:
{{- range $index, $tenant := (include "lgtm-stack.gatewayLanes" . | fromYamlArray) }}
{{- if $tenant.ingress }}
          - path: {{ $tenant.path }}
            pathType: Prefix
            backend:
              service:
                name: alloy-gateway
                port:
                  name: tenant-{{ $index }}
{{- end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.mode "addon") (eq .Values.addon "gateway") .Values.tenants }}
{{- range $tenant := .Values.tenants }}
{{- $receivers := list $tenant }}
{{- if hasKey $tenant "receivers" }}
{{- $receivers = $tenant.receivers }}
{{- end }}
{{- range $receiver := $receivers }}
{{- if hasKey $receiver "htpasswdExternalSecret" }}
{{- $external := $receiver.htpasswdExternalSecret | default dict }}
{{- $store := $external.secretStore | default dict }}
{{- $secret := $receiver.htpasswdSecret | default dict }}
{{- $name := required "htpasswdSecret.name is required with htpasswdExternalSecret" $secret.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name | quote }}
  namespace: {{ $.Values.namespace }}
spec:
  refreshInterval: {{ $external.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    name: {{ required "htpasswdExternalSecret.secretStore.name is required" $store.name | quote }}
    kind: {{ required "htpasswdExternalSecret.secretStore.kind is required" $store.kind | quote }}
  target:
    name: {{ $name | quote }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: {{ $secret.key | default "htpasswd" | quote }}
      remoteRef:
        key: {{ required "htpasswdExternalSecret.remoteKey is required" $external.remoteKey | quote }}
        property: {{ $external.property | default "htpasswd" | quote }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
