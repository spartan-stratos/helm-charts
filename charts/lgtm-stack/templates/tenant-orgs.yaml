{{- if and (eq .Values.mode "addon") (eq .Values.addon "tenantOrgs") .Values.tenants .Values.components.grafana.enabled }}
{{- include "lgtm-stack.validateTenantFolders" . }}
{{- $admin := .Values.grafanaAdmin | default dict }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-tenant-orgs
  namespace: {{ .Values.namespace }}
data:
  provision.sh: |
    #!/bin/sh
    set -eu
    base=http://grafana.monitoring.svc.cluster.local
    request() {
      method=$1
      shift
      response=$(curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 30 \
        -u "$GF_USER:$GF_PASSWORD" -w '\n%{http_code}' "$@") || {
        code=$(printf '%s\n' "$response" | sed -n '$p')
        { [ "$code" = 404 ] && [ "$method" = GET ]; } || [ "$method" = GET_PERMISSIONS ] || exit 1
      }
      code=$(printf '%s\n' "$response" | sed -n '$p')
      body=$(printf '%s\n' "$response" | sed '$d')
    }
    attempts=0
    until curl --silent --show-error --fail-with-body --connect-timeout 5 --max-time 10 \
      -u "$GF_USER:$GF_PASSWORD" -o /dev/null "$base/api/health"; do
      attempts=$((attempts + 1))
      [ "$attempts" -lt 60 ] || exit 1
      sleep 5
    done
    datasource() {
      request GET -X GET -H "X-Grafana-Org-Id: $org_id" "$base/api/datasources/uid/$1"
      if [ "$code" = 404 ]; then
        request POST -X POST -H "X-Grafana-Org-Id: $org_id" \
          -H 'Content-Type: application/json' -d "$2" "$base/api/datasources"
      fi
    }
{{- if .Values.grafana.tenantFolders.enabled }}
    request GET -X GET "$base/api/user"
    admin_id=$(printf '%s\n' "$body" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
    case "$admin_id" in ''|*[!0-9]*) exit 1 ;; esac
    admin_login=$(printf '%s\n' "$body" | sed -n 's/.*"login"[[:space:]]*:[[:space:]]*\("\([^"\\]\|\\.\)*"\).*/\1/p')
    [ -n "$admin_login" ] || exit 1
    verify_permissions() {
      permission_attempt=1
      while [ "$permission_attempt" -le 12 ]; do
        request GET_PERMISSIONS -X GET -H "X-Grafana-Org-Id: $org_id" "$base/api/folders/$1/permissions"
        permissions=$(printf '%s\n' "$body" | sed 's/}[[:space:]]*,[[:space:]]*{/}\n{/g')
        viewer_permission=$(printf '%s\n' "$permissions" | sed -n '/"role"[[:space:]]*:[[:space:]]*"Viewer"/s/.*"permission"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
        editor_entry=$(printf '%s\n' "$permissions" | sed -n '/"role"[[:space:]]*:[[:space:]]*"Editor"/p')
        if [ "$code" = 200 ] && [ "$viewer_permission" = "$2" ] && [ -z "$editor_entry" ]; then
          return 0
        fi
        [ "$permission_attempt" -lt 12 ] || break
        sleep 10
        permission_attempt=$((permission_attempt + 1))
      done
      printf 'folder %s permission verification failed after 12 attempts: %s\n' "$1" "$body" >&2
      exit 1
    }
{{- end }}
{{- range $tenant := .Values.tenants }}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $tenant.id)) (gt (len $tenant.id) 30) }}{{ fail "tenant id must be a DNS-1123 label of at most 30 characters" }}{{ end }}
    request GET -X GET "$base/api/orgs/name/{{ $tenant.id }}"
    if [ "$code" = 404 ]; then
      request POST -X POST -H 'Content-Type: application/json' \
        -d '{"name":{{ $tenant.id | toJson }}}' "$base/api/orgs"
      org_id=$(printf '%s\n' "$body" | sed -n 's/.*"orgId"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
    else
      org_id=$(printf '%s\n' "$body" | sed -n 's/.*"id"[[:space:]]*:[[:space:]]*\([0-9][0-9]*\).*/\1/p')
    fi
    case "$org_id" in ''|*[!0-9]*) exit 1 ;; esac
{{- $grafana := $tenant.grafana | default dict }}
{{- if hasKey $grafana "orgId" }}
{{- if not (regexMatch "^[1-9][0-9]*$" (toString $grafana.orgId)) }}{{ fail "tenant grafana.orgId must be a positive integer" }}{{ end }}
    if [ "$org_id" != '{{ $grafana.orgId }}' ]; then
      printf 'tenant {{ $tenant.id }} orgId mismatch: expected %s, got %s\n' '{{ $grafana.orgId }}' "$org_id" >&2
      exit 1
    fi
{{- end }}
{{- if $.Values.grafana.tenantFolders.enabled }}
    request GET -X GET "$base/api/orgs/$org_id/users"
    admin_member=$(printf '%s\n' "$body" | sed 's/}[[:space:]]*,[[:space:]]*{/}\n{/g' | sed -n '/"userId"[[:space:]]*:[[:space:]]*'"$admin_id"'[[:space:]]*[,}]/p')
    if [ -z "$admin_member" ]; then
      request POST -X POST -H 'Content-Type: application/json' \
        -d "{\"loginOrEmail\":$admin_login,\"role\":\"Admin\"}" "$base/api/orgs/$org_id/users"
    else
      admin_role=$(printf '%s\n' "$admin_member" | sed -n 's/.*"role"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
      if [ "$admin_role" != Admin ]; then
        printf 'tenant {{ $tenant.id }} admin membership must have role Admin, got %s\n' "$admin_role" >&2
        exit 1
      fi
    fi
{{- end }}
{{- if $.Values.tenantIsolation.enabled }}
    datasource loki '{"name":"Loki","uid":"loki","type":"loki","access":"proxy","url":"http://loki.monitoring.svc.cluster.local:3100","jsonData":{"httpHeaderName1":"X-Scope-OrgID"},"secureJsonData":{"httpHeaderValue1":{{ $tenant.id | toJson }}}}'
    datasource tempo '{"name":"Tempo","uid":"tempo","type":"tempo","access":"proxy","url":"http://tempo.monitoring.svc.cluster.local:3200","jsonData":{"httpHeaderName1":"X-Scope-OrgID"},"secureJsonData":{"httpHeaderValue1":{{ $tenant.id | toJson }}}}'
{{- end }}
{{- if $.Values.components.promLabelProxy.enabled }}
    datasource prometheus '{"name":"Prometheus","uid":"prometheus","type":"prometheus","access":"proxy","url":"http://prom-label-proxy-{{ $tenant.id }}.monitoring.svc.cluster.local:8080","isDefault":true}'
{{- end }}
    printf 'tenant org %s id %s\n' '{{ $tenant.id }}' "$org_id"
{{- if $.Values.grafana.tenantFolders.enabled }}
    request GET -X GET -H "X-Grafana-Org-Id: $org_id" "$base/api/folders/{{ $tenant.id }}"
    if [ "$code" = 404 ]; then
      request POST -X POST -H "X-Grafana-Org-Id: $org_id" \
        -H 'Content-Type: application/json' -d '{"uid":"{{ $tenant.id }}","title":"{{ $tenant.id }}"}' "$base/api/folders"
    fi
    request POST -X POST -H "X-Grafana-Org-Id: $org_id" \
      -H 'Content-Type: application/json' -d '{"items":[{"role":"Admin","permission":4},{"role":"Viewer","permission":2}]}' \
      "$base/api/folders/{{ $tenant.id }}/permissions"
    verify_permissions '{{ $tenant.id }}' 2
    request GET -X GET -H "X-Grafana-Org-Id: $org_id" "$base/api/folders"
    [ "$code" = 200 ] || exit 1
    # Grafana returns root folders only when parentUid is omitted.
    folder_uids=$(printf '%s\n' "$body" | sed 's/}[[:space:]]*,[[:space:]]*{/}\n{/g' | sed -n 's/.*"uid"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
    for folder_uid in $folder_uids; do
      [ "$folder_uid" = '{{ $tenant.id }}' ] && continue
      request POST -X POST -H "X-Grafana-Org-Id: $org_id" \
        -H 'Content-Type: application/json' -d '{"items":[{"role":"Admin","permission":4}]}' \
        "$base/api/folders/$folder_uid/permissions"
      verify_permissions "$folder_uid" ''
    done
{{- end }}
{{- end }}
{{- if .Values.grafana.orgMapping.enabled }}
{{- $settleSeconds := dig "settleSeconds" 120 .Values.grafana.orgMapping }}
{{- if not (regexMatch "^[0-9]+$" (toString $settleSeconds)) }}{{ fail "grafana.orgMapping.settleSeconds must be a non-negative integer" }}{{ end }}
{{- range $tenant := .Values.tenants }}
    request GET -X GET "$base/api/orgs/name/{{ $tenant.id }}"
    if [ "$code" = 404 ]; then
      printf '%s\n' 'tenant org {{ $tenant.id }} missing after provisioning' >&2
      exit 1
    fi
{{- end }}
    sleep {{ $settleSeconds }}
{{- end }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-tenant-orgs
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      {{- with .Values.placement.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.placement.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: provision
          image: docker.io/curlimages/curl:8.11.1
          command: ["/bin/sh", "/scripts/provision.sh"]
          env:
            - name: GF_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $admin.secret | default "grafana-admin" | quote }}
                  key: {{ $admin.userKey | default "admin-user" | quote }}
            - name: GF_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $admin.secret | default "grafana-admin" | quote }}
                  key: {{ $admin.passwordKey | default "admin-password" | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: grafana-tenant-orgs
{{- end }}
