{{- /* Addon mode: the manifests of one addon, copied verbatim apart from the __PLACEHOLDERS__ (their own {{ }} are Prometheus and Alertmanager templates) */}}
{{- if eq .Values.mode "addon" }}
{{- $a := index (include "lgtm-stack.addons" . | fromYaml) .Values.addon }}
{{- if not $a }}{{ fail (printf "unknown addon %q" .Values.addon) }}{{ end }}
{{- if and (eq .Values.addon "networkPolicy") .Values.networkPolicy.enabled }}
{{- range $backend := list "loki" "tempo" "prometheus" "alertmanager" }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lgtm-{{ $backend }}
  namespace: {{ $.Values.namespace }}
spec:
  podSelector:
    matchLabels:
      {{- if has $backend (list "loki" "tempo") }}
      app.kubernetes.io/name: {{ $backend }}
      app.kubernetes.io/instance: {{ $backend }}
      {{- else }}
      {{ $backend }}: kube-prometheus-stack
      {{- end }}
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range prepend $.Values.networkPolicy.allowFromNamespaces $.Values.namespace }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . | quote }}
        {{- end }}
{{- end }}
{{- end }}
{{- if $a.dashboards }}
{{- range $path, $_ := $.Files.Glob "files/dashboards/*/*.json" }}
{{- $name := base $path | trimSuffix ".json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lgtm-dashboard-{{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ base (dir $path) | quote }}
data:
  {{ $name }}.json: {{ $.Files.Get $path | quote }}
{{- end }}
{{- end }}
{{- with $a.rules }}
---
{{ include (printf "lgtm-stack.rules.%s" .) $ }}
{{- end }}
{{- range $a.files }}
{{- $m := $.Files.Get (printf "files/manifests/%s" .)
  | replace "__CLUSTER_NAME__" (required "cluster.name is required" $.Values.cluster.name)
  | replace "__SLACK_SECRET_NAME__" $.Values.alerting.slack.secretName
  | replace "__SLACK_SECRET_KEY__" $.Values.alerting.slack.secretKey }}
{{- $m = replace "__PLATFORM_TENANT__" $.Values.platformTenant $m }}
{{- with $.Values.addons.instrumentation.javaImage }}
{{- $m = replace "__JAVA_AGENT_IMAGE__" . $m }}
{{- else }}
{{- $m = regexReplaceAll "(?m)^.*__JAVA_AGENT_IMAGE__.*\n?" $m "" }}
{{- end }}
{{- if $.Values.alerting.slack.sharedNamespaces }}
{{- $shared := join "|" $.Values.alerting.slack.sharedNamespaces }}
{{- $m = replace "__SLACK_OWNED_MATCHER__" (printf "- name: namespace\n            matchType: \"=~\"\n            value: %s" $shared) $m }}
{{- $m = replace "__SLACK_OWNED_CRITICAL_ROUTE__" "- receiver: slack\n        continue: true\n        matchers:\n          - name: severity\n            matchType: \"=~\"\n            value: warning|critical\n          - name: namespace\n            value: \"\"" $m }}
{{- else if $.Values.alerting.slack.ownedNamespaces }}
{{- /* Owned namespaces route to their own AlertmanagerConfig: the shared channel keeps only their critical alerts */}}
{{- $owned := join "|" $.Values.alerting.slack.ownedNamespaces }}
{{- $m = replace "__SLACK_OWNED_MATCHER__" (printf "- name: namespace\n            matchType: \"!~\"\n            value: %s" $owned) $m }}
{{- $m = replace "__SLACK_OWNED_CRITICAL_ROUTE__" (printf "- receiver: slack\n        continue: true\n        matchers:\n          - name: severity\n            value: critical\n          - name: namespace\n            matchType: \"=~\"\n            value: %s" $owned) $m }}
{{- else }}
{{- $m = regexReplaceAll "(?m)^.*__SLACK_OWNED_[A-Z_]+__.*\n?" $m "" }}
{{- end }}
{{- if $.Values.alerting.slack.unrouted.enabled }}
{{- $m = replace "__SLACK_ROOT_RECEIVER__" "slack-unrouted" $m }}
{{- $m = replace "__SLACK_UNROUTED_NULL_ROUTE__" "- receiver: \"null\"\n        continue: true\n        matchers:\n          - name: severity\n            matchType: \"=~\"\n            value: info|none" $m }}
{{- /* Reuse the Slack body so both receivers retain identical links and per-alert text. */}}
{{- $receiver := regexFind "(?s)    - name: slack\\n.*" $m | trimSuffix "    __SLACK_UNROUTED_RECEIVER__\n" }}
{{- $receiver = replace "- name: slack\n" "- name: slack-unrouted\n" $receiver }}
{{- $receiver = replace "title: '[" "title: '[UNROUTED] [" $receiver }}
{{- $receiver = replace "text: |-\n" "text: |-\n            No route claimed this alert. Add a spartan-alerts release for namespace {{ if .CommonLabels.namespace }}{{ .CommonLabels.namespace }}{{ else }}none{{ end }}, or list it in alerting.slack.sharedNamespaces.\n" $receiver }}
{{- $m = replace "    __SLACK_UNROUTED_RECEIVER__\n" $receiver $m }}
{{- else }}
{{- $m = replace "__SLACK_ROOT_RECEIVER__" "\"null\"" $m }}
{{- $m = regexReplaceAll "(?m)^.*__SLACK_UNROUTED_[A-Z_]+__.*\\n?" $m "" }}
{{- end }}
{{- with $.Values.grafana.domain }}
{{- $m = replace "__GRAFANA_URL__" (printf "https://%s" .) $m }}
{{- else }}
{{- /* No Grafana URL to link to: drop the lines that need one */}}
{{- $m = regexReplaceAll "(?m)^.*__GRAFANA_URL__.*\n?" $m "" }}
{{- end }}
---
{{ $m }}
{{- end }}
{{- end }}
