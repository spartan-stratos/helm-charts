{{- if eq .Values.mode "applications" }}
{{- $_ := required "argocd.project is required" .Values.argocd.project }}
{{- $_ := required "cluster.name is required" .Values.cluster.name }}
{{- $tenantIds := dict }}
{{- $tenantPorts := dict }}
{{- range $tenant := .Values.tenants }}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" $tenant.id)) (gt (len $tenant.id) 30) }}{{ fail "tenant id must be a DNS-1123 label of at most 30 characters" }}{{ end }}
{{- if hasKey $tenantIds $tenant.id }}{{ fail "tenant ids must be unique" }}{{ end }}
{{- $_ := set $tenantIds $tenant.id true }}
{{- if or (eq $tenant.id $.Values.platformTenant) (eq $tenant.id "fake") (eq $tenant.id "single-tenant") }}{{ fail "tenant id must not equal platformTenant or the reserved ids fake and single-tenant" }}{{ end }}
{{- if hasKey $tenant "receivers" }}
{{- if or (hasKey $tenant "port") (hasKey $tenant "htpasswdSecret") }}{{ fail "tenant receivers and tenant-level port/htpasswdSecret are mutually exclusive" }}{{ end }}
{{- $names := dict }}
{{- range $receiver := $tenant.receivers }}
{{- if or (not (regexMatch "^[a-z0-9]([a-z0-9-]*[a-z0-9])?$" ($receiver.name | default ""))) (gt (len ($receiver.name | default "")) 63) }}{{ fail "receiver name must be a DNS-1123 label of at most 63 characters" }}{{ end }}
{{- if hasKey $names $receiver.name }}{{ fail "receiver names must be unique per tenant" }}{{ end }}
{{- $_ := set $names $receiver.name true }}
{{- if empty $receiver.namespaces }}{{ fail "receiver namespaces must be non-empty" }}{{ end }}
{{- range $receiver.namespaces }}
{{- if not (has . ($tenant.namespaces | default list)) }}{{ fail "receiver namespaces must be a subset of tenant namespaces" }}{{ end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- $lanes := include "lgtm-stack.gatewayLanes" . | fromYamlArray }}
{{- $paths := dict }}
{{- $ingressPaths := list }}
{{- range $lane := $lanes }}
{{- if empty $lane.port }}{{ fail "tenant port is required" }}{{ end }}
{{- $port := toString $lane.port }}
{{- if or (kindIs "string" $lane.port) (not (regexMatch "^[0-9]+$" $port)) (lt (float64 $lane.port) 1024.0) (gt (float64 $lane.port) 65535.0) }}{{ fail "tenant port must be an integer in 1024..65535" }}{{ end }}
{{- $portKey := printf "%d" (int $lane.port) }}
{{- if hasKey $tenantPorts $portKey }}{{ fail "tenant ports must be unique" }}{{ end }}
{{- $_ := set $tenantPorts $portKey true }}
{{- if hasKey $paths $lane.path }}{{ fail "gateway lane paths must be unique" }}{{ end }}
{{- $_ := set $paths $lane.path true }}
{{- if $lane.ingress }}
{{- $path := trimSuffix "/" $lane.path }}
{{- range $ingressPaths }}
{{- if or (hasPrefix (printf "%s/" .) $path) (hasPrefix (printf "%s/" $path) .) (eq . $path) }}{{ fail "gateway ingress paths must not overlap at a / boundary" }}{{ end }}
{{- end }}
{{- $ingressPaths = append $ingressPaths $path }}
{{- end }}
{{- end }}
{{- $components := include "lgtm-stack.components" . | fromYaml }}
{{- if hasKey $components "Error" }}{{ fail $components.Error }}{{ end }}
{{- range $key, $c := $components }}
{{- $cv := index $.Values.components $key }}
{{- if and $cv.enabled (or (ne $key "alloyGateway") (not (empty $.Values.tenants))) }}
{{- $ignores := concat ($c.ignoreDifferences | default list) ($cv.ignoreDifferences | default list) }}
---
{{ include "lgtm-stack.applicationHeader" (list $ $c.app $c.wave $cv.annotations) }}
spec:
  project: {{ $.Values.argocd.project }}
  {{- include "lgtm-stack.destination" $ | nindent 2 }}
  source:
    repoURL: {{ $cv.chart.repoURL }}
    chart: {{ $cv.chart.name }}
    targetRevision: {{ $cv.chart.version | quote }}
    helm:
      releaseName: {{ $c.app }}
      {{- $values := include "lgtm-stack.values" (list $ $key $c) }}
      {{- if eq $values "{}" }}
      {{- else if $c.valuesAsString }}
      values: | {{- $values | nindent 8 }}
      {{- else }}
      valuesObject: {{- $values | nindent 8 }}
      {{- end }}
  {{- with $ignores }}
  ignoreDifferences: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- include "lgtm-stack.syncPolicy" (list $ (gt (len $ignores) 0)) | nindent 2 }}
{{- end }}
{{- end }}
{{- $hasTenantNamespaces := false }}
{{- range $tenant := .Values.tenants }}
{{- if $tenant.namespaces }}
{{- $hasTenantNamespaces = true }}
{{- end }}
{{- $cv := $.Values.components.promLabelProxy }}
{{- if $cv.enabled }}
{{- $name := printf "prom-label-proxy-%s" $tenant.id }}
{{- $c := dict "presets" list "placement" (list "") }}
{{- $values := dict "fullnameOverride" $name "config" (dict "upstream" "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090" "label" "tenant" "extraArgs" (list (printf "--label-value=%s" $tenant.id) "--enable-label-apis=true" "--error-on-replace=true")) }}
{{- include "lgtm-stack.merge" (list $values (fromYaml (include "lgtm-stack.values" (list $ "promLabelProxy" $c)))) }}
---
{{ include "lgtm-stack.applicationHeader" (list $ $name 31) }}
spec:
  project: {{ $.Values.argocd.project }}
  {{- include "lgtm-stack.destination" $ | nindent 2 }}
  source:
    repoURL: {{ $cv.chart.repoURL }}
    chart: {{ $cv.chart.name }}
    targetRevision: {{ $cv.chart.version | quote }}
    helm:
      releaseName: {{ $name }}
      valuesObject: {{- toYaml $values | nindent 8 }}
  {{- with $cv.ignoreDifferences }}
  ignoreDifferences: {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- include "lgtm-stack.syncPolicy" (list $ (not (empty $cv.ignoreDifferences))) | nindent 2 }}
{{- end }}
{{- end }}
{{- $addons := include "lgtm-stack.addons" . | fromYaml }}
{{- range $key, $a := $addons }}
{{- $enabled := false }}
{{- if eq $key "alertmanagerConfig" }}
{{- $enabled = $.Values.alerting.slack.enabled }}
{{- else if eq $key "gateway" }}
{{- $enabled = and (not (empty $.Values.tenants)) $.Values.components.alloyGateway.enabled $.Values.gateway.ingress.enabled }}
{{- else if eq $key "tenantRules" }}
{{- $enabled = and $hasTenantNamespaces $.Values.components.promLabelProxy.enabled }}
{{- else if eq $key "tenantOrgs" }}
{{- $enabled = and (not (empty $.Values.tenants)) $.Values.components.grafana.enabled }}
{{- else if $a.rules }}
{{- $enabled = (index $.Values.alerting.rules $a.rules).enabled }}
{{- else }}
{{- $enabled = (index $.Values.addons $key).enabled }}
{{- end }}
{{- if $enabled }}
---
{{ include "lgtm-stack.applicationHeader" (list $ $a.app $a.wave) }}
spec:
  project: {{ $.Values.argocd.project }}
  {{- include "lgtm-stack.destination" $ | nindent 2 }}
  source:
    repoURL: {{ $.Values.self.repoURL }}
    {{- if $.Values.self.path }}
    path: {{ $.Values.self.path }}
    targetRevision: {{ required "self.targetRevision is required with self.path" $.Values.self.targetRevision | quote }}
    {{- else }}
    chart: {{ $.Values.self.chart }}
    targetRevision: {{ $.Values.self.targetRevision | default $.Chart.Version | quote }}
    {{- end }}
    helm:
      releaseName: {{ printf "%s%s" $.Values.argocd.namePrefix $a.app }}
      valuesObject:
        mode: addon
        addon: {{ $key }}
        namespace: {{ $.Values.namespace }}
        {{- if or (eq $key "tenantOrgs") (eq $key "gateway") }}
        tenantIsolation: {{- toYaml $.Values.tenantIsolation | nindent 10 }}
        {{- end }}
        {{- if eq $key "instrumentation" }}
        addons:
          instrumentation:
            javaImage: {{ $.Values.addons.instrumentation.javaImage | quote }}
        {{- end }}
        {{- if eq $key "tenantOrgs" }}
        {{- $grafana := include "lgtm-stack.values" (list $ "grafana" $components.grafana) | fromYaml }}
        grafanaAdmin:
          secret: {{ $grafana.admin.existingSecret | quote }}
          userKey: {{ $grafana.admin.userKey | quote }}
          passwordKey: {{ $grafana.admin.passwordKey | quote }}
        tenants: {{- toYaml $.Values.tenants | nindent 10 }}
        placement: {{- toYaml $.Values.placement | nindent 10 }}
        components:
          grafana:
            enabled: {{ $.Values.components.grafana.enabled }}
          promLabelProxy:
            enabled: {{ $.Values.components.promLabelProxy.enabled }}
        {{- end }}
        {{- if eq $key "tenantRules" }}
        tenants: {{- toYaml $.Values.tenants | nindent 10 }}
        placement: {{- toYaml $.Values.placement | nindent 10 }}
        components:
          promLabelProxy:
            enabled: {{ $.Values.components.promLabelProxy.enabled }}
        {{- end }}
        {{- if eq $key "gateway" }}
        tenants: {{- toYaml $.Values.tenants | nindent 10 }}
        gateway: {{- toYaml $.Values.gateway | nindent 10 }}
        {{- end }}
        {{- if eq $key "grafanaDatasources" }}
        platformTenant: {{ $.Values.platformTenant | quote }}
        {{- end }}
        cluster: {{- toYaml $.Values.cluster | nindent 10 }}
        alerting: {{- toYaml $.Values.alerting | nindent 10 }}
        grafana:
          domain: {{ $.Values.grafana.domain | quote }}
  {{- include "lgtm-stack.syncPolicy" (list $ false) | nindent 2 }}
{{- end }}
{{- end }}
{{- with .Values.project }}
{{- if .enabled }}
---
{{ include "lgtm-stack.applicationHeader" (list $ "project" 42) }}
spec:
  project: {{ $.Values.argocd.project }}
  {{- include "lgtm-stack.destination" $ | nindent 2 }}
  source:
    repoURL: {{ required "project.repoURL is required" .repoURL }}
    targetRevision: {{ .targetRevision | quote }}
    path: {{ required "project.path is required" .path }}
  {{- include "lgtm-stack.syncPolicy" (list $ false) | nindent 2 }}
{{- end }}
{{- end }}
{{- end }}
