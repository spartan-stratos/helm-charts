fullnameOverride: alloy-gateway
controller:
  type: deployment
  replicas: 2
  volumes:
    extra:
{{- range $index, $tenant := (include "lgtm-stack.gatewayLanes" . | fromYamlArray) }}
      - name: tenant-{{ $index }}
        secret:
          secretName: {{ required "tenant htpasswdSecret.name is required" $tenant.htpasswdSecret.name | quote }}
          items:
            - key: {{ required "tenant htpasswdSecret.key is required" $tenant.htpasswdSecret.key | quote }}
              path: htpasswd
{{- end }}
alloy:
  mounts:
    extra:
{{- range $index, $tenant := (include "lgtm-stack.gatewayLanes" . | fromYamlArray) }}
      - name: tenant-{{ $index }}
        mountPath: /etc/alloy/tenants/{{ $index }}
        readOnly: true
{{- end }}
  extraPorts:
{{- range $index, $tenant := (include "lgtm-stack.gatewayLanes" . | fromYamlArray) }}
    - name: tenant-{{ $index }}
      port: {{ $tenant.port }}
      targetPort: {{ $tenant.port }}
      protocol: TCP
{{- end }}
  configMap:
    create: true
    content: |
{{- range $index, $tenant := (include "lgtm-stack.gatewayLanes" . | fromYamlArray) }}
{{- $ecsMode := eq ($tenant.mode | default "kubernetes") "ecs" }}
      otelcol.auth.basic "tenant_{{ $index }}" {
        htpasswd {
          file = "/etc/alloy/tenants/{{ $index }}/htpasswd"
        }
      }
      otelcol.receiver.otlp "tenant_{{ $index }}" {
        http {
          endpoint = "0.0.0.0:{{ $tenant.port }}"
          auth = otelcol.auth.basic.tenant_{{ $index }}.handler
          max_request_body_size = "4MiB"
          traces_url_path = "{{ $tenant.path }}/v1/traces"
          metrics_url_path = "{{ $tenant.path }}/v1/metrics"
          logs_url_path = "{{ $tenant.path }}/v1/logs"
        }
        output {
{{- if $.Values.tenantIsolation.enabled }}
          logs = [otelcol.processor.filter.tenant_{{ $index }}.input]
{{- end }}
          metrics = [otelcol.processor.filter.tenant_{{ $index }}.input]
{{- if $.Values.tenantIsolation.enabled }}
          traces = [otelcol.processor.filter.tenant_{{ $index }}.input]
{{- end }}
        }
      }
{{- if $ecsMode }}
{{- $fixed := dict "tenant" $tenant.id "env" $tenant.environment "deployment.environment" $tenant.environment "deployment.environment.name" $tenant.environment }}
{{- $identity := dict "cloud.account.id" "cloud.account.id" "aws.ecs.cluster.arn" "aws.ecs.cluster.arn" "aws.ecs.task.arn" "aws.ecs.task.arn" "service.name" "service.name" "service.instance.id" "aws.ecs.task.arn" }}
{{- $drop := list }}
{{- range $key := list "cloud.account.id" "aws.ecs.cluster.arn" "aws.ecs.task.arn" "service.name" }}
{{- $drop = append $drop (printf "not IsString(resource.attributes[%s])" ($key | toJson)) }}
{{- end }}
{{- range $key, $value := dict "cloud.account.id" $tenant.ecs.accountId "aws.ecs.cluster.arn" $tenant.ecs.clusterArn }}
{{- $drop = append $drop (printf "resource.attributes[%s] != %s" ($key | toJson) ($value | toJson)) }}
{{- end }}
{{- $services := list }}
{{- range $tenant.ecs.serviceNames }}
{{- $services = append $services (printf "resource.attributes[\"service.name\"] == %s" (. | toJson)) }}
{{- end }}
{{- $drop = append $drop (printf "not (%s)" (join " or " $services)) }}
{{- $taskPattern := printf "^%s/[0-9a-f]{32}$" (replace ":cluster/" ":task/" $tenant.ecs.clusterArn) }}
{{- $drop = append $drop (printf "not IsMatch(resource.attributes[\"aws.ecs.task.arn\"], %s)" ($taskPattern | toJson)) }}
{{- range $key := list "namespace" "k8s.namespace.name" }}
{{- $drop = append $drop (printf "resource.attributes[%s] != nil" ($key | toJson)) }}
{{- end }}
{{- range $key, $value := $fixed }}
{{- $drop = append $drop (printf "resource.attributes[%s] != nil and (not IsString(resource.attributes[%s]) or resource.attributes[%s] != %s)" ($key | toJson) ($key | toJson) ($key | toJson) ($value | toJson)) }}
{{- end }}
{{- $drop = concat $drop (list "resource.attributes[\"service.instance.id\"] != nil and (not IsString(resource.attributes[\"service.instance.id\"]) or resource.attributes[\"service.instance.id\"] != resource.attributes[\"aws.ecs.task.arn\"])" "Len(resource.attributes) > 64" "Len(instrumentation_scope.attributes) > 64") }}
{{- $resourceDrop := $drop }}
{{- range $key := list "namespace" "k8s.namespace.name" }}
{{- $drop = append $drop (printf "attributes[%s] != nil" ($key | toJson)) }}
{{- end }}
{{- range $key, $value := $fixed }}
{{- $drop = append $drop (printf "attributes[%s] != nil and (not IsString(attributes[%s]) or attributes[%s] != %s)" ($key | toJson) ($key | toJson) ($key | toJson) ($value | toJson)) }}
{{- end }}
{{- range $key, $resourceKey := $identity }}
{{- $drop = append $drop (printf "attributes[%s] != nil and (not IsString(attributes[%s]) or attributes[%s] != resource.attributes[%s])" ($key | toJson) ($key | toJson) ($key | toJson) ($resourceKey | toJson)) }}
{{- end }}
{{- $drop = append $drop "Len(attributes) > 64" }}
      // BasicAuth identifies the tenant; ECS attributes are matching constraints, not AWS attestation.
      otelcol.processor.filter "tenant_{{ $index }}" {
        error_mode = "propagate"
        metrics {
          metric = [{{ range $i, $condition := $resourceDrop }}{{ if $i }}, {{ end }}{{ $condition | quote }}{{ end }}]
          datapoint = [{{ range $i, $condition := $drop }}{{ if $i }}, {{ end }}{{ $condition | quote }}{{ end }}]
        }
        logs {
          log_record = [{{ range $i, $condition := $drop }}{{ if $i }}, {{ end }}{{ $condition | quote }}{{ end }}]
        }
        traces {
          span = [{{ range $i, $condition := $drop }}{{ if $i }}, {{ end }}{{ $condition | quote }}{{ end }}]
        }
        output {
          logs = [otelcol.processor.attributes.tenant_{{ $index }}.input]
          metrics = [otelcol.processor.attributes.tenant_{{ $index }}.input]
          traces = [otelcol.processor.attributes.tenant_{{ $index }}.input]
        }
      }
{{- else }}
      // A credential may only write its own namespaces: drop any telemetry naming another namespace, in the resource or in
      // the datapoint, log or span attributes, so one tenant cannot forge series that another tenant's or the platform's
      // rules select by namespace.
      otelcol.processor.filter "tenant_{{ $index }}" {
        error_mode = "ignore"
        metrics {
          datapoint = [{{ printf "resource.attributes[\"k8s.namespace.name\"] != nil and not IsMatch(resource.attributes[\"k8s.namespace.name\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}, {{ printf "attributes[\"namespace\"] != nil and not IsMatch(attributes[\"namespace\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}]
        }
{{- if $.Values.tenantIsolation.enabled }}
        logs {
          log_record = ["resource.attributes[\"k8s.namespace.name\"] == nil", {{ printf "resource.attributes[\"k8s.namespace.name\"] != nil and not IsMatch(resource.attributes[\"k8s.namespace.name\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}, {{ printf "attributes[\"namespace\"] != nil and not IsMatch(attributes[\"namespace\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}]
        }
        traces {
          span = ["resource.attributes[\"k8s.namespace.name\"] == nil", {{ printf "resource.attributes[\"k8s.namespace.name\"] != nil and not IsMatch(resource.attributes[\"k8s.namespace.name\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}, {{ printf "attributes[\"namespace\"] != nil and not IsMatch(attributes[\"namespace\"], \"^(%s)$\")" (join "|" $tenant.namespaces) | quote }}]
        }
{{- end }}
        output {
{{- if $.Values.tenantIsolation.enabled }}
          logs = [otelcol.processor.attributes.tenant_{{ $index }}.input]
{{- end }}
          metrics = [otelcol.processor.attributes.tenant_{{ $index }}.input]
{{- if $.Values.tenantIsolation.enabled }}
          traces = [otelcol.processor.attributes.tenant_{{ $index }}.input]
{{- end }}
        }
      }
{{- end }}
      otelcol.processor.attributes "tenant_{{ $index }}" {
        action {
          key = "tenant"
          value = {{ $tenant.id | quote }}
          action = "upsert"
        }
        output {
{{- if $.Values.tenantIsolation.enabled }}
          logs = [otelcol.processor.transform.tenant_{{ $index }}.input]
{{- end }}
          metrics = [otelcol.processor.transform.tenant_{{ $index }}.input]
{{- if $.Values.tenantIsolation.enabled }}
          traces = [otelcol.processor.transform.tenant_{{ $index }}.input]
{{- end }}
        }
      }
      // Prometheus promotes resource attributes, so stamp the resource too.
      otelcol.processor.transform "tenant_{{ $index }}" {
{{- if $ecsMode }}
        error_mode = "propagate"
{{- $resourceStatements := list "keep_keys(attributes, [\"cloud.account.id\", \"aws.ecs.cluster.arn\", \"aws.ecs.task.arn\", \"service.name\"])" "set(attributes[\"service.instance.id\"], attributes[\"aws.ecs.task.arn\"])" }}
{{- $businessKeys := list "http.request.method" "http.response.status_code" "http.route" "url.scheme" "server.address" "server.port" "network.protocol.name" "network.protocol.version" "error.type" "jvm.memory.type" "jvm.memory.pool.name" "jvm.gc.name" "jvm.thread.state" "jvm.buffer.pool.name" "db.system.name" "db.operation.name" "db.client.connection.pool.name" "pool.name" "state" "type" }}
{{- $signalStatements := list "keep_keys(instrumentation_scope.attributes, [])" }}
{{- range $key, $value := dict "tenant" $tenant.id "env" $tenant.environment "deployment.environment" $tenant.environment "deployment.environment.name" $tenant.environment }}
{{- $statement := printf "set(attributes[%s], %s)" ($key | toJson) ($value | toJson) }}
{{- $resourceStatements = append $resourceStatements $statement }}
{{- $signalStatements = append $signalStatements $statement }}
{{- end }}
{{- range $block, $context := dict "log_statements" "log" "metric_statements" "datapoint" "trace_statements" "span" }}
{{- $contextKeys := $businessKeys }}
{{- if eq $context "span" }}{{- $contextKeys = concat $businessKeys (list "url.path") }}{{- end }}
{{- $contextStatements := concat (list (printf "keep_keys(attributes, %s)" ($contextKeys | toJson))) $signalStatements }}
        {{ $block }} {
          context = "resource"
          statements = [{{ range $i, $statement := $resourceStatements }}{{ if $i }}, {{ end }}{{ $statement | quote }}{{ end }}]
        }
        {{ $block }} {
          context = {{ $context | quote }}
          statements = [{{ range $i, $statement := $contextStatements }}{{ if $i }}, {{ end }}{{ $statement | quote }}{{ end }}]
        }
{{- end }}
{{- else }}
{{- if $tenant.stampNamespace }}
        // Overwrite after the filter, which already checked the original namespace: a sender cannot pick the stored one.
{{- if $.Values.tenantIsolation.enabled }}
        log_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"k8s.namespace.name\"], %s)" ($tenant.stampNamespace | toJson) | quote }}]
        }
        // Only where the sender set a record-level namespace: adding one to every line or span would create a new field.
        log_statements {
          context = "log"
          statements = [{{ printf "set(attributes[\"namespace\"], %s) where attributes[\"namespace\"] != nil" ($tenant.stampNamespace | toJson) | quote }}]
        }
{{- end }}
        metric_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"k8s.namespace.name\"], %s)" ($tenant.stampNamespace | toJson) | quote }}]
        }
        metric_statements {
          context = "datapoint"
          statements = [{{ printf "set(attributes[\"namespace\"], %s)" ($tenant.stampNamespace | toJson) | quote }}]
        }
{{- if $.Values.tenantIsolation.enabled }}
        trace_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"k8s.namespace.name\"], %s)" ($tenant.stampNamespace | toJson) | quote }}]
        }
        trace_statements {
          context = "span"
          statements = [{{ printf "set(attributes[\"namespace\"], %s) where attributes[\"namespace\"] != nil" ($tenant.stampNamespace | toJson) | quote }}]
        }
{{- end }}
{{- end }}
{{- if $.Values.tenantIsolation.enabled }}
        log_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"tenant\"], %s)" ($tenant.id | toJson) | quote }}]
        }
{{- end }}
        metric_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"tenant\"], %s)" ($tenant.id | toJson) | quote }}]
        }
        metric_statements {
          context = "datapoint"
          statements = ["set(attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where attributes[\"namespace\"] == nil and resource.attributes[\"k8s.namespace.name\"] != nil"]
        }
{{- if $.Values.tenantIsolation.enabled }}
        trace_statements {
          context = "resource"
          statements = [{{ printf "set(attributes[\"tenant\"], %s)" ($tenant.id | toJson) | quote }}]
        }
{{- end }}
{{- end }}
        output {
{{- if $.Values.tenantIsolation.enabled }}
          logs = [otelcol.exporter.otlphttp.loki_{{ $index }}.input]
{{- end }}
          metrics = [otelcol.exporter.otlphttp.prometheus_{{ $index }}.input]
{{- if $.Values.tenantIsolation.enabled }}
          traces = [otelcol.exporter.otlp.tempo_{{ $index }}.input]
{{- end }}
        }
      }
{{- if $.Values.tenantIsolation.enabled }}
      otelcol.exporter.otlphttp "loki_{{ $index }}" {
        client {
          endpoint = "http://loki.monitoring.svc.cluster.local:3100/otlp"
          headers = { "X-Scope-OrgID" = {{ $tenant.id | quote }} }
        }
      }
{{- end }}
      otelcol.exporter.otlphttp "prometheus_{{ $index }}" {
{{- if $ecsMode }}
        sending_queue {
          num_consumers = 1
        }
{{- end }}
        client {
          endpoint = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp"
          headers = { "X-Scope-OrgID" = {{ $tenant.id | quote }} }
        }
      }
{{- if $.Values.tenantIsolation.enabled }}
      otelcol.exporter.otlp "tempo_{{ $index }}" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          headers = { "X-Scope-OrgID" = {{ $tenant.id | quote }} }
          tls {
            insecure = true
          }
        }
      }
{{- end }}
{{- end }}
