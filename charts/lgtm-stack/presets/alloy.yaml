# Lite preset: one Alloy per node for pod logs and app OTLP (logs to Loki, metrics to Prometheus, traces to Tempo).
# Metrics are scraped by Prometheus, not Alloy.
# CLUSTER_NAME comes from the monitoring-cluster-info ConfigMap (addon clusterInfo).
fullnameOverride: alloy

controller:
  type: daemonset

service:
  # Apps send OTLP to the Alloy on their own node
  internalTrafficPolicy: Local

serviceMonitor:
  enabled: true

alloy:
  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  envFrom:
    - configMapRef:
        name: monitoring-cluster-info
  extraPorts:
    - { name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP }
    - { name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP }
  # loki.source.file tails the node's log files
  mounts:
    varlog: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  configMap:
    create: true
    content: |
      logging {
        level = "info"
      }

      // Pod logs (stdout) on this node -> Loki
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // Java pods ship logs over OTLP from the agent; tailing stdout too would duplicate them
        rule {
          source_labels = ["__meta_kubernetes_pod_annotation_instrumentation_opentelemetry_io_inject_java"]
          regex         = ".+"
          action        = "drop"
        }
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name", "__meta_kubernetes_pod_label_app", "__meta_kubernetes_pod_container_name"]
          separator     = ";"
          regex         = "^;*([^;]+).*$"
          target_label  = "service_name"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_team"]
          target_label  = "team"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pod_logs" {
        path_targets = discovery.relabel.pod_logs.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pod_logs.targets
        forward_to = [loki.process.pods.receiver]
      }

      loki.process "pods" {
        stage.cri {}
        stage.json {
          expressions = { trace_id = "trace_id", span_id = "span_id", level = "level" }
        }
        stage.structured_metadata {
          values = { trace_id = "", span_id = "", pod = "" }
        }
        // pod is high churn: keep it as structured metadata, not a stream label
        stage.label_drop {
          values = ["pod", "filename"]
        }
        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
        external_labels = { cluster = sys.env("CLUSTER_NAME") }
      }

      // OTLP from apps (OTel Operator agents) -> Tempo / Prometheus / Loki
      otelcol.receiver.otlp "default" {
        grpc {
          endpoint = "0.0.0.0:4317"
        }
        http {
          endpoint = "0.0.0.0:4318"
        }
        output {
          metrics = [otelcol.processor.k8sattributes.default.input]
          logs    = [otelcol.processor.k8sattributes.default.input]
          traces  = [otelcol.processor.k8sattributes.default.input]
        }
      }

      // No node filter: with internalTrafficPolicy Cluster, OTLP reaches any node's Alloy, including from Fargate pods
      otelcol.processor.k8sattributes "default" {
        extract {
          metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.deployment.name", "k8s.node.name"]
          label {
            from     = "pod"
            key      = "team"
            tag_name = "team"
          }
        }
        output {
          metrics = [otelcol.processor.batch.default.input]
          logs    = [otelcol.processor.transform.log_labels.input]
          traces  = [otelcol.processor.batch.default.input]
        }
      }

      // OTLP logs get the same stream labels as stdout logs (cluster, namespace, container), so one
      // query finds a service whether it logs to stdout or over OTLP
      otelcol.processor.transform "log_labels" {
        error_mode = "ignore"
        log_statements {
          context = "resource"
          statements = [
            "set(resource.attributes[\"cluster\"], \"" + sys.env("CLUSTER_NAME") + "\")",
            "set(resource.attributes[\"namespace\"], resource.attributes[\"k8s.namespace.name\"]) where resource.attributes[\"k8s.namespace.name\"] != nil",
            "set(resource.attributes[\"container\"], resource.attributes[\"k8s.container.name\"]) where resource.attributes[\"k8s.container.name\"] != nil",
          ]
        }
        output {
          logs = [otelcol.processor.batch.default.input]
        }
      }

      otelcol.processor.batch "default" {
        output {
          metrics = [otelcol.exporter.otlphttp.prometheus.input]
          logs    = [otelcol.exporter.otlphttp.loki.input]
          traces  = [otelcol.exporter.otlp.tempo.input]
        }
      }

      // otlphttp appends /v1/metrics
      otelcol.exporter.otlphttp "prometheus" {
        client {
          endpoint = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/otlp"
        }
      }

      otelcol.exporter.otlphttp "loki" {
        client {
          endpoint = "http://loki.monitoring.svc.cluster.local:3100/otlp"
        }
      }

      otelcol.exporter.otlp "tempo" {
        client {
          endpoint = "tempo.monitoring.svc.cluster.local:4317"
          tls {
            insecure = true
          }
        }
      }
