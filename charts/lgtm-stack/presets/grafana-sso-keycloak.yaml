# Optional layer on top of grafana.yaml: Keycloak login (generic OAuth) with preset roles, login form off.
# A project only sets sso.keycloak: the Keycloak URL and realm, the client id, and which groups are admin / member.
# The client secret comes from Secret grafana-oauth (key client-secret).
# Keycloak client: redirect URI <root_url>/login/generic_oauth, and a "Group Membership" mapper named groups
# (token claim name groups, Full group path off, added to ID token, access token and userinfo).
sso:
  keycloak:
    url: CHANGE_ME
    realm: CHANGE_ME
    clientId: grafana
    # Keycloak group names. admin -> Grafana Admin, member -> Editor; anyone else is refused
    admin: []
    member: []

envValueFrom:
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
    secretKeyRef:
      name: grafana-oauth
      key: client-secret

# The chart runs every grafana.ini string through tpl, so URLs and the role rule are built from sso.keycloak
grafana.ini:
  auth:
    # Break-glass: the admin user still works over API basic auth
    disable_login_form: true
    signout_redirect_url: >-
      {{- $k := .Values.sso.keycloak -}}
      {{ $k.url }}/realms/{{ $k.realm }}/protocol/openid-connect/logout?client_id={{ $k.clientId }}&post_logout_redirect_uri={{ printf "%s/login" (index .Values "grafana.ini" "server" "root_url") | urlquery }}
  auth.generic_oauth:
    enabled: true
    name: Keycloak
    allow_sign_up: true
    auto_login: false
    client_id: "{{ .Values.sso.keycloak.clientId }}"
    client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    scopes: openid email profile
    use_pkce: true
    # Disabled users lose access within the access-token lifespan
    use_refresh_token: true
    auth_url: "{{ .Values.sso.keycloak.url }}/realms/{{ .Values.sso.keycloak.realm }}/protocol/openid-connect/auth"
    token_url: "{{ .Values.sso.keycloak.url }}/realms/{{ .Values.sso.keycloak.realm }}/protocol/openid-connect/token"
    api_url: "{{ .Values.sso.keycloak.url }}/realms/{{ .Values.sso.keycloak.realm }}/protocol/openid-connect/userinfo"
    login_attribute_path: preferred_username
    email_attribute_path: email
    name_attribute_path: name
    groups_attribute_path: groups
    role_attribute_strict: true
    role_attribute_path: >-
      {{- $k := .Values.sso.keycloak -}}
      {{- $admin := list -}}{{- range $k.admin -}}{{- $admin = append $admin (printf "contains(groups[*], '%s')" .) -}}{{- end -}}
      {{- $member := list -}}{{- range $k.member -}}{{- $member = append $member (printf "contains(groups[*], '%s')" .) -}}{{- end -}}
      {{- if $admin -}}({{ join " || " $admin }}) && 'Admin' || {{ end -}}
      {{- if $member -}}({{ join " || " $member }}) && 'Editor' || {{ end -}}
      ''
