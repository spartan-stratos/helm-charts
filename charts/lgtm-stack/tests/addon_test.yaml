suite: "Addon mode"

templates:
  - "templates/addon.yaml"

set:
  mode: addon
  cluster.name: example-cluster

tests:
  - it: "renders cluster-info with the cluster name"
    set:
      addon: clusterInfo
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.CLUSTER_NAME
          value: example-cluster

  - it: "renders the Slack AlertmanagerConfig with the Secret reference and keeps Alertmanager templates"
    set:
      addon: alertmanagerConfig
      alerting.slack.secretName: my-slack
    asserts:
      - isKind:
          of: AlertmanagerConfig
      - equal:
          path: spec.receivers[0].slackConfigs[0].apiURL.name
          value: my-slack
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: 'cluster=example-cluster\{\{ if \.Labels\.namespace \}\} namespace=\{\{ \.Labels\.namespace \}\}'

  - it: "renders both datasources"
    set:
      addon: grafanaDatasources
    asserts:
      - hasDocuments:
          count: 2

  - it: "renders one dashboard ConfigMap per JSON file, labelled for the Grafana sidecar with its folder"
    set:
      addon: dashboards
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: Services
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-service-red
      - matchRegex:
          path: data["service-red.json"]
          pattern: '"uid": "lgtm-service-red"'
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-service-red
      - equal:
          path: metadata.annotations.grafana_folder
          value: LGTM
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-lgtm-self-monitoring

  - it: "renders the services rule bundle with per-service overrides"
    set:
      addon: serviceRules
      alerting.rules.services.overrides:
        payments: { errorRate: { critical: 0.01 } }
        batch: { enabled: false }
    asserts:
      - isKind:
          of: PrometheusRule
      # four default alerts (minus the overridden services) and four for payments; batch gets none
      - lengthEqual:
          path: spec.groups[1].rules
          count: 8
      - matchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: 'service!~`batch\|payments`'
      - matchRegex:
          path: spec.groups[1].rules[6].expr
          pattern: 'service="payments"\} > 0.01'
      - equal:
          path: spec.groups[1].rules[0].annotations.summary
          value: Service {{ $labels.service }} is failing {{ $value | humanizePercentage }} of requests

  - it: "renders the workloads rule bundle"
    set:
      addon: workloadRules
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4

  - it: "links the Slack message to Grafana when grafana.domain is set"
    set:
      addon: alertmanagerConfig
      grafana.domain: grafana.example.com
    asserts:
      - equal:
          path: spec.receivers[0].slackConfigs[0].titleLink
          value: https://grafana.example.com/alerting/list?search={{ .CommonLabels.alertname | urlquery }}
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: '<https://grafana\.example\.com/alerting/silence/new\?alertmanager=alertmanager&matcher='
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: '<https://grafana\.example\.com\{\{ \.Annotations\.dashboard_url \}\}\|Dashboard>'

  - it: "drops the Grafana links without grafana.domain"
    set:
      addon: alertmanagerConfig
    asserts:
      - notExists:
          path: spec.receivers[0].slackConfigs[0].titleLink
      - notMatchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: 'GRAFANA|Silence|Dashboard'
      - matchRegex:
          path: spec.receivers[0].slackConfigs[0].text
          pattern: '\|Runbook>'

  - it: "renders the stack rules"
    set:
      addon: stackRules
    asserts:
      - isKind:
          of: PrometheusRule
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4

  - it: "fails on an unknown addon"
    set:
      addon: nope
    asserts:
      - failedTemplate:
          errorMessage: 'unknown addon "nope"'
