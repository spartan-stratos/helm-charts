suite: "Addon mode"

templates:
  - "templates/addon.yaml"

set:
  mode: addon
  cluster.name: example-cluster

tests:
  - it: "renders cluster-info with the cluster name"
    set:
      addon: clusterInfo
    asserts:
      - isKind:
          of: ConfigMap
      - equal:
          path: data.CLUSTER_NAME
          value: example-cluster

  - it: "renders the Slack AlertmanagerConfig with the Secret reference and keeps Alertmanager templates"
    set:
      addon: alertmanagerConfig
      alerting.slack.secretName: my-slack
    asserts:
      - isKind:
          of: AlertmanagerConfig
      - equal:
          path: spec.route.receiver
          value: "null"
      - notExists:
          path: spec.route.matchers
      - equal:
          path: spec.route.routes
          value:
            - receiver: slack
              continue: true
              matchers: [{ name: severity, matchType: "=~", value: "warning|critical" }]
      - equal:
          path: spec.receivers[0]
          value: { name: "null" }
      - equal:
          path: spec.inhibitRules
          value:
            - sourceMatch: [{ name: severity, value: critical }]
              targetMatch: [{ name: severity, matchType: "=~", value: "warning|info" }]
              equal: [namespace, alertname, persistentvolumeclaim, service]
            - sourceMatch: [{ name: severity, value: warning }]
              targetMatch: [{ name: severity, value: info }]
              equal: [namespace, alertname, persistentvolumeclaim, service]
            - sourceMatch: [{ name: alertname, value: InfoInhibitor }]
              targetMatch: [{ name: severity, value: info }]
              equal: [namespace]
            - targetMatch: [{ name: alertname, value: InfoInhibitor }]
      - equal:
          path: spec.receivers[1].slackConfigs[0].apiURL.name
          value: my-slack
      - matchRegex:
          path: spec.receivers[1].slackConfigs[0].text
          pattern: 'cluster=example-cluster\{\{ if \.Labels\.namespace \}\} namespace=\{\{ \.Labels\.namespace \}\}'

  - it: "renders both datasources"
    set:
      addon: grafanaDatasources
    asserts:
      - hasDocuments:
          count: 2

  - it: "renders one dashboard ConfigMap per JSON file, labelled for the Grafana sidecar with its folder"
    set:
      addon: dashboards
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.labels.grafana_dashboard
          value: "1"
      - equal:
          path: metadata.annotations.grafana_folder
          value: Services
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-service-red
      - matchRegex:
          path: data["service-red.json"]
          pattern: '"uid": "lgtm-service-red"'
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-service-red
      - equal:
          path: metadata.annotations.grafana_folder
          value: LGTM
        documentSelector:
          path: metadata.name
          value: lgtm-dashboard-lgtm-self-monitoring

  - it: "renders the services rule bundle with per-service overrides"
    set:
      addon: serviceRules
      alerting.rules.services.overrides:
        payments: { errorRate: { critical: 0.01 } }
        batch: { enabled: false }
    asserts:
      - isKind:
          of: PrometheusRule
      # four default alerts (minus the overridden services) and four for payments; batch gets none
      - lengthEqual:
          path: spec.groups[1].rules
          count: 8
      - matchRegex:
          path: spec.groups[1].rules[0].expr
          pattern: 'service!~`batch\|payments`'
      - matchRegex:
          path: spec.groups[1].rules[6].expr
          pattern: 'service="payments"\} > 0.01'
      - equal:
          path: spec.groups[1].rules[0].annotations.summary
          value: Service {{ $labels.service }} is failing {{ $value | humanizePercentage }} of requests

  - it: "renders the workloads rule bundle"
    set:
      addon: workloadRules
    asserts:
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4

  - it: "links the Slack message to Grafana when grafana.domain is set"
    set:
      addon: alertmanagerConfig
      grafana.domain: grafana.example.com
    asserts:
      - equal:
          path: spec.receivers[1].slackConfigs[0].titleLink
          value: https://grafana.example.com/alerting/list?search={{ .CommonLabels.alertname | urlquery }}
      - matchRegex:
          path: spec.receivers[1].slackConfigs[0].text
          pattern: '<https://grafana\.example\.com/alerting/silence/new\?alertmanager=alertmanager&matcher='
      - matchRegex:
          path: spec.receivers[1].slackConfigs[0].text
          pattern: '<https://grafana\.example\.com\{\{ \.Annotations\.dashboard_url \}\}\|Dashboard>'

  - it: "drops the Grafana links without grafana.domain"
    set:
      addon: alertmanagerConfig
    asserts:
      - notExists:
          path: spec.receivers[1].slackConfigs[0].titleLink
      - notMatchRegex:
          path: spec.receivers[1].slackConfigs[0].text
          pattern: 'GRAFANA|Silence|Dashboard'
      - matchRegex:
          path: spec.receivers[1].slackConfigs[0].text
          pattern: '\|Runbook>'

  - it: "renders the stack rules"
    set:
      addon: stackRules
    asserts:
      - isKind:
          of: PrometheusRule
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4

  - it: "fails on an unknown addon"
    set:
      addon: nope
    asserts:
      - failedTemplate:
          errorMessage: 'unknown addon "nope"'

  - it: "keeps only critical alerts of owned namespaces on the shared Slack route"
    set:
      addon: alertmanagerConfig
      alerting.slack.ownedNamespaces: [service-dietfit, service-x]
    asserts:
      - equal:
          path: spec.route.routes
          value:
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, matchType: "=~", value: "warning|critical" }
                - { name: namespace, matchType: "!~", value: "service-dietfit|service-x" }
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, value: critical }
                - { name: namespace, matchType: "=~", value: "service-dietfit|service-x" }

  - it: "includes only shared namespaces and cluster-level alerts on the shared Slack route"
    set:
      addon: alertmanagerConfig
      alerting.slack.sharedNamespaces: [service-a, service-b]
    asserts:
      - equal:
          path: spec.route.routes
          value:
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, matchType: "=~", value: "warning|critical" }
                - { name: namespace, matchType: "=~", value: "service-a|service-b" }
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, matchType: "=~", value: "warning|critical" }
                - { name: namespace, value: "" }

  - it: "ignores owned namespaces when shared namespaces are set"
    set:
      addon: alertmanagerConfig
      alerting.slack.sharedNamespaces: [service-a, service-b]
      alerting.slack.ownedNamespaces: [service-a, service-c]
    asserts:
      - equal:
          path: spec.route.routes
          value:
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, matchType: "=~", value: "warning|critical" }
                - { name: namespace, matchType: "=~", value: "service-a|service-b" }
            - receiver: slack
              continue: true
              matchers:
                - { name: severity, matchType: "=~", value: "warning|critical" }
                - { name: namespace, value: "" }

  - it: "puts the Java agent image on the default Instrumentation, and omits it when empty"
    set:
      addon: instrumentation
      addons.instrumentation.javaImage: example.invalid/java:1
    asserts:
      - equal:
          path: spec.java.image
          value: example.invalid/java:1

  - it: "omits java.image when the value is empty"
    set:
      addon: instrumentation
      addons.instrumentation.javaImage: ""
    asserts:
      - notExists:
          path: spec.java.image

  - it: "omits legacy datasources from the default addon"
    set:
      addon: grafanaDatasources
    asserts:
      - hasDocuments:
          count: 2
      - equal:
          path: metadata.name
          value: grafana-datasource-loki
        documentIndex: 0
      - equal:
          path: metadata.name
          value: grafana-datasource-tempo
        documentIndex: 1

  - it: "renders legacy datasources in fake with reciprocal links"
    set:
      addon: grafanaDatasourcesLegacy
      addons.grafanaDatasourcesLegacy.enabled: true
      platformTenant: custom-platform
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: grafana-datasource-loki-legacy
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'uid: loki-legacy\n'
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'httpHeaderName1: X-Scope-OrgID'
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'httpHeaderValue1: "fake"'
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'datasourceUid: tempo-legacy\n'
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'isDefault: false'
        documentIndex: 0
      - matchRegex:
          path: data["loki-legacy.yaml"]
          pattern: 'name: Loki \(legacy\)'
        documentIndex: 0
      - equal:
          path: metadata.name
          value: grafana-datasource-tempo-legacy
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'uid: tempo-legacy\n'
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'httpHeaderName1: X-Scope-OrgID'
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'httpHeaderValue1: "fake"'
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'datasourceUid: loki-legacy\n'
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'isDefault: false'
        documentIndex: 1
      - matchRegex:
          path: data["tempo-legacy.yaml"]
          pattern: 'name: Tempo \(legacy\)'
        documentIndex: 1

  - it: "preserves platform datasources when legacy is enabled"
    set:
      addon: grafanaDatasources
      addons.grafanaDatasourcesLegacy.enabled: true
      platformTenant: custom-platform
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: grafana-datasource-loki
        documentIndex: 0
      - matchRegex:
          path: data["loki.yaml"]
          pattern: 'uid: loki\n'
        documentIndex: 0
      - matchRegex:
          path: data["loki.yaml"]
          pattern: 'httpHeaderName1: X-Scope-OrgID'
        documentIndex: 0
      - matchRegex:
          path: data["loki.yaml"]
          pattern: 'httpHeaderValue1: "custom-platform"'
        documentIndex: 0
      - matchRegex:
          path: data["loki.yaml"]
          pattern: 'datasourceUid: tempo\n'
        documentIndex: 0
      - equal:
          path: metadata.name
          value: grafana-datasource-tempo
        documentIndex: 1
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: 'uid: tempo\n'
        documentIndex: 1
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: 'httpHeaderName1: X-Scope-OrgID'
        documentIndex: 1
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: 'httpHeaderValue1: "custom-platform"'
        documentIndex: 1
      - matchRegex:
          path: data["tempo.yaml"]
          pattern: 'datasourceUid: loki\n'
        documentIndex: 1
