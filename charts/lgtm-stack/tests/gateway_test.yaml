suite: Tenant gateway
templates:
  - templates/applications.yaml
  - templates/gateway.yaml
set:
  argocd.project: example
  argocd.destination.name: example-cluster
  cluster.name: example-cluster
tests:
  - it: renders separate receiver ExternalSecrets with defaults and overrides
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.host: otlp.example.com
      gateway.ingress.enabled: true
      tenants:
        - id: example
          receivers:
            - name: first
              port: 4320
              htpasswdSecret: { name: first-otlp }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: SecretStore }
                remoteKey: first-entry
            - name: second
              port: 4321
              htpasswdSecret: { name: second-otlp, key: credentials }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: ClusterSecretStore }
                remoteKey: second-entry
                property: credentials
                refreshInterval: 30m
    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: Ingress
        documentIndex: 0
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        documentIndex: 1
      - isKind:
          of: ExternalSecret
        documentIndex: 1
      - equal:
          path: metadata
          value: { name: first-otlp, namespace: monitoring }
        documentIndex: 1
      - equal:
          path: spec
          value:
            refreshInterval: 1h
            secretStoreRef: { name: example-store, kind: SecretStore }
            target: { name: first-otlp, creationPolicy: Owner, deletionPolicy: Retain }
            data:
              - secretKey: htpasswd
                remoteRef: { key: first-entry, property: htpasswd }
        documentIndex: 1
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
        documentIndex: 2
      - isKind:
          of: ExternalSecret
        documentIndex: 2
      - equal:
          path: metadata
          value: { name: second-otlp, namespace: monitoring }
        documentIndex: 2
      - equal:
          path: spec
          value:
            refreshInterval: 30m
            secretStoreRef: { name: example-store, kind: ClusterSecretStore }
            target: { name: second-otlp, creationPolicy: Owner, deletionPolicy: Retain }
            data:
              - secretKey: credentials
                remoteRef: { key: second-entry, property: credentials }
        documentIndex: 2
  - it: renders a legacy tenant ExternalSecret without ingress
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.host: otlp.example.com
      gateway.ingress.enabled: false
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: legacy-otlp }
          htpasswdExternalSecret:
            secretStore: { name: example-store, kind: SecretStore }
            remoteKey: legacy-entry
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: metadata
          value: { name: legacy-otlp, namespace: monitoring }
      - equal:
          path: spec
          value:
            refreshInterval: 1h
            secretStoreRef: { name: example-store, kind: SecretStore }
            target: { name: legacy-otlp, creationPolicy: Owner, deletionPolicy: Retain }
            data:
              - secretKey: htpasswd
                remoteRef: { key: legacy-entry, property: htpasswd }
  - it: renders only receiver ExternalSecrets when ingress is disabled
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.host: otlp.example.com
      gateway.ingress.enabled: false
      tenants:
        - id: example
          receivers:
            - name: first
              port: 4320
              htpasswdSecret: { name: first-otlp }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: SecretStore }
                remoteKey: first-entry
            - name: second
              port: 4321
              htpasswdSecret: { name: second-otlp }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: SecretStore }
                remoteKey: second-entry
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ExternalSecret
  - it: keeps only the ingress when ExternalSecrets are unset
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.enabled: true
      gateway.ingress.host: otlp.example.com
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: example-otlp }
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Ingress
  - it: enables the gateway addon for receiver ExternalSecrets without ingress
    template: templates/applications.yaml
    set:
      namespace: monitoring
      gateway.ingress.enabled: false
      gateway.ingress.host: otlp.example.com
      tenants:
        - id: example
          namespaces: [ns-dev]
          receivers:
            - name: first
              port: 4320
              namespaces: [ns-dev]
              htpasswdSecret: { name: first-otlp, key: htpasswd }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: SecretStore }
                remoteKey: first-entry
    documentSelector:
      path: metadata.name
      value: lgtm-gateway
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.addon
          value: gateway
      - equal:
          path: spec.source.helm.valuesObject.gateway.ingress.enabled
          value: false
      - equal:
          path: spec.source.helm.valuesObject.tenants[0].receivers[0].htpasswdExternalSecret.remoteKey
          value: first-entry
  - it: enables the gateway addon for legacy ExternalSecrets without ingress
    template: templates/applications.yaml
    set:
      namespace: monitoring
      gateway.ingress.enabled: false
      gateway.ingress.host: otlp.example.com
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: legacy-otlp, key: htpasswd }
          htpasswdExternalSecret:
            secretStore: { name: example-store, kind: SecretStore }
            remoteKey: legacy-entry
    documentSelector:
      path: metadata.name
      value: lgtm-gateway
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.addon
          value: gateway
      - equal:
          path: spec.source.helm.valuesObject.gateway.ingress.enabled
          value: false
  - it: rejects an ExternalSecret without a remote key
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.host: otlp.example.com
      gateway.ingress.enabled: false
      tenants:
        - id: example
          receivers:
            - name: first
              port: 4320
              htpasswdSecret: { name: first-otlp }
              htpasswdExternalSecret:
                secretStore: { name: example-store, kind: SecretStore }
    asserts:
      - failedTemplate:
          errorMessage: htpasswdExternalSecret.remoteKey is required
  - it: rejects an ExternalSecret without a store name
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      namespace: monitoring
      gateway.ingress.host: otlp.example.com
      gateway.ingress.enabled: false
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: legacy-otlp }
          htpasswdExternalSecret:
            secretStore: { kind: SecretStore }
            remoteKey: legacy-entry
    asserts:
      - failedTemplate:
          errorMessage: htpasswdExternalSecret.secretStore.name is required
  - it: drops namespace-less logs and spans while preserving the metric filter
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: true
      tenants:
        - id: example
          namespaces: [ns-dev]
          port: 4320
          htpasswdSecret: { name: example-otlp, key: htpasswd }
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'log_record = \["resource.attributes\[\\"k8s.namespace.name\\"\] == nil",'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'span = \["resource.attributes\[\\"k8s.namespace.name\\"\] == nil",'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'datapoint = \["resource.attributes\[\\"k8s.namespace.name\\"\] != nil and not IsMatch\(resource.attributes\[\\"k8s.namespace.name\\"\], \\"\^\(ns-dev\)\$\\"\)", "attributes\[\\"namespace\\"\] != nil and not IsMatch\(attributes\[\\"namespace\\"\], \\"\^\(ns-dev\)\$\\"\)"\]'
  - it: isolates two receiver credentials and allowlists under one tenant
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: true
      tenants:
        - id: example
          namespaces: [ns-dev, ns-prod]
          receivers:
            - { name: dev, port: 4320, path: /example, namespaces: [ns-dev], htpasswdSecret: { name: dev-otlp, key: dev } }
            - { name: prod, port: 4321, ingress: false, namespaces: [ns-prod], htpasswdSecret: { name: prod-otlp, key: prod } }
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.alloy.extraPorts
          value:
            - { name: tenant-0, port: 4320, targetPort: 4320, protocol: TCP }
            - { name: tenant-1, port: 4321, targetPort: 4321, protocol: TCP }
      - equal:
          path: spec.source.helm.valuesObject.controller.volumes.extra
          value:
            - name: tenant-0
              secret: { secretName: dev-otlp, items: [{ key: dev, path: htpasswd }] }
            - name: tenant-1
              secret: { secretName: prod-otlp, items: [{ key: prod, path: htpasswd }] }
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)otelcol.auth.basic "tenant_0".*file = "/etc/alloy/tenants/0/htpasswd".*otelcol.receiver.otlp "tenant_0".*endpoint = "0.0.0.0:4320".*auth = otelcol.auth.basic.tenant_0.handler.*traces_url_path = "/example/v1/traces".*metrics_url_path = "/example/v1/metrics".*logs_url_path = "/example/v1/logs"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)otelcol.auth.basic "tenant_1".*file = "/etc/alloy/tenants/1/htpasswd".*otelcol.receiver.otlp "tenant_1".*endpoint = "0.0.0.0:4321".*auth = otelcol.auth.basic.tenant_1.handler.*traces_url_path = "/example/prod/v1/traces".*metrics_url_path = "/example/prod/v1/metrics".*logs_url_path = "/example/prod/v1/logs"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)otelcol.processor.filter "tenant_0"[^}]*ns-dev'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'otelcol.processor.filter "tenant_0"[^}]*ns-prod'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)otelcol.processor.filter "tenant_1".*ns-prod'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'otelcol.processor.filter "tenant_1"[^}]*ns-dev'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)otelcol.processor.attributes "tenant_0".*value = "example".*otelcol.processor.attributes "tenant_1".*value = "example"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)"prometheus_0".*"X-Scope-OrgID" = "example".*"prometheus_1".*"X-Scope-OrgID" = "example"'
  - it: stamps the namespace after the filter in the receiver that sets stampNamespace only
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: true
      tenants:
        - id: example
          namespaces: [ns-dev, ns-prod]
          receivers:
            - { name: dev, port: 4320, path: /example, namespaces: [ns-dev], stampNamespace: ns-dev-x, htpasswdSecret: { name: dev-otlp, key: dev } }
            - { name: prod, port: 4321, ingress: false, namespaces: [ns-prod], htpasswdSecret: { name: prod-otlp, key: prod } }
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.filter "tenant_0".*processor.transform "tenant_0".*?metric_statements \{\s*context = "resource"\s*statements = \["set\(attributes\[\\"k8s.namespace.name\\"\], \\"ns-dev-x\\"\)"\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_0".*?context = "datapoint"\s*statements = \["set\(attributes\[\\"namespace\\"\], \\"ns-dev-x\\"\)"\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_0".*?log_statements \{\s*context = "resource"\s*statements = \["set\(attributes\[\\"k8s.namespace.name\\"\], \\"ns-dev-x\\"\)"\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_0".*?trace_statements \{\s*context = "resource"\s*statements = \["set\(attributes\[\\"k8s.namespace.name\\"\], \\"ns-dev-x\\"\)"\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_0".*?log_statements \{\s*context = "log"\s*statements = \["set\(attributes\[\\"namespace\\"\], \\"ns-dev-x\\"\) where attributes\[\\"namespace\\"\] != nil"\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_0".*?trace_statements \{\s*context = "span"\s*statements = \["set\(attributes\[\\"namespace\\"\], \\"ns-dev-x\\"\) where attributes\[\\"namespace\\"\] != nil"\]'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_1".*ns-dev-x'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '(?s)processor.transform "tenant_1".*set\(attributes\[\\"k8s.namespace.name\\"\]'
  - it: rejects stampNamespace with empty namespaces
    template: templates/applications.yaml
    set:
      tenants:
        - id: example
          namespaces: [ns-dev]
          receivers:
            - { name: dev, port: 4320, namespaces: [], stampNamespace: ns-dev-x, htpasswdSecret: { name: dev-otlp, key: dev } }
    asserts:
      - failedTemplate:
          errorPattern: 'receiver namespaces must be non-empty'
  - it: exposes only ingress enabled receivers
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      gateway.ingress.enabled: true
      gateway.ingress.host: otlp.example.com
      tenants:
        - id: example
          namespaces: [ns-dev, ns-prod]
          receivers:
            - { name: dev, port: 4320, namespaces: [ns-dev] }
            - { name: prod, port: 4321, ingress: false, namespaces: [ns-prod] }
    asserts:
      - equal:
          path: spec.rules[0].http.paths
          value:
            - path: /example/dev
              pathType: Prefix
              backend:
                service:
                  name: alloy-gateway
                  port: { name: tenant-0 }
  - it: emits no gateway resources without tenants
    template: templates/applications.yaml
    set:
      tenants: []
      gateway.ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 15
      - isKind:
          of: Application
      - notEqual:
          path: metadata.name
          value: lgtm-alloy-gateway
  - it: emits no ingress or deployment without tenants
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      tenants: []
      gateway.ingress.enabled: true
    asserts:
      - hasDocuments:
          count: 0
  - it: configures an authenticated receiver and fixed tenant pipeline
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: true
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: example-otlp, key: htpasswd }
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.controller.type
          value: deployment
      - equal:
          path: spec.source.helm.valuesObject.controller.replicas
          value: 2
      - equal:
          path: spec.source.helm.valuesObject.controller.volumes.extra[0].secret.secretName
          value: example-otlp
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'max_request_body_size = "4MiB"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'logs = \[otelcol.exporter.otlphttp.loki_0.input\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'traces = \[otelcol.exporter.otlp.tempo_0.input\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: '"X-Scope-OrgID" = "example"'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'include_metadata|grpc \{|max_recv_msg_size'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'context = "datapoint"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'set\(attributes\[\\"namespace\\"\], resource.attributes\[\\"k8s.namespace.name\\"\]\) where attributes\[\\"namespace\\"\] == nil and resource.attributes\[\\"k8s.namespace.name\\"\] != nil'
  - it: drops telemetry that names a namespace outside the tenant
    template: templates/applications.yaml
    set:
      tenants:
        - id: example
          port: 4320
          namespaces: [ns-a, ns-b]
          htpasswdSecret: { name: example-otlp, key: htpasswd }
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'metrics = \[otelcol.processor.filter.tenant_0.input\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'otelcol.processor.filter "tenant_0"'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'IsMatch\(resource.attributes\[\\"k8s.namespace.name\\"\], \\"\^\(ns-a\|ns-b\)\$\\"\)'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'attributes\[\\"namespace\\"\] != nil and not IsMatch\(attributes\[\\"namespace\\"\]'
  - it: drops logs and traces with isolation disabled
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: false
      tenants: [{ id: example, port: 4320, htpasswdSecret: { name: example-otlp, key: htpasswd } }]
    documentSelector:
      path: metadata.name
      value: lgtm-alloy-gateway
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'metrics = \[otelcol.processor.attributes.tenant_0.input\]'
      - matchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'metrics = \[otelcol.exporter.otlphttp.prometheus_0.input\]'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.alloy.configMap.content
          pattern: 'logs =|traces =|log_statements|trace_statements|"loki_0"|"tempo_0"'
  - it: routes tenant paths to dedicated service ports
    template: templates/gateway.yaml
    set:
      mode: addon
      addon: gateway
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: example-otlp, key: htpasswd }
      gateway.ingress.enabled: true
      gateway.ingress.host: otlp.example.com
    asserts:
      - equal:
          path: spec.rules[0].http.paths[0]
          value:
            path: /example
            pathType: Prefix
            backend:
              service:
                name: alloy-gateway
                port: { name: tenant-0 }
      - equal:
          path: metadata.annotations["alb.ingress.kubernetes.io/success-codes"]
          value: 200-499
  - it: syncs the ingress addon into the destination cluster
    template: templates/applications.yaml
    set:
      tenants:
        - id: example
          port: 4320
          htpasswdSecret: { name: example-otlp, key: htpasswd }
      gateway.ingress.enabled: true
      gateway.ingress.host: otlp.example.com
    documentSelector:
      path: metadata.name
      value: lgtm-gateway
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.addon
          value: gateway
      - equal:
          path: spec.source.helm.valuesObject.tenantIsolation.enabled
          value: false
      - equal:
          path: spec.source.helm.valuesObject.tenants[0].port
          value: 4320
