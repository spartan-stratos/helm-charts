suite: Grafana tenant dashboard delivery
templates:
  - templates/applications.yaml
set:
  mode: applications
  argocd.project: example
  argocd.destination.name: example-cluster
  cluster.name: example-cluster
  grafana.sso.provider: keycloak
  grafana.sso.keycloak: { url: https://sso.example.com, realm: example, clientId: grafana }
  tenants:
    - id: alpha
      port: 4320
      namespaces: [alpha-dev, alpha-prod]
      htpasswdSecret: { name: alpha-otlp, key: htpasswd }
      grafana: { viewers: [tenant-viewer], orgId: 2 }
    - id: beta
      port: 4321
      namespaces: [beta-dev]
      htpasswdSecret: { name: beta-otlp, key: htpasswd }
      grafana: { viewers: [tenant-viewer], orgId: 3 }
tests:
  - it: rejects reserved general when any tenant has an org id
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
        - { id: general, port: 4321, htpasswdSecret: { name: beta-otlp, key: htpasswd }, namespaces: [beta-dev] }
    asserts:
      - failedTemplate:
          errorMessage: tenant dashboard id must not be general or volume
  - it: rejects reserved volume
    set:
      tenants:
        - { id: volume, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenant dashboard id must not be general or volume
  - it: rejects collisions with custom tenant provider names
    set:
      components.grafana.values.dashboardProviders:
        custom.yaml: { apiVersion: 1, providers: [{ name: tenant-alpha }] }
    asserts:
      - failedTemplate:
          errorMessage: tenant dashboard provider names must be unique
  - it: rejects collisions with custom provider names
    set:
      components.grafana.values.dashboardProviders:
        custom.yaml: { apiVersion: 1, providers: [{ name: home-alpha }] }
    asserts:
      - failedTemplate:
          errorMessage: tenant dashboard provider names must be unique
  - it: rejects collisions with the main sidecar provider name
    set:
      components.grafana.values.sidecar.dashboards.provider.name: tenant-alpha
    asserts:
      - failedTemplate:
          errorMessage: tenant dashboard provider names must be unique
  - it: keeps alpha and alpha-home provider names distinct and polling
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
        - { id: alpha-home, port: 4321, htpasswdSecret: { name: beta-otlp, key: htpasswd }, namespaces: [beta-dev], grafana: { viewers: [tenant-viewer], orgId: 3 } }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[0].name
          value: tenant-alpha
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[1].name
          value: home-alpha
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[2].name
          value: tenant-alpha-home
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[3].name
          value: home-alpha-home
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[0].updateIntervalSeconds
          value: 30
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[1].updateIntervalSeconds
          value: 30
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[2].updateIntervalSeconds
          value: 30
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers[3].updateIntervalSeconds
          value: 30
  - it: rejects org ids without any tenant groups
    set:
      tenants: [{ id: alpha, port: 4320, grafana: { orgId: 2 } }]
    asserts:
      - failedTemplate:
          errorMessage: 'tenants[].grafana.orgId requires tenant Grafana viewers or editors groups; dashboards need the organization and folder from the tenant-orgs job'
  - it: renders no tenant delivery or mapping when org mapping is off
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.sidecar.dashboards.searchNamespace
          value: ALL
      - notExists:
          path: spec.source.helm.valuesObject.extraContainers
      - notExists:
          path: spec.source.helm.valuesObject.dashboardProviders
      - notExists:
          path: spec.source.helm.valuesObject.extraObjects
      - notExists:
          path: spec.source.helm.valuesObject.extraVolumes
      - notExists:
          path: spec.source.helm.valuesObject["grafana.ini"]["auth.generic_oauth"].org_mapping
  - it: skips dashboard validations and narrowing without any org ids
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      tenants: [{ id: alpha, port: 4320, namespaces: [ALL], htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
      grafana.tenantDashboards.platformNamespaces: []
      components.grafana.values:
        extraContainers: custom
        extraVolumes: []
        extraVolumeMounts: []
        extraObjects: []
        sidecar: { dashboards: { searchNamespace: custom } }
        dashboardProviders: { tenant-dashboardproviders.yaml: { apiVersion: 1, providers: [] } }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.sidecar.dashboards.searchNamespace
          value: custom
      - equal:
          path: spec.source.helm.valuesObject.extraContainers
          value: custom
  - it: rejects a string org id
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: "2" } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].grafana.orgId must be a positive integer
  - it: rejects a zero org id
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 0 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].grafana.orgId must be a positive integer
  - it: rejects the main org id
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 1 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].grafana.orgId must not be 1
  - it: rejects duplicate org ids
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
        - { id: beta, port: 4321, htpasswdSecret: { name: beta-otlp, key: htpasswd }, namespaces: [beta-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].grafana.orgId must be unique across tenants
  - it: rejects extraVolumes
    set:
      components.grafana.values.extraVolumes: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.extraVolumes
  - it: rejects extraVolumeMounts
    set:
      components.grafana.values.extraVolumeMounts: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.extraVolumeMounts
  - it: rejects extraObjects
    set:
      components.grafana.values.extraObjects: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.extraObjects
  - it: rejects sidecar.dashboards.searchNamespace
    set:
      components.grafana.values.sidecar.dashboards.searchNamespace: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.sidecar.dashboards.searchNamespace
  - it: rejects the generated tenant dashboard provider override
    set:
      components.grafana.values.dashboardProviders:
        tenant-dashboardproviders.yaml: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.dashboardProviders.tenant-dashboardproviders.yaml
  - it: preserves a different dashboard provider key
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      components.grafana.values.dashboardProviders:
        custom.yaml: { apiVersion: 1, providers: [] }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["custom.yaml"]
          value: { apiVersion: 1, providers: [] }
  - it: rejects tenant namespace ALL
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [ALL], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must not contain ALL
  - it: rejects platform namespace ALL
    set:
      grafana.tenantDashboards.platformNamespaces: [ALL]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must not contain ALL
  - it: rejects tenant namespace aLl
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [aLl], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must not contain ALL
  - it: rejects platform namespace aLl
    set:
      grafana.tenantDashboards.platformNamespaces: [aLl]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must not contain ALL
  - it: rejects tenant namespace bad_name
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [bad_name], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must contain DNS-1123 labels
  - it: rejects platform namespace bad_name
    set:
      grafana.tenantDashboards.platformNamespaces: [bad_name]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must contain DNS-1123 labels
  - it: rejects tenant namespace Bad
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [Bad], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must contain DNS-1123 labels
  - it: rejects platform namespace Bad
    set:
      grafana.tenantDashboards.platformNamespaces: [Bad]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must contain DNS-1123 labels
  - it: rejects tenant namespace -bad
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [-bad], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must contain DNS-1123 labels
  - it: rejects platform namespace -bad
    set:
      grafana.tenantDashboards.platformNamespaces: [-bad]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must contain DNS-1123 labels
  - it: rejects tenant namespace bad-
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [bad-], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must contain DNS-1123 labels
  - it: rejects platform namespace bad-
    set:
      grafana.tenantDashboards.platformNamespaces: [bad-]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must contain DNS-1123 labels
  - it: rejects tenant namespace aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa], grafana: { viewers: [tenant-viewer], orgId: 2 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must contain DNS-1123 labels
  - it: rejects platform namespace aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    set:
      grafana.tenantDashboards.platformNamespaces: [aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa]
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must contain DNS-1123 labels
  - it: rejects shared tenant namespaces
    set:
      tenants:
        - { id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 2 } }
        - { id: beta, port: 4321, htpasswdSecret: { name: beta-otlp, key: htpasswd }, namespaces: [alpha-dev], grafana: { viewers: [tenant-viewer], orgId: 3 } }
    asserts:
      - failedTemplate:
          errorMessage: tenants[].namespaces must be unique across tenants
  - it: assigns distinct health ports outside upstream ports for two tenants
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: '(?s)name: HEALTH_PORT\n\s+value: "8085".*name: grafana-sc-dashboard-alpha.*name: HEALTH_PORT\n\s+value: "8086".*name: grafana-sc-dashboard-beta'
  - it: preserves the main sidecar and omits tenant delivery without org ids
    set:
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.sidecar.dashboards.searchNamespace
          value: ALL
      - notExists:
          path: spec.source.helm.valuesObject.extraContainers
      - notExists:
          path: spec.source.helm.valuesObject.dashboardProviders
      - notExists:
          path: spec.source.helm.valuesObject.extraObjects
      - notExists:
          path: spec.source.helm.valuesObject.extraVolumes
  - it: limits the main sidecar to platform namespaces
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      grafana.tenantDashboards.platformNamespaces: [monitoring, platform]
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.sidecar.dashboards.searchNamespace
          value: [monitoring, platform]
  - it: rejects a tenant namespace in platform namespaces
    set:
      grafana.tenantDashboards.platformNamespaces: [monitoring, beta-dev]
    asserts:
      - failedTemplate:
          errorMessage: tenant namespace must not be in grafana.tenantDashboards.platformNamespaces
  - it: rejects empty platform namespaces
    set:
      grafana.tenantDashboards.platformNamespaces: []
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards.platformNamespaces must not be empty
  - it: rejects an org id on a tenant without namespaces
    set:
      tenants:
        - id: gamma
          port: 4322
          htpasswdSecret: { name: gamma-otlp, key: htpasswd }
          grafana: { viewers: [tenant-viewer], orgId: 4 }
    asserts:
      - failedTemplate:
          errorMessage: "tenants[].namespaces must be set when tenants[].grafana.orgId is set; an empty sidecar NAMESPACE watches the Grafana namespace"
  - it: never gives tenant sidecars request credentials or the configured admin secret
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      components.grafana.values.admin: { existingSecret: custom-admin, userKey: u, passwordKey: p }
    asserts:
      - notMatchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'REQ_USERNAME|REQ_PASSWORD|REQ_URL|REQ_METHOD|custom-admin|grafana-admin|secretKeyRef'
  - it: uses unique filenames on every tenant sidecar
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: '(?s)name: UNIQUE_FILENAMES\n\s+value: "true".*name: grafana-sc-dashboard-alpha.*name: UNIQUE_FILENAMES\n\s+value: "true".*name: grafana-sc-dashboard-beta'
  - it: rejects user extraContainers even when set to an empty string
    set:
      components.grafana.values.extraContainers: ""
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantDashboards cannot be combined with components.grafana.values.extraContainers
  - it: renders per-tenant sidecars with joined namespaces and no reload credentials
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: NAMESPACE\n\s+value: alpha-dev,alpha-prod'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: NAMESPACE\n\s+value: beta-dev'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: RESOURCE\n\s+value: configmap'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: METHOD\n\s+value: WATCH'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: FOLDER\n\s+value: /var/lib/grafana-tenant-dashboards/alpha'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: grafana-sc-dashboard-alpha'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'image: quay.io/kiwigrid/k8s-sidecar:2.11.2'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'REQ_|grafana-admin|secretKeyRef'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'allowPrivilegeEscalation: false'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'readOnlyRootFilesystem: true'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'type: RuntimeDefault'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'drop:\n\s+- ALL'
      - matchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'name: tenant-dash-alpha\n\s+readOnly: false'
      - notMatchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: 'FOLDER_ANNOTATION|/tmp/dashboards|\{\{'
  - it: renders both providers and separate read-only mounts for each tenant
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"]
          value:
            apiVersion: 1
            providers:
              - name: tenant-alpha
                updateIntervalSeconds: 30
                orgId: 2
                folder: alpha
                folderUid: alpha
                type: file
                allowUiUpdates: false
                disableDeletion: false
                options: { path: /var/lib/grafana-tenant-dashboards/alpha, foldersFromFilesStructure: false }
              - name: home-alpha
                updateIntervalSeconds: 30
                orgId: 2
                folder: alpha
                folderUid: alpha
                type: file
                allowUiUpdates: false
                disableDeletion: true
                options: { path: /etc/grafana/tenant-home/alpha, foldersFromFilesStructure: false }
              - name: tenant-beta
                updateIntervalSeconds: 30
                orgId: 3
                folder: beta
                folderUid: beta
                type: file
                allowUiUpdates: false
                disableDeletion: false
                options: { path: /var/lib/grafana-tenant-dashboards/beta, foldersFromFilesStructure: false }
              - name: home-beta
                updateIntervalSeconds: 30
                orgId: 3
                folder: beta
                folderUid: beta
                type: file
                allowUiUpdates: false
                disableDeletion: true
                options: { path: /etc/grafana/tenant-home/beta, foldersFromFilesStructure: false }
      - equal:
          path: spec.source.helm.valuesObject.extraVolumeMounts[0]
          value: { name: tenant-dash-alpha, mountPath: /var/lib/grafana-tenant-dashboards/alpha, readOnly: true }
      - equal:
          path: spec.source.helm.valuesObject.extraVolumeMounts[1]
          value: { name: tenant-home-alpha, mountPath: /etc/grafana/tenant-home/alpha, readOnly: true }
      - equal:
          path: spec.source.helm.valuesObject.extraVolumes[0]
          value: { name: tenant-dash-alpha, emptyDir: {} }
      - equal:
          path: spec.source.helm.valuesObject.extraVolumes[1]
          value: { name: tenant-home-alpha, configMap: { name: grafana-tenant-home-alpha } }
  - it: delivers unlabelled sentinels in the Grafana namespace
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    asserts:
      - lengthEqual:
          path: spec.source.helm.valuesObject.extraObjects
          count: 2
      - equal:
          path: spec.source.helm.valuesObject.extraObjects[0].metadata
          value: { name: grafana-tenant-home-alpha, namespace: monitoring }
      - equal:
          path: spec.source.helm.valuesObject.extraObjects[1].metadata
          value: { name: grafana-tenant-home-beta, namespace: monitoring }
      - notExists:
          path: spec.source.helm.valuesObject.extraObjects[0].metadata.labels.grafana_dashboard
      - matchRegex:
          path: spec.source.helm.valuesObject.extraObjects[0].data["alpha-home.json"]
          pattern: '"uid":"alpha-home"'
  - it: omits sidecar providers sentinel and volumes until the org id is set
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      tenants:
        - id: alpha
          port: 4320
          namespaces: [alpha-dev]
          htpasswdSecret: { name: alpha-otlp, key: htpasswd }
          grafana: { viewers: [alpha-viewer] }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject["grafana.ini"]["auth.generic_oauth"].org_mapping
          value: alpha-viewer:alpha:Viewer
      - notExists:
          path: spec.source.helm.valuesObject.extraContainers
      - notExists:
          path: spec.source.helm.valuesObject.dashboardProviders
      - notExists:
          path: spec.source.helm.valuesObject.extraObjects
      - notExists:
          path: spec.source.helm.valuesObject.extraVolumes
  - it: skips only the unconfigured tenant in a mixed installation
    documentSelector: { path: metadata.name, value: lgtm-grafana }
    set:
      tenants:
        - id: alpha
          port: 4320
          namespaces: [alpha-dev]
          htpasswdSecret: { name: alpha-otlp, key: htpasswd }
          grafana: { viewers: [tenant-viewer], orgId: 2 }
        - id: beta
          port: 4321
          namespaces: [beta-dev]
          htpasswdSecret: { name: beta-otlp, key: htpasswd }
          grafana: {}
    asserts:
      - lengthEqual:
          path: spec.source.helm.valuesObject.extraObjects
          count: 1
      - lengthEqual:
          path: spec.source.helm.valuesObject.dashboardProviders["tenant-dashboardproviders.yaml"].providers
          count: 2
      - lengthEqual:
          path: spec.source.helm.valuesObject.extraVolumes
          count: 2
      - notMatchRegex:
          path: spec.source.helm.valuesObject.extraContainers
          pattern: beta
