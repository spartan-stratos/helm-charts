suite: Tenant organization provisioning
templates:
  - templates/tenant-orgs.yaml
  - templates/applications.yaml
set:
  mode: addon
  addon: tenantOrgs
tests:
  - it: provisions no folders by default
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: /api/folders
      - matchRegex:
          path: data["provision.sh"]
          pattern: "printf 'tenant org %s id %s"
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'admin_login|admin_member|verify_permissions|sleep 10'
  - it: adds the admin to each org before invoking org-header datasource requests
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }, { id: beta }]
      tenantIsolation.enabled: true
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: '(?s)api/orgs/name/alpha.*?case "\$org_id".*?request GET -X GET "\$base/api/orgs/\$org_id/users".*?"role\\":\\"Admin\\".*?api/orgs/\$org_id/users"\nfi\ndatasource loki.*?api/orgs/name/beta.*?request GET -X GET "\$base/api/orgs/\$org_id/users".*?api/orgs/\$org_id/users"\nfi\ndatasource loki'
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'if \[ -z "\$admin_member" \]; then\n  request POST'
  - it: creates each tenant parent with the full two-entry permissions list
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }, { id: beta }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'if \[ "\$code" = 404 \]; then\n  request POST[^\n]*\n    .*\{"uid":"alpha","title":"alpha"\}'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '\{"uid":"beta","title":"beta"\}'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '\{"items":\[\{"role":"Admin","permission":4\},\{"role":"Viewer","permission":2\}\]\}.*\n  "\$base/api/folders/alpha/permissions"'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '\{"items":\[\{"role":"Admin","permission":4\},\{"role":"Viewer","permission":2\}\]\}.*\n  "\$base/api/folders/beta/permissions"'
  - it: strips other root folders and keeps the tenant parent
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'request GET -X GET -H "X-Grafana-Org-Id: \$org_id" "\$base/api/folders"'
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'for folder_uid in \$folder_uids; do\n  \[ "\$folder_uid" = .alpha. \] && continue\n  request POST[^\n]*\n    .*\{"items":\[\{"role":"Admin","permission":4\}\]\}.*\n    "\$base/api/folders/\$folder_uid/permissions"'
  - it: fails on an orgId mismatch before writing folders
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha, grafana: { orgId: 2 } }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'if \[ "\$org_id" != .2. \]; then\n  printf.*orgId mismatch.*\n  exit 1\nfi\nrequest GET.*api/folders/alpha'
  - it: waits for health before the first write
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: '(?s)until curl[^;]*api/health"; do.*\[ "\$attempts" -lt 60 \] \|\| exit 1.*done.*request POST'
  - it: uses only the mapping delay even when the folder delay is larger
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping: { enabled: true, settleSeconds: 45 }
      grafana.tenantFolders: { enabled: true, settleSeconds: 75 }
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 45\n$'
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 75|sleep 60|(?s)sleep 45.*sleep 45'
  - it: settles once with the larger mapping delay
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping: { enabled: true, settleSeconds: 90 }
      grafana.tenantFolders: { enabled: true, settleSeconds: 30 }
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 90\n$'
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 30|(?s)sleep 90.*sleep 90'
  - it: fails addon rendering without org mapping
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.tenantFolders.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: grafana.tenantFolders requires grafana.orgMapping.enabled
  - it: retries permission reads twelve times ten seconds apart and fails with the last response
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders.enabled: true
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'permission_attempt=1\n  while \[ "\$permission_attempt" -le 12 \]; do\n    request GET_PERMISSIONS -X GET.*api/folders/\$1/permissions'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '\[ "\$method" = GET_PERMISSIONS \] \|\| exit 1'
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'if \[ "\$code" = 200 \] && \[ "\$viewer_permission" = "\$2" \] && \[ -z "\$editor_entry" \]; then\n      return 0'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '\[ "\$permission_attempt" -lt 12 \] \|\| break\n    sleep 10\n    permission_attempt=\$\(\(permission_attempt \+ 1\)\)'
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'printf.*permission verification failed after 12 attempts: %s.*"\$1" "\$body" >&2\n  exit 1'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"\$base/api/folders/alpha/permissions"\nverify_permissions .alpha. 2'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"\$base/api/folders/\$folder_uid/permissions"\n  verify_permissions "\$folder_uid" ..'
  - it: passes enabled tenant folders to the organization addon
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
      grafana.orgMapping.enabled: true
      grafana.tenantFolders: { enabled: true, settleSeconds: 75 }
      grafana.sso.provider: keycloak
      grafana.sso.keycloak: { url: https://sso.example.com, realm: example, clientId: grafana }
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.grafana.tenantFolders
          value: { enabled: true, settleSeconds: 75 }
  - it: omits disabled tenant folders from the organization addon
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - notExists:
          path: spec.source.helm.valuesObject.grafana.tenantFolders
  - it: adds no settle step by default
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 120|missing after provisioning'
  - it: verifies every tenant before settling enabled mapping
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }, { id: beta }]
      grafana.orgMapping: { enabled: true, settleSeconds: 45 }
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'request GET -X GET "\$base/api/orgs/name/alpha"\nif \[ "\$code" = 404 \]; then\n  printf.*tenant org alpha missing after provisioning.*>&2\n  exit 1'
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'request GET -X GET "\$base/api/orgs/name/beta"\nif \[ "\$code" = 404 \]; then\n  printf.*tenant org beta missing after provisioning.*>&2\n  exit 1\nfi\nsleep 45'
  - it: permits a zero settle delay
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping: { enabled: true, settleSeconds: 0 }
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 0'
  - it: defaults an unset settle delay
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping: { enabled: true, settleSeconds: null }
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'sleep 120'
  - it: rejects a negative settle delay
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: alpha }]
      grafana.orgMapping: { enabled: true, settleSeconds: -1 }
    asserts:
      - failedTemplate:
          errorMessage: grafana.orgMapping.settleSeconds must be a non-negative integer
  - it: passes enabled mapping alongside the domain to the organization addon
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
      grafana.domain: grafana.example.com
      grafana.orgMapping: { enabled: true, settleSeconds: 45 }
      grafana.sso.provider: keycloak
      grafana.sso.keycloak: { url: https://sso.example.com, realm: example, clientId: grafana }
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.grafana
          value: { domain: grafana.example.com, orgMapping: { enabled: true, settleSeconds: 45 } }
  - it: omits disabled mapping from the organization addon
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: alpha, port: 4320, htpasswdSecret: { name: alpha-otlp, key: htpasswd } }]
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - notExists:
          path: spec.source.helm.valuesObject.grafana.orgMapping
  - it: provisions one organization and tenant datasources for multiple receivers
    template: templates/tenant-orgs.yaml
    set:
      tenantIsolation.enabled: true
      tenants:
        - id: example
          namespaces: [example-dev, example-prod]
          receivers:
            - { name: dev, port: 4320, namespaces: [example-dev] }
            - { name: prod, port: 4321, namespaces: [example-prod] }
    documentIndex: 0
    asserts:
      - hasDocuments:
          count: 2
      - matchRegex:
          path: data["provision.sh"]
          pattern: /api/orgs/name/example
      - matchRegex:
          path: data["provision.sh"]
          pattern: http://prom-label-proxy-example.monitoring.svc.cluster.local:8080
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"httpHeaderValue1":"example"'
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'example-dev|example-prod|4320|4321'
  - it: uses overridden admin Secret references
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: example }]
      grafanaAdmin: { secret: custom-admin, userKey: username, passwordKey: password }
    documentIndex: 1
    asserts:
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: GF_USER
              valueFrom:
                secretKeyRef: { name: custom-admin, key: username }
            - name: GF_PASSWORD
              valueFrom:
                secretKeyRef: { name: custom-admin, key: password }
  - it: passes merged admin overrides to the organization addon
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: example, port: 4320, htpasswdSecret: { name: example-otlp, key: htpasswd } }]
      components.grafana.values.admin: { existingSecret: custom-admin, userKey: username, passwordKey: password }
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.grafanaAdmin
          value: { secret: custom-admin, userKey: username, passwordKey: password }
  - it: retains preset admin keys with a partial override
    template: templates/applications.yaml
    set:
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      tenants: [{ id: example, port: 4320, htpasswdSecret: { name: example-otlp, key: htpasswd } }]
      components.grafana.values.admin.existingSecret: custom-admin
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.grafanaAdmin
          value: { secret: custom-admin, userKey: admin-user, passwordKey: admin-password }
  - it: provisions logs and traces without metrics when the proxy is disabled
    template: templates/tenant-orgs.yaml
    set:
      components.promLabelProxy.enabled: false
      tenantIsolation.enabled: true
      tenants: [{ id: example }]
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'datasource prometheus '
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'datasource loki '
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'datasource tempo '
  - it: provisions no datasources with isolation and proxy disabled
    template: templates/tenant-orgs.yaml
    set:
      components.promLabelProxy.enabled: false
      tenantIsolation.enabled: false
      tenants: [{ id: example }]
    documentIndex: 0
    asserts:
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'datasource prometheus |datasource loki |datasource tempo '
      - matchRegex:
          path: data["provision.sh"]
          pattern: /api/orgs/name/example
  - it: renders nothing without tenants
    template: templates/tenant-orgs.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: provisions tenants without requiring namespaces
    template: templates/tenant-orgs.yaml
    set:
      tenantIsolation.enabled: true
      components.promLabelProxy.enabled: true
      tenants: [{ id: example }]
    documentIndex: 0
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["provision.sh"]
          pattern: /api/orgs/name/example
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"uid":"loki"'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"uid":"tempo"'
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"uid":"prometheus"'
      - matchRegex:
          path: data["provision.sh"]
          pattern: http://prom-label-proxy-example.monitoring.svc.cluster.local:8080
      - matchRegex:
          path: data["provision.sh"]
          pattern: '"httpHeaderValue1":"example"'
  - it: provisions only metrics with isolation disabled
    template: templates/tenant-orgs.yaml
    set:
      tenantIsolation.enabled: false
      components.promLabelProxy.enabled: true
      tenants: [{ id: example }]
    documentIndex: 0
    asserts:
      - matchRegex:
          path: data["provision.sh"]
          pattern: 'datasource prometheus '
      - notMatchRegex:
          path: data["provision.sh"]
          pattern: 'datasource loki |datasource tempo '
  - it: rejects a trailing hyphen in addon tenant ids
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: example- }]
    asserts:
      - failedTemplate:
          errorMessage: tenant id must be a DNS-1123 label of at most 30 characters
  - it: rejects a 31 character addon tenant id
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa }]
    asserts:
      - failedTemplate:
          errorMessage: tenant id must be a DNS-1123 label of at most 30 characters
  - it: runs after sync with admin credentials and placement
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: example }]
      placement.nodeSelector: { workload: monitoring }
      placement.tolerations: [{ key: workload, operator: Exists }]
    documentIndex: 1
    asserts:
      - isKind:
          of: Job
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook"]
          value: PostSync
      - equal:
          path: metadata.annotations["argocd.argoproj.io/hook-delete-policy"]
          value: BeforeHookCreation
      - equal:
          path: spec.backoffLimit
          value: 3
      - equal:
          path: spec.template.spec.containers[0].image
          value: docker.io/curlimages/curl:8.11.1
      - equal:
          path: spec.template.spec.containers[0].env
          value:
            - name: GF_USER
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-user }
            - name: GF_PASSWORD
              valueFrom:
                secretKeyRef: { name: grafana-admin, key: admin-password }
      - equal:
          path: spec.template.spec.nodeSelector
          value: { workload: monitoring }
      - equal:
          path: spec.template.spec.tolerations
          value: [{ key: workload, operator: Exists }]
  - it: renders nothing when Grafana is disabled
    template: templates/tenant-orgs.yaml
    set:
      tenants: [{ id: example }]
      components.grafana.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: wires tenant organizations without namespaces
    template: templates/applications.yaml
    set:
      tenantIsolation.enabled: true
      mode: applications
      argocd.project: example
      argocd.destination.name: example-cluster
      cluster.name: example-cluster
      components.alloyGateway.enabled: false
      components.promLabelProxy.enabled: false
      tenants: [{ id: example, port: 4320 }]
      placement.nodeSelector: { workload: monitoring }
    documentSelector:
      path: metadata.name
      value: lgtm-grafana-tenant-orgs
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.grafanaAdmin
          value: { secret: grafana-admin, userKey: admin-user, passwordKey: admin-password }
      - equal:
          path: spec.source.helm.valuesObject.addon
          value: tenantOrgs
      - equal:
          path: spec.source.helm.valuesObject.components.promLabelProxy.enabled
          value: false
      - equal:
          path: spec.source.helm.valuesObject.tenantIsolation.enabled
          value: true
      - equal:
          path: spec.source.helm.valuesObject.tenants
          value: [{ id: example, port: 4320 }]
      - equal:
          path: spec.source.helm.valuesObject.placement.nodeSelector
          value: { workload: monitoring }
