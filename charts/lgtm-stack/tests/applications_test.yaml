suite: "Applications"

templates:
  - "templates/applications.yaml"
  - "templates/addon.yaml"

set:
  argocd.project: example
  argocd.destination.name: example-cluster
  cluster.name: example-cluster

tests:
  - it: stamps all namespace scrape lists for a tenant with two namespaces
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    set:
      tenants: [{ id: example, namespaces: [example-dev, example-prod], port: 4320, htpasswdSecret: { name: example-auth, key: htpasswd } }]
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.kube-state-metrics.prometheus.monitor.metricRelabelings[0]
          value: { action: replace, sourceLabels: [namespace], regex: '^(example-dev|example-prod)$', targetLabel: tenant, replacement: example }
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings[0]
          value: { action: replace, sourceLabels: [namespace], regex: '^(example-dev|example-prod)$', targetLabel: tenant, replacement: example }
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings[0]
          value: { action: replace, sourceLabels: [namespace], regex: '^(example-dev|example-prod)$', targetLabel: tenant, replacement: example }
      - lengthEqual:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings
          count: 9
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings[1]
          value: { sourceLabels: [__name__], action: drop, regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)' }
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings[8]
          value: { sourceLabels: [id, pod], action: drop, regex: '.+;' }
      - lengthEqual:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings
          count: 2
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings[1]
          value: { action: drop, sourceLabels: [__name__, le], regex: '(csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?' }
  - it: prepends tenant rules while preserving consumer cAdvisor rules
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    set:
      tenants: [{ id: example, namespaces: [example], port: 4320, htpasswdSecret: { name: example-auth, key: htpasswd } }]
      components.kubePrometheusStack.values.kubelet.serviceMonitor.cAdvisorMetricRelabelings:
        - { action: labeldrop, regex: noisy }
        - { action: keep, sourceLabels: [__name__], regex: 'container_.*' }
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings
          value:
            - { action: replace, sourceLabels: [namespace], regex: '^(example)$', targetLabel: tenant, replacement: example }
            - { action: labeldrop, regex: noisy }
            - { action: keep, sourceLabels: [__name__], regex: 'container_.*' }
  - it: keeps tenant rules in configured order across all scrape lists
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    set:
      tenants:
        - { id: zulu, namespaces: [zulu-dev], port: 4320, htpasswdSecret: { name: zulu-auth, key: htpasswd } }
        - { id: alpha, namespaces: [alpha-dev], port: 4321, htpasswdSecret: { name: alpha-auth, key: htpasswd } }
      components.kubePrometheusStack.values.kubelet.serviceMonitor.metricRelabelings: []
      components.kubePrometheusStack.values.kubelet.serviceMonitor.cAdvisorMetricRelabelings: []
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.kube-state-metrics.prometheus.monitor.metricRelabelings
          value:
            - { action: replace, sourceLabels: [namespace], regex: '^(zulu-dev)$', targetLabel: tenant, replacement: zulu }
            - { action: replace, sourceLabels: [namespace], regex: '^(alpha-dev)$', targetLabel: tenant, replacement: alpha }
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings
          value:
            - { action: replace, sourceLabels: [namespace], regex: '^(zulu-dev)$', targetLabel: tenant, replacement: zulu }
            - { action: replace, sourceLabels: [namespace], regex: '^(alpha-dev)$', targetLabel: tenant, replacement: alpha }
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings
          value:
            - { action: replace, sourceLabels: [namespace], regex: '^(zulu-dev)$', targetLabel: tenant, replacement: zulu }
            - { action: replace, sourceLabels: [namespace], regex: '^(alpha-dev)$', targetLabel: tenant, replacement: alpha }
  - it: keeps upstream kubelet defaults and no KSM relabel key with no tenants
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    set:
      tenants: []
    asserts:
      - notExists:
          path: spec.source.helm.valuesObject.kube-state-metrics.prometheus.monitor.metricRelabelings
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings
          value: &kubeletMetricDefaults
            - action: drop
              sourceLabels: [__name__, le]
              regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings
          value: &kubeletCadvisorDefaults
            - sourceLabels: [__name__]
              action: drop
              regex: container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)
            - sourceLabels: [__name__]
              action: drop
              regex: container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)
            - sourceLabels: [__name__]
              action: drop
              regex: container_memory_(mapped_file|swap)
            - sourceLabels: [__name__]
              action: drop
              regex: container_(file_descriptors|tasks_state|threads_max)
            - sourceLabels: [__name__, scope]
              action: drop
              regex: container_memory_failures_total;hierarchy
            - sourceLabels: [__name__, interface]
              action: drop
              regex: container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*
            - sourceLabels: [__name__]
              action: drop
              regex: container_spec.*
            - sourceLabels: [id, pod]
              action: drop
              regex: .+;
  - it: keeps upstream kubelet defaults and no KSM relabel key with tenants without namespaces
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    set:
      tenants: [{ id: example, port: 4320, htpasswdSecret: { name: example-auth, key: htpasswd } }]
    asserts:
      - notExists:
          path: spec.source.helm.valuesObject.kube-state-metrics.prometheus.monitor.metricRelabelings
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.metricRelabelings
          value: *kubeletMetricDefaults
      - equal:
          path: spec.source.helm.valuesObject.kubelet.serviceMonitor.cAdvisorMetricRelabelings
          value: *kubeletCadvisorDefaults
  - it: rejects an empty receivers tenant
    template: templates/applications.yaml
    set:
      tenants: [{ id: example, namespaces: [example], receivers: [] }]
    asserts:
      - failedTemplate:
          errorMessage: a receivers tenant needs at least one receiver
  - it: rejects receiver paths without a leading slash
    template: templates/applications.yaml
    set:
      tenants:
        - id: example
          namespaces: [example]
          receivers: [{ name: dev, port: 4320, path: example/dev, namespaces: [example] }]
    asserts:
      - failedTemplate:
          errorMessage: receiver path must start with /
  - it: "keeps only the sync-wave annotation by default"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-opentelemetry-operator
    asserts:
      - equal:
          path: metadata.annotations
          value:
            argocd.argoproj.io/sync-wave: "61"

  - it: "adds annotations only to the selected component Application"
    template: templates/applications.yaml
    set:
      components.opentelemetryOperator.annotations:
        argocd.argoproj.io/compare-options: ServerSideDiff=false
    asserts:
      - equal:
          path: metadata.annotations["argocd.argoproj.io/compare-options"]
          value: ServerSideDiff=false
        documentSelector:
          path: metadata.name
          value: lgtm-opentelemetry-operator
      - notExists:
          path: metadata.annotations["argocd.argoproj.io/compare-options"]
        documentSelector:
          path: metadata.name
          value: lgtm-grafana

  - it: "renders one Application per component and addon"
    template: templates/applications.yaml
    asserts:
      - hasDocuments:
          count: 15
      - isKind:
          of: Application

  - it: "fails without argocd.project"
    template: templates/applications.yaml
    set:
      argocd.project: ""
    asserts:
      - failedTemplate:
          errorMessage: "argocd.project is required"

  - it: "fails without a destination"
    template: templates/applications.yaml
    set:
      argocd.destination.name: ""
    asserts:
      - failedTemplate:
          errorMessage: "argocd.destination.name or argocd.destination.server is required"

  - it: "selects Slack as the global AlertmanagerConfig and restricts tenant configs by namespace"
    template: templates/applications.yaml
    set:
      alerting.slack.enabled: true
    asserts:
      - hasDocuments:
          count: 16
      - equal:
          path: metadata.name
          value: lgtm-alertmanager-config
        documentSelector:
          path: metadata.name
          value: lgtm-alertmanager-config
      - equal:
          path: spec.source.helm.valuesObject.alertmanager.alertmanagerSpec.alertmanagerConfigMatcherStrategy.type
          value: OnNamespace
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack
      - equal:
          path: spec.source.helm.valuesObject.alertmanager.alertmanagerSpec.alertmanagerConfiguration.name
          value: slack
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack

  - it: "drops a disabled component"
    template: templates/applications.yaml
    set:
      components.tempo.enabled: false
    asserts:
      - hasDocuments:
          count: 14

  - it: "sets the cluster label and points addons at this chart version"
    template: templates/applications.yaml
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.prometheus.prometheusSpec.externalLabels.cluster
          value: example-cluster
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack
      - equal:
          path: spec.source.chart
          value: lgtm-stack
        documentSelector:
          path: metadata.name
          value: lgtm-cluster-info
      - equal:
          path: spec.source.targetRevision
          value: 0.19.1
        documentSelector:
          path: metadata.name
          value: lgtm-cluster-info

  - it: "applies placement to every pod path of kube-prometheus-stack and routes Alloy across nodes"
    template: templates/applications.yaml
    set:
      placement:
        nodeSelector: { workload: lgtm }
        tolerations: [{ key: workload, operator: Equal, value: lgtm, effect: NoSchedule }]
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.prometheusOperator.admissionWebhooks.patch.nodeSelector.workload
          value: lgtm
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack
      # node-exporter reads its own node, so like Alloy: tolerations yes, nodeSelector no
      - equal:
          path: spec.source.helm.valuesObject.prometheus-node-exporter.tolerations[0].value
          value: lgtm
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack
      - notExists:
          path: spec.source.helm.valuesObject.prometheus-node-exporter.nodeSelector
        documentSelector:
          path: metadata.name
          value: lgtm-kube-prometheus-stack
      - equal:
          path: spec.source.helm.valuesObject.singleBinary.nodeSelector.workload
          value: lgtm
        documentSelector:
          path: metadata.name
          value: lgtm-loki
      - equal:
          path: spec.source.helm.valuesObject.service.internalTrafficPolicy
          value: Cluster
        documentSelector:
          path: metadata.name
          value: lgtm-alloy
      # Alloy runs on every node: tolerations yes, nodeSelector no
      - equal:
          path: spec.source.helm.valuesObject.controller.tolerations[0].value
          value: lgtm
        documentSelector:
          path: metadata.name
          value: lgtm-alloy
      - notExists:
          path: spec.source.helm.valuesObject.controller.nodeSelector
        documentSelector:
          path: metadata.name
          value: lgtm-alloy

  - it: "opts Prometheus and Alertmanager out of Reloader's auto-reload"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-kube-prometheus-stack
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.prometheus.annotations["reloader.stakater.com/auto"]
          value: "false"
      - equal:
          path: spec.source.helm.valuesObject.alertmanager.annotations["reloader.stakater.com/auto"]
          value: "false"

  - it: "drops a rule bundle that is turned off"
    template: templates/applications.yaml
    set:
      alerting.rules.workloads.enabled: false
    asserts:
      - hasDocuments:
          count: 14
      - notEqual:
          path: metadata.name
          value: lgtm-workload-rules

  - it: "adds the project folder as its own Application"
    template: templates/applications.yaml
    set:
      project:
        enabled: true
        repoURL: https://github.com/example/argocd-observability.git
        path: observability
    documentSelector:
      path: metadata.name
      value: lgtm-project
    asserts:
      - equal:
          path: spec.source
          value:
            repoURL: https://github.com/example/argocd-observability.git
            targetRevision: HEAD
            path: observability
      - equal:
          path: spec.destination.namespace
          value: monitoring

  - it: "loads dashboards from every namespace, datasources only from monitoring"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-grafana
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.sidecar.dashboards.searchNamespace
          value: ALL
      - notExists:
          path: spec.source.helm.valuesObject.sidecar.datasources.searchNamespace

  - it: "keeps health checks and OPTIONS out of span metrics"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-tempo
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.filter_policies[0].exclude.attributes[0].key
          value: span.url.path
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.filter_policies[1].exclude.attributes[0]
          value: { key: span.http.request.method, value: OPTIONS }

  - it: "labels span metrics for tenant rulers"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-tempo
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.tempo.metricsGenerator.registry.inject_tenant_id_as
          value: tenant
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.dimension_mappings
          value: [{ name: namespace, source_labels: [k8s.namespace.name] }]
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.dimensions
          value: [http.response.status_code, http.request.method, http.route]

  - it: "merges consumer Tempo values with span metric label defaults"
    template: templates/applications.yaml
    set:
      components.tempo.values.tempo:
        metricsGenerator:
          remoteWriteUrl: http://custom-prometheus:9090/api/v1/write
        overrides:
          defaults:
            metrics_generator:
              processor:
                span_metrics:
                  dimensions: [http.route]
    documentSelector:
      path: metadata.name
      value: lgtm-tempo
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.tempo.metricsGenerator.remoteWriteUrl
          value: http://custom-prometheus:9090/api/v1/write
      - equal:
          path: spec.source.helm.valuesObject.tempo.metricsGenerator.registry.inject_tenant_id_as
          value: tenant
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.dimension_mappings
          value: [{ name: namespace, source_labels: [k8s.namespace.name] }]
      - equal:
          path: spec.source.helm.valuesObject.tempo.overrides.defaults.metrics_generator.processor.span_metrics.dimensions
          value: [http.route]

  - it: "requires a path for the project folder"
    template: templates/applications.yaml
    set:
      project: { enabled: true, repoURL: https://github.com/example/argocd-observability.git }
    asserts:
      - failedTemplate:
          errorMessage: project.path is required

  - it: "lets component values override presets with false and empty strings"
    template: templates/applications.yaml
    set:
      grafana.sso.provider: keycloak
      grafana.sso.keycloak: { url: https://auth.example.com, realm: main, clientId: grafana, admin: [sre], member: [] }
      components.grafana.values:
        admin: { existingSecret: "" }
        grafana.ini: { auth: { disable_login_form: false } }
    documentSelector:
      path: metadata.name
      value: lgtm-grafana
    asserts:
      - equal:
          path: spec.source.helm.valuesObject.admin.existingSecret
          value: ""
      - equal:
          path: spec.source.helm.valuesObject["grafana.ini"].auth.disable_login_form
          value: false
      - equal:
          path: spec.source.helm.valuesObject["grafana.ini"]["auth.generic_oauth"].enabled
          value: true
      - equal:
          path: spec.source.helm.valuesObject.sso.keycloak.realm
          value: main
      - contains:
          path: spec.syncPolicy.syncOptions
          content: RespectIgnoreDifferences=true

  - it: "keeps the OTel webhook cert out of Helm hooks"
    template: templates/applications.yaml
    documentSelector:
      path: metadata.name
      value: lgtm-opentelemetry-operator
    asserts:
      # As a string, so the nulls reach Helm (valuesObject drops them)
      - notExists:
          path: spec.source.helm.valuesObject
      - matchRegex:
          path: spec.source.helm.values
          pattern: "secretAnnotations:\\n\\s+helm.sh/hook: null\\n\\s+helm.sh/hook-delete-policy: null"
      - lengthEqual:
          path: spec.ignoreDifferences
          count: 3

  - it: renders the global Slack route with continuing tenant routing
    template: templates/addon.yaml
    set:
      mode: addon
      addon: alertmanagerConfig
    asserts:
      - equal:
          path: spec.route.receiver
          value: slack-unrouted
      - notExists:
          path: spec.route.matchers
      - equal:
          path: spec.route.routes[0]
          value:
            receiver: slack
            continue: true
            matchers: [{ name: severity, matchType: "=~", value: "warning|critical" }]
      - lengthEqual:
          path: spec.inhibitRules
          count: 4
      - equal:
          path: spec.receivers[0]
          value: { name: "null" }
