suite: Tenant ruler monitoring
templates:
  - templates/tenant-rules.yaml
set:
  mode: addon
  addon: tenantRules
  tenants: [{ id: example, namespaces: [example] }]
tests:
  - it: keeps the tenant namespace union with per-environment receivers
    set:
      tenants:
        - id: example
          namespaces: [example-dev, example-prod]
          receivers:
            - { name: dev, port: 4320, namespaces: [example-dev] }
            - { name: prod, port: 4321, namespaces: [example-prod] }
    documentSelector:
      path: kind
      value: ThanosRuler
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: metadata.name
          value: example-ruler
      - equal:
          path: spec.ruleNamespaceSelector.matchExpressions
          value:
            - key: kubernetes.io/metadata.name
              operator: In
              values: [example-dev, example-prod]
      - equal:
          path: spec.queryEndpoints
          value: [http://prom-label-proxy-example.monitoring.svc.cluster.local:8080]
  - it: scrapes the governing service and identifies each ruler
    documentSelector:
      path: kind
      value: ServiceMonitor
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.selector.matchLabels
          value:
            operated-thanos-ruler: "true"
            app.kubernetes.io/managed-by: prometheus-operator
      - equal:
          path: spec.endpoints
          value:
            - port: web
              path: /metrics
              relabelings:
                - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_instance]
                  targetLabel: ruler
  - it: alerts on the tenant ruler and shared failure counters
    documentSelector:
      path: kind
      value: PrometheusRule
    asserts:
      - equal:
          path: metadata.namespace
          value: monitoring
      - lengthEqual:
          path: spec.groups[0].rules
          count: 3
      - equal:
          path: spec.groups[0].rules[0].alert
          value: TenantRulerDown
      - equal:
          path: spec.groups[0].rules[0].expr
          value: absent(up{job="thanos-ruler-operated", ruler="example-ruler"} == 1)
      - equal:
          path: spec.groups[0].rules[0].for
          value: 5m
      - equal:
          path: spec.groups[0].rules[0].labels
          value: { severity: critical, tenant: example, namespace: monitoring }
      - equal:
          path: spec.groups[0].rules[1].alert
          value: TenantRulerRuleEvaluationFailures
      - equal:
          path: spec.groups[0].rules[1].expr
          value: increase(prometheus_rule_evaluation_failures_total{job="thanos-ruler-operated"}[10m]) > 0
      - equal:
          path: spec.groups[0].rules[1].for
          value: 10m
      - equal:
          path: spec.groups[0].rules[1].labels
          value: { severity: warning, namespace: monitoring }
      - equal:
          path: spec.groups[0].rules[2].alert
          value: TenantRulerAlertSendFailures
      - equal:
          path: spec.groups[0].rules[2].expr
          value: increase(thanos_alert_sender_errors_total{job="thanos-ruler-operated"}[10m]) > 0
      - equal:
          path: spec.groups[0].rules[2].for
          value: 10m
      - equal:
          path: spec.groups[0].rules[2].labels
          value: { severity: warning, namespace: monitoring }
  - it: emits one monitor and rule bundle for two tenant rulers
    set:
      tenants: [{ id: first, namespaces: [first] }, { id: second, namespaces: [second] }]
    asserts:
      - hasDocuments:
          count: 4
      - lengthEqual:
          path: spec.groups[0].rules
          count: 4
        documentSelector:
          path: kind
          value: PrometheusRule
      - equal:
          path: spec.groups[0].rules[0].expr
          value: absent(up{job="thanos-ruler-operated", ruler="first-ruler"} == 1)
        documentSelector:
          path: kind
          value: PrometheusRule
      - equal:
          path: spec.groups[0].rules[1].alert
          value: TenantRulerDown
        documentSelector:
          path: kind
          value: PrometheusRule
      - equal:
          path: spec.groups[0].rules[1].expr
          value: absent(up{job="thanos-ruler-operated", ruler="second-ruler"} == 1)
        documentSelector:
          path: kind
          value: PrometheusRule
  - it: emits telemetry rules for every tenant namespace in the platform namespace
    set:
      namespace: platform
      tenants: [{ id: shop, namespaces: [shop-dev, shop-prod] }]
    documentSelector:
      path: kind
      value: PrometheusRule
    asserts:
      - equal:
          path: spec.groups[1].name
          value: lgtm-tenant-telemetry
      - lengthEqual:
          path: spec.groups[1].rules
          count: 2
      - equal:
          path: spec.groups[1].rules[0]
          value:
            alert: TenantNoTelemetry
            expr: 'absent_over_time({tenant="shop", namespace="shop-dev"}[15m])'
            for: 5m
            labels: { severity: warning, tenant: shop, namespace: platform, tenant_namespace: shop-dev }
            annotations:
              summary: No telemetry from tenant shop in shop-dev for 20m.
              description: The OTLP stream for this namespace stopped. Check the tenant collector and app in shop-dev first, then the OTLP gateway receiver for tenant shop.
      - equal:
          path: spec.groups[1].rules[1]
          value:
            alert: TenantNoTelemetry
            expr: 'absent_over_time({tenant="shop", namespace="shop-prod"}[15m])'
            for: 5m
            labels: { severity: warning, tenant: shop, namespace: platform, tenant_namespace: shop-prod }
            annotations:
              summary: No telemetry from tenant shop in shop-prod for 20m.
              description: The OTLP stream for this namespace stopped. Check the tenant collector and app in shop-prod first, then the OTLP gateway receiver for tenant shop.
  - it: emits telemetry rules for both active tenants
    set:
      tenants: [{ id: first, namespaces: [first] }, { id: second, namespaces: [second] }]
    documentSelector:
      path: kind
      value: PrometheusRule
    asserts:
      - lengthEqual:
          path: spec.groups[1].rules
          count: 2
      - equal:
          path: spec.groups[1].rules[0].expr
          value: 'absent_over_time({tenant="first", namespace="first"}[15m])'
      - equal:
          path: spec.groups[1].rules[0].labels
          value: { severity: warning, tenant: first, namespace: monitoring, tenant_namespace: first }
      - equal:
          path: spec.groups[1].rules[1].expr
          value: 'absent_over_time({tenant="second", namespace="second"}[15m])'
      - equal:
          path: spec.groups[1].rules[1].labels
          value: { severity: warning, tenant: second, namespace: monitoring, tenant_namespace: second }
  - it: emits no resources without tenants
    set:
      tenants: []
    asserts:
      - hasDocuments:
          count: 0
  - it: emits no resources without namespaces
    set:
      tenants: [{ id: example }]
    asserts:
      - hasDocuments:
          count: 0
  - it: emits no resources when the proxy is disabled
    set:
      components.promLabelProxy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
