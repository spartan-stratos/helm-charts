apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: otlp-secrets
  namespace: {{ required "namespace is required" .Values.namespace | quote }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "region is required" .Values.region | quote }}
      auth:
        jwt:
          serviceAccountRef:
            name: otlp-secrets
