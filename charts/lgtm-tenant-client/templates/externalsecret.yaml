apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: otlp-basic-auth
  namespace: {{ required "namespace is required" .Values.namespace | quote }}
spec:
  secretStoreRef:
    name: otlp-secrets
    kind: SecretStore
  target:
    name: otlp-basic-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: {{ "{{ .username }}" | quote }}
        password: {{ "{{ .password }}" | quote }}
        otlp-headers: {{ "Authorization=Basic {{ printf \"%s:%s\" .username .password | b64enc }}" | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "secretName is required" .Values.secretName | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ required "secretName is required" .Values.secretName | quote }}
        property: password
